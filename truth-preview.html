<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terra Umbra — Preview Vérité</title>
<style>
:root{--bg:#0b0f12;--panel:#111820;--line:#25313d;--text:#eaf0f4;--muted:#93a3af;--accent:#48d7b1;--danger:#ff6b7a;--warn:#ffcc66;--good:#56d987;--radius:16px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#132029 0,#0b0f12 35%);color:var(--text);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}.shell{max-width:1500px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--accent);font-weight:800}.head h1{margin:.2rem 0 .1rem;font-size:38px}.sub{color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:310px minmax(0,1fr) 290px;gap:18px}.box{background:rgba(17,24,32,.96);border:1px solid var(--line);border-radius:var(--radius);padding:18px}.sticky{position:sticky;top:18px}.nature-list{display:grid;gap:8px}.nature{width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0e151b;color:var(--text);cursor:pointer}.nature.selected{border-color:var(--accent);background:#10201f}.nature strong{display:block}.nature span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.section-title{display:flex;justify-content:space-between;gap:15px;align-items:end}.section-title h2{margin:0;font-size:27px}.kpi{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#0d141a;font-weight:800}.good{color:var(--good)}.bad{color:var(--danger)}.controls,.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;font-weight:800;color:#bac7cf;text-transform:uppercase;letter-spacing:.06em}.field select,.toolbar input{background:#0c1217;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.ptv{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border:1px solid #315f58;border-radius:13px;background:#0e211e;margin:14px 0}.ptv strong:last-child{font-size:28px}.subhead{margin:22px 0 10px;font-size:17px}.trait-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}.trait{padding:11px;border:1px solid #28414a;border-radius:11px;background:#0e1a1d}.trait-head{display:flex;justify-content:space-between;gap:10px}.trait p{margin:6px 0 0;color:var(--muted);font-size:12px}.chip{font-size:10px;border:1px solid #34414b;border-radius:999px;padding:2px 6px;color:#b7c7d0}.cost{color:var(--accent);border-color:#286453}.lock{color:var(--warn);border-color:#6e5b25}.toolbar{display:flex;gap:8px;align-items:center;margin:14px 0}.toolbar input{flex:1}.group{border:1px solid var(--line);border-radius:12px;margin:9px 0;overflow:hidden}.group summary{cursor:pointer;padding:11px 13px;background:#111a22;font-weight:800}.list{display:grid;gap:7px;padding:9px}.talent{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0c1318}.talent.locked{opacity:.5}.talent strong{display:block}.desc{display:block;color:var(--muted);font-size:12px;margin-top:4px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.line{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #202b35}.owned{padding:8px;border:1px solid var(--line);border-radius:9px;margin:6px 0;background:#0d141a}.notice{padding:10px 12px;border:1px solid #5b4c25;background:#1a1710;border-radius:10px;color:#ffe2a0;margin:10px 0}.link{color:var(--accent)}@media(max-width:1000px){.layout{grid-template-columns:1fr}.sticky{position:static}.controls,.choices{grid-template-columns:1fr}}
</style>
</head>
<body><div class="shell"><header class="head"><div><div class="eyebrow">TERRA UMBRA / CALIFORNIA</div><h1>Preview Vérité</h1><p class="sub">Nature → sous-choix → dons gratuits → Talents PTV</p></div><a class="link" href="./">← Site actuel</a></header><div id="error"></div><div class="layout"><aside class="box sticky"><h3>Natures</h3><div id="natures" class="nature-list"></div></aside><main class="box"><div id="main"></div></main><aside class="box sticky"><h3>Résumé</h3><div id="summary"></div></aside></div></div>
<script type="module">
const RAW='https://raw.githubusercontent.com/Helclaeynn/Terra-Umbra-Builder/feature/tuc-character-builder-v1/character-builder/rulesets/terra-umbra/truth';
const get=async p=>{const r=await fetch(`${RAW}/${p}`,{cache:'no-store'});if(!r.ok)throw new Error(`${p}: ${r.status}`);return r.json()};
const maybe=async p=>{try{return await get(p)}catch{return null}};
const core=await get('core.json');
const defaultCon=[{id:'profane',name:'Profane'},{id:'eveille',name:'Éveillé'},{id:'initie',name:'Initié'}];
const S={nature:'humain',consciousness:'profane',choices:{hunterTradition:'doctrine_commune'},talents:[],search:''};let catalog=[];
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const nature=()=>core.natures.find(n=>n.id===S.nature)||core.natures[0],talent=id=>catalog.find(t=>t.id===id),bought=id=>S.talents.includes(id),spent=()=>S.talents.reduce((a,id)=>a+(talent(id)?.cost||0),0),left=()=>5-spent();
function selectedName(key){const c=nature().choices?.find(x=>x.key===key);return c?.options?.find(x=>x.id===S.choices[key])?.name||''}
function needles(){return(nature().choices||[]).map(c=>norm(selectedName(c.key).split('—')[0])).filter(x=>x&&!['aucune','aucun'].includes(x))}
function visible(t){const q=norm(S.search);if(q&&!norm(`${t.name} ${t.group||''} ${t.effect||''}`).includes(q))return false;if(!needles().length||S.nature==='mage')return true;const g=norm(`${t.group||''} ${t.name||''}`);if(g.includes('commun')||g.includes('nature')||g.includes('progression')||g.includes('maitrise')||g.includes('route commune'))return true;return needles().some(n=>g.includes(n))}
function prereqId(t){if(t.prerequisite&&catalog.some(x=>x.id===t.prerequisite))return t.prerequisite;const raw=t.prerequisiteName||'';if(!raw)return'';const n=norm(raw.replace(/^prerequis\s*:?/i,''));return catalog.find(x=>norm(x.name)===n)?.id||''}
function locked(t){const p=prereqId(t);return !!p&&!bought(p)}
async function load(id){S.nature=id;S.talents=[];S.search='';S.choices={};for(const c of nature().choices||[]){if(!c.optional&&c.options?.length)S.choices[c.key]=c.options[0].id}catalog=(await maybe(`talents/${id}.json`))||[];render()}
function selectField(label,items,val,cb,ph='— Choisir —'){const d=document.createElement('div');d.className='field';d.innerHTML=`<label>${esc(label)}</label>`;const s=document.createElement('select');s.innerHTML=`<option value="">${esc(ph)}</option>`+items.map(x=>`<option value="${esc(x.id)}" ${x.id===val?'selected':''}>${esc(x.name)}</option>`).join('');s.onchange=e=>cb(e.target.value);d.append(s);return d}
function render(){renderNatures();renderMain();renderSummary()}
function renderNatures(){const n=$('#natures');n.innerHTML='';for(const x of core.natures){const b=document.createElement('button');b.className=`nature ${x.id===S.nature?'selected':''}`;b.innerHTML=`<strong>${esc(x.name)}</strong><span>${esc(x.description||'')}</span>`;b.onclick=()=>load(x.id);n.append(b)}}
function renderMain(){const n=nature(),m=$('#main');m.innerHTML=`<div class="section-title"><div><h2>${esc(n.name)}</h2><p class="sub">${esc(n.description||'')}</p></div><div class="kpi ${left()>=0?'good':'bad'}">PTV ${spent()} / 5</div></div>`;const c=document.createElement('div');c.className='controls';c.append(selectField('Conscience',core.consciousness||defaultCon,S.consciousness,v=>{S.consciousness=v;render()}));m.append(c);if(n.choices?.length){const r=document.createElement('div');r.className='choices';for(const x of n.choices)r.append(selectField(x.label+(x.optional?' (optionnel)':''),x.options||[],S.choices[x.key]||'',v=>{S.choices[x.key]=v;S.talents=[];render()},x.optional?'— Aucun —':'— Choisir —'));m.append(r)}const p=document.createElement('div');p.className='ptv';p.innerHTML=`<div><strong>Réserve de Vérité</strong><div class="sub">Les PTV achètent des capacités, jamais la possession d’un objet. Les tags V / SR / R rappellent seulement les conditions d’usage en jeu.</div></div><strong>${left()} PTV</strong>`;m.append(p);if(n.freeTraits?.length){const h=document.createElement('h3');h.className='subhead';h.textContent='Dons gratuits de Nature';m.append(h);const g=document.createElement('div');g.className='trait-grid';for(const t of n.freeTraits){const d=document.createElement('div');d.className='trait';d.innerHTML=`<div class="trait-head"><strong>${esc(t.name)}</strong><span class="chip">${esc(t.access||'—')}</span></div><p>${esc(t.effect||'')}</p>`;g.append(d)}m.append(g)}const h=document.createElement('h3');h.className='subhead';h.textContent='Talents, Voies & Traditions PTV';m.append(h);const tb=document.createElement('div');tb.className='toolbar';tb.innerHTML=`<input placeholder="Rechercher…" value="${esc(S.search)}"><span class="chip">${catalog.length} importé(s)</span>`;tb.querySelector('input').oninput=e=>{S.search=e.target.value;renderTalents()};m.append(tb);const l=document.createElement('div');l.id='talents';m.append(l);renderTalents();if(!catalog.length){const d=document.createElement('div');d.className='notice';d.textContent='Structure disponible, catalogue PTV encore en cours d’import pour cette Nature.';m.insertBefore(d,l)}}
function renderTalents(){const l=$('#talents');if(!l)return;l.innerHTML='';const groups=new Map();for(const t of catalog.filter(visible)){const g=t.group||'Talents de Vérité';if(!groups.has(g))groups.set(g,[]);groups.get(g).push(t)}if(!groups.size){l.innerHTML='<div class="notice">Aucun Talent ne correspond aux choix actuels.</div>';return}for(const [g,items] of groups){const d=document.createElement('details');d.className='group';d.open=groups.size<7||items.some(x=>bought(x.id));d.innerHTML=`<summary>${esc(g)} (${items.length})</summary>`;const il=document.createElement('div');il.className='list';for(const t of items){const lk=locked(t),is=bought(t.id),p=prereqId(t),pn=p?talent(p)?.name:(t.prerequisiteName||'');const row=document.createElement('label');row.className=`talent ${lk?'locked':''}`;row.innerHTML=`<input type="checkbox" ${is?'checked':''} ${lk?'disabled':''}><div><strong>${esc(t.name)}</strong><div class="chips"><span class="chip cost">${Number(t.cost||0)} PTV</span><span class="chip">${esc(t.access||'—')}</span>${pn?`<span class="chip lock">Prérequis : ${esc(pn)}</span>`:''}${is?'<span class="chip good">Acheté</span>':''}</div><span class="desc">${esc(t.effect||'')}</span></div>`;row.querySelector('input').onchange=e=>{if(e.target.checked){if(lk||spent()+Number(t.cost||0)>5){e.target.checked=false;return}S.talents.push(t.id)}else{S.talents=S.talents.filter(x=>x!==t.id)}render()};il.append(row)}d.append(il);l.append(d)}}
function renderSummary(){const s=$('#summary'),n=nature();s.innerHTML=`<div class="line"><span>Nature</span><strong>${esc(n.name)}</strong></div><div class="line"><span>Conscience</span><strong>${esc((core.consciousness||defaultCon).find(x=>x.id===S.consciousness)?.name||'—')}</strong></div><div class="line"><span>PTV</span><strong>${spent()} / 5</strong></div><div class="line"><span>Réserve</span><strong>${left()}</strong></div>`;for(const c of n.choices||[]){const v=selectedName(c.key);if(v)s.innerHTML+=`<div class="line"><span>${esc(c.label)}</span><strong>${esc(v)}</strong></div>`}s.innerHTML+='<h4>Achats</h4>';if(!S.talents.length)s.innerHTML+='<div class="sub">Aucun.</div>';for(const id of S.talents){const t=talent(id);if(t)s.innerHTML+=`<div class="owned"><strong>${esc(t.name)}</strong><div class="sub">${t.cost} PTV · ${esc(t.access||'—')}</div></div>`}}
try{await load('humain')}catch(e){$('#error').innerHTML=`<div class="notice">Erreur : ${esc(e.message)}</div>`}
</script></body></html>
