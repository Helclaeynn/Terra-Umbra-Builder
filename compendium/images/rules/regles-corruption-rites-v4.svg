<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 710" role="img" aria-labelledby="title desc">
<title id="title">DON, RITE ou FAVEUR : tester la Souillure ?</title>
<desc id="desc">1 · DON personnel : Aucun test de Souillure à chaque usage, sauf mention explicite. ; 2 · RITE ou FAVEUR : Chaque activation surnaturelle déclenche un test, même si le pouvoir échoue. ; 3 · Fixer la difficulté : Coût 1 PTV : 15 ; 2 PTV : 18 ; 3 PTV : 21 ; exception explicite : 25. ; 4 · Résister : Volonté + Force Mentale ; si explicitement corporel : Vigueur + Constitution. ; 5 · Maintenir : Un maintien ne reteste pas ; nouvelle activation, nouveau test.. Purifier le porteur à 0 endort ses Dons ; les Rites appris restent connus.</desc>
<rect width="1060" height="710" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="1058" height="708" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="32" y="42" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#eef7f7">DON, RITE ou FAVEUR : tester la Souillure ?</text>
<rect x="31" y="98" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="98" width="5" height="86" rx="2" fill="#5de0d0"/>
<text x="50" y="132" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#5de0d0">1 · DON personnel</text>
<text x="50" y="167" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Aucun test de Souillure à chaque usage, sauf mention explicite.</text>
<text x="523" y="200" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="202" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="202" width="5" height="86" rx="2" fill="#8ab9ff"/>
<text x="50" y="236" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8ab9ff">2 · RITE ou FAVEUR</text>
<text x="50" y="271" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Chaque activation surnaturelle déclenche un test, même si le pouvoir échoue.</text>
<text x="523" y="304" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="306" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="306" width="5" height="86" rx="2" fill="#f2bd78"/>
<text x="50" y="340" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#f2bd78">3 · Fixer la difficulté</text>
<text x="50" y="375" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Coût 1 PTV : 15 ; 2 PTV : 18 ; 3 PTV : 21 ; exception explicite : 25.</text>
<text x="523" y="408" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="410" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="410" width="5" height="86" rx="2" fill="#8fdea7"/>
<text x="50" y="444" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8fdea7">4 · Résister</text>
<text x="50" y="479" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Volonté + Force Mentale ; si explicitement corporel : Vigueur + Constitution.</text>
<text x="523" y="512" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="514" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="514" width="5" height="86" rx="2" fill="#ca9bdf"/>
<text x="50" y="548" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#ca9bdf">5 · Maintenir</text>
<text x="50" y="583" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Un maintien ne reteste pas ; nouvelle activation, nouveau test.</text>
<text x="33" y="636" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#f1cfa1">Purifier le porteur à 0 endort ses Dons ; les Rites appris restent connus.</text>
</svg>
