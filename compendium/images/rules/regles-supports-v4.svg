<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 710" role="img" aria-labelledby="title desc">
<title id="title">Augmentations : support, slot et bonus</title>
<desc id="desc">1 · Repérer le support : Une augmentation support ouvre ses slots ; un module doit être compatible. ; 2 · Vérifier l’emplacement : Chaque module occupe ses slots ; un œil est un support séparé de l’autre. ; 3 · Appliquer l’exclusivité : Une peau globale principale ; armure et camouflage dermiques exigent un modèle compatible. ; 4 · Vérifier les bonus : Visée, Viser, Verrouillage : garder le meilleur bonus de ciblage. ; 5 · Reporter le coût : Charge et Stress de chaque élément installé suivent leurs règles propres.. Un support ne confère pas automatiquement les propriétés de ses modules.</desc>
<rect width="1060" height="710" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="1058" height="708" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="32" y="42" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#eef7f7">Augmentations : support, slot et bonus</text>
<rect x="31" y="98" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="98" width="5" height="86" rx="2" fill="#5de0d0"/>
<text x="50" y="132" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#5de0d0">1 · Repérer le support</text>
<text x="50" y="167" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Une augmentation support ouvre ses slots ; un module doit être compatible.</text>
<text x="523" y="200" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="202" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="202" width="5" height="86" rx="2" fill="#8ab9ff"/>
<text x="50" y="236" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8ab9ff">2 · Vérifier l’emplacement</text>
<text x="50" y="271" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Chaque module occupe ses slots ; un œil est un support séparé de l’autre.</text>
<text x="523" y="304" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="306" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="306" width="5" height="86" rx="2" fill="#f2bd78"/>
<text x="50" y="340" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#f2bd78">3 · Appliquer l’exclusivité</text>
<text x="50" y="375" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Une peau globale principale ; armure et camouflage dermiques exigent un modèle</text>
<text x="50" y="398" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">compatible.</text>
<text x="523" y="408" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="410" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="410" width="5" height="86" rx="2" fill="#8fdea7"/>
<text x="50" y="444" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8fdea7">4 · Vérifier les bonus</text>
<text x="50" y="479" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Visée, Viser, Verrouillage : garder le meilleur bonus de ciblage.</text>
<text x="523" y="512" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="514" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="514" width="5" height="86" rx="2" fill="#ca9bdf"/>
<text x="50" y="548" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#ca9bdf">5 · Reporter le coût</text>
<text x="50" y="583" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Charge et Stress de chaque élément installé suivent leurs règles propres.</text>
<text x="33" y="636" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#f1cfa1">Un support ne confère pas automatiquement les propriétés de ses modules.</text>
</svg>
