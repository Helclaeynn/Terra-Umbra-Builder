<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 830" role="img" aria-labelledby="title desc">
<title id="title">Affinité : peut-on lancer ?</title>
<desc id="desc">Une Affinité non éveillée permet une improvisation en Maîtrise Initiale et Amplitude Mineure avec un niveau de difficulté en plus, par exemple 15 devient 18. Pour progresser dans cette Affinité, il faut ensuite l’éveiller par les dépenses et prérequis prévus.</desc>
<rect width="540" height="830" rx="22" fill="#0c1820"/>
<rect x="1" y="1" width="538" height="828" rx="21" fill="none" stroke="#476775" stroke-width="2"/>
<text x="24" y="43" fill="#eef7f7" font-size="24" font-weight="700" font-family="system-ui, sans-serif">Affinité : peut-on lancer ?</text>
<rect x="22" y="70" width="496" height="83" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="42" y="103" fill="#f0f7f6" font-size="20" font-weight="700" font-family="system-ui, sans-serif">L’Affinité est-elle éveillée ?</text>
<text x="42" y="133" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">Le Mageius peut aussi improviser.</text>
<rect x="22" y="179" width="496" height="80" rx="15" fill="#18302b" stroke="#83cba1"/>
<text x="42" y="211" fill="#a8e9b9" font-size="20" font-weight="700" font-family="system-ui, sans-serif">OUI → lancement possible</text>
<text x="42" y="239" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">selon les rangs réellement acquis.</text>
<rect x="22" y="278" width="496" height="82" rx="15" fill="#30281f" stroke="#f2bd78"/>
<text x="42" y="311" fill="#f2bd78" font-size="17" font-weight="700" font-family="system-ui, sans-serif">NON → improviser Initiale / Mineure</text>
<text x="42" y="340" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">Difficulté +1 niveau (15 → 18).</text>
<text x="24" y="403" fill="#f2bd78" font-size="21" font-weight="700" font-family="system-ui, sans-serif">Pour dépasser cette limite :</text>
<rect x="22" y="431" width="496" height="98" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="42" y="465" fill="#f0f7f6" font-size="19" font-weight="700" font-family="system-ui, sans-serif">2e / 3e native</text>
<text x="42" y="500" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">1 PTV ; progression préalable</text>
<rect x="22" y="548" width="496" height="98" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="42" y="582" fill="#f0f7f6" font-size="19" font-weight="700" font-family="system-ui, sans-serif">Type adjacent</text>
<text x="42" y="617" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">3 PTV ; native à Maîtrise Supérieure</text>
<rect x="22" y="665" width="496" height="98" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="42" y="699" fill="#f0f7f6" font-size="19" font-weight="700" font-family="system-ui, sans-serif">Type éloigné</text>
<text x="42" y="734" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">Accord intermédiaire + 2 PTV</text>
<text x="25" y="803" fill="#f1cfa1" font-size="16" font-weight="400" font-family="system-ui, sans-serif">Éveiller l’Affinité ouvre sa progression.</text>
</svg>
