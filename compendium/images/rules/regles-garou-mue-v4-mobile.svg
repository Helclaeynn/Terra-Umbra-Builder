<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 977" role="img" aria-labelledby="title desc">
<title id="title">Mue hybride : quand arrive le +1 PA ?</title>
<desc id="desc">1 · Déclarer la Mue : De V, SR ou humain révélé vers hybride : réserver un round entier. ; 2 · Compter les Mues : Depuis le dernier repos : 1re automatique ; 2e 15 ; 3e 18 ; 4e 21 ; 5e+ 25. ; 3 · Si le test échoue : Forcer : 3 PV irréductibles ; échec narratif : round perdu, plus de Mue cette scène. ; 4 · Round suivant : La forme hybride est achevée au début du round suivant. ; 5 · Rounds ultérieurs : Le +1 PA hybride commence seulement après ce round d’achèvement.. Passer de l’humain révélé à l’animal coûte 1 PA, sans épuisement hybride normal.</desc>
<rect width="540" height="977" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="538" height="975" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="25" y="42" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#eef7f7">Mue hybride : quand arrive le</text>
<text x="25" y="72" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#eef7f7">+1 PA ?</text>
<rect x="20" y="104" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="104" width="5" height="133" rx="2" fill="#5de0d0"/>
<text x="39" y="138" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#5de0d0">1 · Déclarer la Mue</text>
<text x="39" y="172" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">De V, SR ou humain révélé vers hybride :</text>
<text x="39" y="198" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">réserver un round entier.</text>
<text x="263" y="253" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="255" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="255" width="5" height="133" rx="2" fill="#8ab9ff"/>
<text x="39" y="289" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#8ab9ff">2 · Compter les Mues</text>
<text x="39" y="323" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Depuis le dernier repos : 1re automatique</text>
<text x="39" y="349" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">; 2e 15 ; 3e 18 ; 4e 21 ; 5e+ 25.</text>
<text x="263" y="404" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="406" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="406" width="5" height="133" rx="2" fill="#f2bd78"/>
<text x="39" y="440" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#f2bd78">3 · Si le test échoue</text>
<text x="39" y="474" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Forcer : 3 PV irréductibles ; échec</text>
<text x="39" y="500" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">narratif : round perdu, plus de Mue cette</text>
<text x="39" y="526" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">scène.</text>
<text x="263" y="555" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="557" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="557" width="5" height="133" rx="2" fill="#8fdea7"/>
<text x="39" y="591" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#8fdea7">4 · Round suivant</text>
<text x="39" y="625" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">La forme hybride est achevée au début du</text>
<text x="39" y="651" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">round suivant.</text>
<text x="263" y="706" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="708" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="708" width="5" height="133" rx="2" fill="#ca9bdf"/>
<text x="39" y="742" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#ca9bdf">5 · Rounds ultérieurs</text>
<text x="39" y="776" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Le +1 PA hybride commence seulement après</text>
<text x="39" y="802" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">ce round d’achèvement.</text>
<text x="24" y="877" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#f1cfa1">Passer de l’humain révélé à l’animal coûte 1</text>
<text x="24" y="904" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#f1cfa1">PA, sans épuisement hybride normal.</text>
</svg>
