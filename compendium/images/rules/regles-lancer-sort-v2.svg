<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" role="img" aria-labelledby="title desc">
<title id="title">Exemple : Amplitude et portée d’un sort</title>
<desc id="desc">Amplitude : Possédée Majeure ; utilisée Significative ; Difficulté : Base 18 → 15 (avance) → 18 (à vue) ; Libération : Difficulté 18 ; 2 PA ; +2 Tension. La portée annule ici le cran de difficulté gagné.</desc>
