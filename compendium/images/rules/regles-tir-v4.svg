<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 710" role="img" aria-labelledby="title desc">
<title id="title">Tir : ordinaire, Rafale ou Suppression ?</title>
<desc id="desc">1 · Choisir le mode : Tir ordinaire ; Rafale si l’arme porte Rafale ; Suppression si Automatique. ; 2 · Préparer si possible : Viser : 1 PA, +3 au Tir suivant ; incompatible avec Rafale et Suppression. ; 3 · Tir ordinaire : Marge 1–5 : DGT − Armure ; 6–10 : idem + Altération ; 11+ : 2 × DGT − Armure + Altération. ; 4 · Rafale : Un jet : 1 / 2 / 3 impacts pour marges 1–5 / 6–10 / 11+ ; chacun DGT − Armure. ; 5 · Suppression : Valeur du jet jusqu’à fin du round ; cible exposée avec Défense passive plus faible : 1 impact.. Rafale et Suppression ne produisent pas d’Altération ; Suppression ne permet pas de Défense active.</desc>
<rect width="1060" height="710" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="1058" height="708" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="32" y="42" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#eef7f7">Tir : ordinaire, Rafale ou Suppression ?</text>
<rect x="31" y="98" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="98" width="5" height="86" rx="2" fill="#5de0d0"/>
<text x="50" y="132" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#5de0d0">1 · Choisir le mode</text>
<text x="50" y="167" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Tir ordinaire ; Rafale si l’arme porte Rafale ; Suppression si Automatique.</text>
<text x="523" y="200" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="202" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="202" width="5" height="86" rx="2" fill="#8ab9ff"/>
<text x="50" y="236" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8ab9ff">2 · Préparer si possible</text>
<text x="50" y="271" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Viser : 1 PA, +3 au Tir suivant ; incompatible avec Rafale et Suppression.</text>
<text x="523" y="304" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="306" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="306" width="5" height="86" rx="2" fill="#f2bd78"/>
<text x="50" y="340" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#f2bd78">3 · Tir ordinaire</text>
<text x="50" y="375" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Marge 1–5 : DGT − Armure ; 6–10 : idem + Altération ; 11+ : 2 × DGT − Armure +</text>
<text x="50" y="398" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Altération.</text>
<text x="523" y="408" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="410" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="410" width="5" height="86" rx="2" fill="#8fdea7"/>
<text x="50" y="444" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8fdea7">4 · Rafale</text>
<text x="50" y="479" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Un jet : 1 / 2 / 3 impacts pour marges 1–5 / 6–10 / 11+ ; chacun DGT − Armure.</text>
<text x="523" y="512" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="514" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="514" width="5" height="86" rx="2" fill="#ca9bdf"/>
<text x="50" y="548" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#ca9bdf">5 · Suppression</text>
<text x="50" y="583" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Valeur du jet jusqu’à fin du round ; cible exposée avec Défense passive plus faible</text>
<text x="50" y="606" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">: 1 impact.</text>
<text x="33" y="636" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#f1cfa1">Rafale et Suppression ne produisent pas d’Altération ; Suppression ne permet pas de Défense active.</text>
</svg>
