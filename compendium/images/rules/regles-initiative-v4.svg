<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 710" role="img" aria-labelledby="title desc">
<title id="title">Une Réaction consomme une passe future</title>
<desc id="desc">1 · Initiative : Agilité + Athlétisme + 1d10e : 1 à 10 = 1 PA ; 11 à 15 = 2 ; 16+ = 3. ; 2 · Passes : Avec 4 PA, agir aux passes 1, 2, 3 et 4 ; la passe 1 est commune à tous. ; 3 · Réagir : Après la passe 1, Défense active : dépenser 1 PA du round. ; 4 · Déduire : Supprimer la plus haute passe future disponible : ici la passe 4. ; 5 · Reprendre : Le personnage agit encore aux passes 2 et 3, puis son round est fini.. Un 1 naturel à l’Initiative plafonne à 1 PA, quel que soit le total.</desc>
<rect width="1060" height="710" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="1058" height="708" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="32" y="42" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#eef7f7">Une Réaction consomme une passe future</text>
<rect x="31" y="98" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="98" width="5" height="86" rx="2" fill="#5de0d0"/>
<text x="50" y="132" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#5de0d0">1 · Initiative</text>
<text x="50" y="167" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Agilité + Athlétisme + 1d10e : 1 à 10 = 1 PA ; 11 à 15 = 2 ; 16+ = 3.</text>
<text x="523" y="200" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="202" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="202" width="5" height="86" rx="2" fill="#8ab9ff"/>
<text x="50" y="236" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8ab9ff">2 · Passes</text>
<text x="50" y="271" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Avec 4 PA, agir aux passes 1, 2, 3 et 4 ; la passe 1 est commune à tous.</text>
<text x="523" y="304" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="306" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="306" width="5" height="86" rx="2" fill="#f2bd78"/>
<text x="50" y="340" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#f2bd78">3 · Réagir</text>
<text x="50" y="375" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Après la passe 1, Défense active : dépenser 1 PA du round.</text>
<text x="523" y="408" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="410" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="410" width="5" height="86" rx="2" fill="#8fdea7"/>
<text x="50" y="444" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8fdea7">4 · Déduire</text>
<text x="50" y="479" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Supprimer la plus haute passe future disponible : ici la passe 4.</text>
<text x="523" y="512" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="514" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="514" width="5" height="86" rx="2" fill="#ca9bdf"/>
<text x="50" y="548" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#ca9bdf">5 · Reprendre</text>
<text x="50" y="583" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Le personnage agit encore aux passes 2 et 3, puis son round est fini.</text>
<text x="33" y="636" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#f1cfa1">Un 1 naturel à l’Initiative plafonne à 1 PA, quel que soit le total.</text>
</svg>
