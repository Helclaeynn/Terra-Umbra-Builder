<text x="42" y="381" fill="#d1e1e3" font-size="21" font-family="system-ui, sans-serif">Test adapté : physique ou mental</text>
<rect x="22" y="503" width="496" height="182" rx="15" fill="#162a34" stroke="#49606b"/>
