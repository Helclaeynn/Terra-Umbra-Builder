<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 780" role="img" aria-labelledby="title desc">
<title id="title">Exposition et Corruption</title>
<desc id="desc">Identifier : Source et voie d’exposition ; Résister : Test adapté : physique ou mental ; Conséquence : Succès : 0 · échec : +1 · échec narratif : +2. L’Humanité fixe l’Intégrité ; elle ne s’ajoute pas au test.</desc>
