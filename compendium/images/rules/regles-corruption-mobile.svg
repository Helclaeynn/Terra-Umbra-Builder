<text x="42" y="585" fill="#d1e1e3" font-size="21" font-family="system-ui, sans-serif">Succès : 0 · échec : +1 · échec</text>
<text x="42" y="614" fill="#d1e1e3" font-size="21" font-family="system-ui, sans-serif">narratif : +2</text>
<text x="25" y="717" fill="#f1cfa1" font-size="19" font-family="system-ui, sans-serif">L’Humanité fixe l’Intégrité ; elle ne</text>
