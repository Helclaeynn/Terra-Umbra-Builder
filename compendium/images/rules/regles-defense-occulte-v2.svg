<text x="52" y="164" fill="#f0f7f6" font-size="21" font-weight="700" font-family="system-ui, sans-serif">Pierre projetée</text>
<text x="52" y="202" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">Évitable physiquement : Défense</text>
<text x="52" y="229" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">physique</text>
<rect x="374" y="82" width="312" height="190" rx="16" fill="#162a34" stroke="#49606b"/>
<rect x="374" y="82" width="312" height="5" rx="2" fill="#8ab9ff"/>
<text x="394" y="129" fill="#8ab9ff" font-size="23" font-weight="700" font-family="system-ui, sans-serif">02</text>
<text x="394" y="164" fill="#f0f7f6" font-size="21" font-weight="700" font-family="system-ui, sans-serif">Malédiction</text>
<text x="394" y="202" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">Imposition directe : Défense</text>
<text x="394" y="229" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">occulte</text>
<rect x="716" y="82" width="312" height="190" rx="16" fill="#162a34" stroke="#49606b"/>
