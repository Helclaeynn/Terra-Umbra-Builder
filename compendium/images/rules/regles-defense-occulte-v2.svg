<text x="736" y="202" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">Si permise : défense active pour</text>
<text x="736" y="229" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">1 PA</text>
<text x="34" y="322" fill="#f1cfa1" font-size="18" font-family="system-ui, sans-serif">Une même attaque n’utilise jamais les deux Défenses.</text>
