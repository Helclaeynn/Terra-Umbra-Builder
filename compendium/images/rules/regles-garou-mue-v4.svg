<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 710" role="img" aria-labelledby="title desc">
<title id="title">Mue hybride : quand arrive le +1 PA ?</title>
<desc id="desc">1 · Déclarer la Mue : De V, SR ou humain révélé vers hybride : réserver un round entier. ; 2 · Compter les Mues : Depuis le dernier repos : 1re automatique ; 2e 15 ; 3e 18 ; 4e 21 ; 5e+ 25. ; 3 · Si le test échoue : Forcer : 3 PV irréductibles ; échec narratif : round perdu, plus de Mue cette scène. ; 4 · Round suivant : La forme hybride est achevée au début du round suivant. ; 5 · Rounds ultérieurs : Le +1 PA hybride commence seulement après ce round d’achèvement.. Passer de l’humain révélé à l’animal coûte 1 PA, sans épuisement hybride normal.</desc>
<rect width="1060" height="710" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="1058" height="708" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="32" y="42" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#eef7f7">Mue hybride : quand arrive le +1 PA ?</text>
<rect x="31" y="98" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="98" width="5" height="86" rx="2" fill="#5de0d0"/>
<text x="50" y="132" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#5de0d0">1 · Déclarer la Mue</text>
<text x="50" y="167" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">De V, SR ou humain révélé vers hybride : réserver un round entier.</text>
<text x="523" y="200" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="202" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="202" width="5" height="86" rx="2" fill="#8ab9ff"/>
<text x="50" y="236" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8ab9ff">2 · Compter les Mues</text>
<text x="50" y="271" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Depuis le dernier repos : 1re automatique ; 2e 15 ; 3e 18 ; 4e 21 ; 5e+ 25.</text>
<text x="523" y="304" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="306" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="306" width="5" height="86" rx="2" fill="#f2bd78"/>
<text x="50" y="340" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#f2bd78">3 · Si le test échoue</text>
<text x="50" y="375" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Forcer : 3 PV irréductibles ; échec narratif : round perdu, plus de Mue cette scène.</text>
<text x="523" y="408" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="410" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="410" width="5" height="86" rx="2" fill="#8fdea7"/>
<text x="50" y="444" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8fdea7">4 · Round suivant</text>
<text x="50" y="479" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">La forme hybride est achevée au début du round suivant.</text>
<text x="523" y="512" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="514" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="514" width="5" height="86" rx="2" fill="#ca9bdf"/>
<text x="50" y="548" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#ca9bdf">5 · Rounds ultérieurs</text>
<text x="50" y="583" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Le +1 PA hybride commence seulement après ce round d’achèvement.</text>
<text x="33" y="636" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#f1cfa1">Passer de l’humain révélé à l’animal coûte 1 PA, sans épuisement hybride normal.</text>
</svg>
