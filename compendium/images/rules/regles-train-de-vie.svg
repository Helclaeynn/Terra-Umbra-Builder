<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" role="img" aria-labelledby="title desc">
<title id="title">Train de vie et charges fixes</title>
<desc id="desc">Point de départ : Train de vie de base ; Déduire les charges : Logement, véhicule, dettes et autres charges fixes ; Recalculer : Train de vie effectif, puis reste disponible. Le Train de vie n’est pas le salaire du personnage.</desc>
<rect width="1060" height="360" rx="22" fill="#0c1820"/>
<rect x="1" y="1" width="1058" height="358" rx="21" fill="none" stroke="#476775" stroke-width="2"/>
<text x="34" y="50" fill="#eef7f7" font-size="28" font-weight="700" font-family="system-ui, sans-serif">Train de vie et charges fixes</text>
<rect x="32" y="82" width="312" height="190" rx="16" fill="#162a34" stroke="#49606b"/>
<rect x="32" y="82" width="312" height="5" rx="2" fill="#5de0d0"/>
<text x="52" y="129" fill="#5de0d0" font-size="23" font-weight="700" font-family="system-ui, sans-serif">01</text>
<text x="52" y="164" fill="#f0f7f6" font-size="21" font-weight="700" font-family="system-ui, sans-serif">Point de départ</text>
<text x="52" y="202" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">Train de vie de base</text>
<path d="M 348 177 h 22 m -8 -8 l 8 8 -8 8" fill="none" stroke="#a6d6d6" stroke-width="3"/>
<rect x="374" y="82" width="312" height="190" rx="16" fill="#162a34" stroke="#49606b"/>
<rect x="374" y="82" width="312" height="5" rx="2" fill="#8ab9ff"/>
<text x="394" y="129" fill="#8ab9ff" font-size="23" font-weight="700" font-family="system-ui, sans-serif">02</text>
<text x="394" y="164" fill="#f0f7f6" font-size="21" font-weight="700" font-family="system-ui, sans-serif">Déduire les charges</text>
<text x="394" y="202" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">Logement, véhicule, dettes et</text>
<text x="394" y="229" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">autres charges fixes</text>
<path d="M 690 177 h 22 m -8 -8 l 8 8 -8 8" fill="none" stroke="#a6d6d6" stroke-width="3"/>
<rect x="716" y="82" width="312" height="190" rx="16" fill="#162a34" stroke="#49606b"/>
<rect x="716" y="82" width="312" height="5" rx="2" fill="#f2bd78"/>
<text x="736" y="129" fill="#f2bd78" font-size="23" font-weight="700" font-family="system-ui, sans-serif">03</text>
<text x="736" y="164" fill="#f0f7f6" font-size="21" font-weight="700" font-family="system-ui, sans-serif">Recalculer</text>
<text x="736" y="202" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">Train de vie effectif, puis reste</text>
<text x="736" y="229" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">disponible</text>
<text x="34" y="322" fill="#f1cfa1" font-size="18" font-family="system-ui, sans-serif">Le Train de vie n’est pas le salaire du personnage.</text>
</svg>
