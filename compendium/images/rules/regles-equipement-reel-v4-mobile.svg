<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 977" role="img" aria-labelledby="title desc">
<title id="title">Couches de protection : retenir quoi ?</title>
<desc id="desc">1 · Identifier le vecteur : L’attaque concerne dégâts matériels, balistiques, choc, feu ou autre type explicite. ; 2 · Armure de base : Meilleure Armure portée + meilleure Armure corporelle applicables ; pas deux de chaque. ; 3 · Réduction typée : Appliquer seulement celles qui correspondent au vecteur et sont réellement compatibles. ; 4 · Perforant X : Ignorer X points de l’Armure matérielle concernée, jamais une Défense. ; 5 · Soustraire les PV : Le reliquat après protections atteint les PV ; vérifier ensuite les seuils de blessure.. Une protection ne s’ajoute jamais au score de Défense passive ou active.</desc>
<rect width="540" height="977" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="538" height="975" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="25" y="42" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#eef7f7">Couches de protection :</text>
<text x="25" y="72" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#eef7f7">retenir quoi ?</text>
<rect x="20" y="104" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="104" width="5" height="133" rx="2" fill="#5de0d0"/>
<text x="39" y="138" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#5de0d0">1 · Identifier le vecteur</text>
<text x="39" y="172" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">L’attaque concerne dégâts matériels,</text>
<text x="39" y="198" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">balistiques, choc, feu ou autre type</text>
<text x="39" y="224" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">explicite.</text>
<text x="263" y="253" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="255" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="255" width="5" height="133" rx="2" fill="#8ab9ff"/>
<text x="39" y="289" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#8ab9ff">2 · Armure de base</text>
<text x="39" y="323" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Meilleure Armure portée + meilleure Armure</text>
<text x="39" y="349" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">corporelle applicables ; pas deux de</text>
<text x="39" y="375" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">chaque.</text>
<text x="263" y="404" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="406" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="406" width="5" height="133" rx="2" fill="#f2bd78"/>
<text x="39" y="440" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#f2bd78">3 · Réduction typée</text>
<text x="39" y="474" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Appliquer seulement celles qui</text>
<text x="39" y="500" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">correspondent au vecteur et sont</text>
<text x="39" y="526" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">réellement compatibles.</text>
<text x="263" y="555" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="557" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="557" width="5" height="133" rx="2" fill="#8fdea7"/>
<text x="39" y="591" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#8fdea7">4 · Perforant X</text>
<text x="39" y="625" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Ignorer X points de l’Armure matérielle</text>
<text x="39" y="651" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">concernée, jamais une Défense.</text>
<text x="263" y="706" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="708" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="708" width="5" height="133" rx="2" fill="#ca9bdf"/>
<text x="39" y="742" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#ca9bdf">5 · Soustraire les PV</text>
<text x="39" y="776" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Le reliquat après protections atteint les</text>
<text x="39" y="802" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">PV ; vérifier ensuite les seuils de</text>
<text x="39" y="828" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">blessure.</text>
<text x="24" y="877" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#f1cfa1">Une protection ne s’ajoute jamais au score de</text>
<text x="24" y="904" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#f1cfa1">Défense passive ou active.</text>
</svg>
