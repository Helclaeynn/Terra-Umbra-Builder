<text x="394" y="164" fill="#f0f7f6" font-size="21" font-weight="700" font-family="system-ui, sans-serif">PV ≤ 25 %</text>
<text x="394" y="202" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">État minimum : Paniqué</text>
<path d="M 690 177 h 22 m -8 -8 l 8 8 -8 8" fill="none" stroke="#a6d6d6" stroke-width="3"/>
<rect x="716" y="82" width="312" height="190" rx="16" fill="#162a34" stroke="#49606b"/>
