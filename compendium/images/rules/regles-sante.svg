<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" role="img" aria-labelledby="title desc">
<title id="title">Blessures et soins</title>
<desc id="desc">PV ≤ 50 % : État minimum : Tendu ; PV ≤ 25 % : État minimum : Paniqué ; PV ≤ 0 : Agonisant ; test en fin de round. Stabiliser : Esprit + Soin contre 15, retour à 0 PV.</desc>
