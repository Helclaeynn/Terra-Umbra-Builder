<text x="736" y="202" fill="#d1e1e3" font-size="17" font-family="system-ui, sans-serif">Agonisant ; test en fin de round</text>
<text x="34" y="322" fill="#f1cfa1" font-size="18" font-family="system-ui, sans-serif">Stabiliser : Esprit + Soin contre 15, retour à 0 PV.</text>
