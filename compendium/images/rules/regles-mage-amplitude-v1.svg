<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" role="img" aria-labelledby="title desc">
<title id="title">Amplitude : niveau possédé ou utilisé ?</title>
<desc id="desc">L’Amplitude utilisée fixe difficulté, PA et Tension. Chaque palier possédé en plus réduit la difficulté d’un niveau sans réduire les PA ni la Tension. Deux paliers d’avance rendent l’effet automatique seulement sans opposition, urgence ni difficulté réelle.</desc>
<rect width="1060" height="540" rx="22" fill="#0c1820"/>
<rect x="1" y="1" width="1058" height="538" rx="21" fill="none" stroke="#476775" stroke-width="2"/>
<text x="32" y="48" fill="#eef7f7" font-size="27" font-weight="700" font-family="system-ui, sans-serif">Amplitude possédée ≠ Amplitude utilisée</text>
<text x="32" y="82" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">L’effet choisi, et non ton maximum, fixe son coût de base.</text>
<rect x="30" y="105" width="1000" height="54" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="52" y="141" fill="#f0f7f6" font-size="19" font-weight="700" font-family="system-ui, sans-serif">Mineure</text>
<text x="440" y="141" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">Difficulté 15</text>
<text x="695" y="141" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">1 PA</text>
<text x="845" y="141" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">Tension +1</text>
<rect x="30" y="171" width="1000" height="54" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="52" y="207" fill="#f0f7f6" font-size="19" font-weight="700" font-family="system-ui, sans-serif">Significative</text>
<text x="440" y="207" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">Difficulté 18</text>
<text x="695" y="207" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">2 PA</text>
<text x="845" y="207" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">Tension +2</text>
<rect x="30" y="237" width="1000" height="54" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="52" y="273" fill="#f0f7f6" font-size="19" font-weight="700" font-family="system-ui, sans-serif">Majeure</text>
<text x="440" y="273" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">Difficulté 21</text>
<text x="695" y="273" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">3 PA</text>
<text x="845" y="273" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">Tension +3</text>
<rect x="30" y="303" width="1000" height="54" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="52" y="339" fill="#f0f7f6" font-size="19" font-weight="700" font-family="system-ui, sans-serif">Cataclysmique</text>
<text x="440" y="339" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">Difficulté 25</text>
<text x="695" y="339" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">4 PA</text>
<text x="845" y="339" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">Tension +4</text>
<rect x="30" y="389" width="1000" height="97" rx="15" fill="#182735" stroke="#8ab9ff"/>
<text x="52" y="421" fill="#8ab9ff" font-size="19" font-weight="700" font-family="system-ui, sans-serif">Exemple : possédée Majeure ; effet utilisé Significatif.</text>
<text x="52" y="455" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">Difficulté 18 → 15 (un palier d’avance) ; toujours 2 PA et +2 Tension.</text>
<text x="32" y="519" fill="#f1cfa1" font-size="17" font-weight="400" font-family="system-ui, sans-serif">2 paliers d’avance : automatique seulement sans opposition, urgence ni difficulté réelle.</text>
</svg>
