<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 780" role="img" aria-labelledby="title desc">
<title id="title">Tranches fixes : base à 1 200 $</title>
<desc id="desc">Charges : 900 $ : 0 tranche complète : aucun cran perdu ; Charges : 1 300 $ : 1 tranche complète : −1 cran ; Charges : 2 500 $ : 2 tranches complètes : −2 crans. Chaque seuil reste calculé sur 1 200 $, même après la baisse.</desc>
<rect width="540" height="780" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="538" height="778" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="25" y="42" fill="#eef7f7" font-size="26" font-weight="700" font-family="system-ui, sans-serif">Tranches fixes : base à 1 200 $</text>
<rect x="22" y="95" width="496" height="182" rx="15" fill="#162a34" stroke="#49606b"/>
<rect x="22" y="95" width="496" height="5" rx="2" fill="#5de0d0"/>
<text x="42" y="137" fill="#5de0d0" font-size="22" font-weight="700" font-family="system-ui, sans-serif">01 · Charges : 900 $</text>
<text x="42" y="177" fill="#d1e1e3" font-size="21" font-family="system-ui, sans-serif">0 tranche complète : aucun cran</text>
<text x="42" y="206" fill="#d1e1e3" font-size="21" font-family="system-ui, sans-serif">perdu</text>
<rect x="22" y="299" width="496" height="182" rx="15" fill="#162a34" stroke="#49606b"/>
<rect x="22" y="299" width="496" height="5" rx="2" fill="#8ab9ff"/>
<text x="42" y="341" fill="#8ab9ff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">02 · Charges : 1 300 $</text>
<text x="42" y="381" fill="#d1e1e3" font-size="21" font-family="system-ui, sans-serif">1 tranche complète : −1 cran</text>
<rect x="22" y="503" width="496" height="182" rx="15" fill="#162a34" stroke="#49606b"/>
<rect x="22" y="503" width="496" height="5" rx="2" fill="#f2bd78"/>
<text x="42" y="545" fill="#f2bd78" font-size="22" font-weight="700" font-family="system-ui, sans-serif">03 · Charges : 2 500 $</text>
<text x="42" y="585" fill="#d1e1e3" font-size="21" font-family="system-ui, sans-serif">2 tranches complètes : −2 crans</text>
<text x="25" y="717" fill="#f1cfa1" font-size="19" font-family="system-ui, sans-serif">Chaque seuil reste calculé sur 1 200 $,</text>
<text x="25" y="744" fill="#f1cfa1" font-size="19" font-family="system-ui, sans-serif">même après la baisse.</text>
</svg>
