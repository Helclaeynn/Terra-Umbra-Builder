<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 830" role="img" aria-labelledby="title desc">
<title id="title">Amplitude : niveau possédé ou utilisé ?</title>
<desc id="desc">L’Amplitude utilisée fixe difficulté, PA et Tension. Chaque palier possédé en plus réduit la difficulté d’un niveau sans réduire les PA ni la Tension. Deux paliers d’avance rendent l’effet automatique seulement sans opposition, urgence ni difficulté réelle.</desc>
<rect width="540" height="830" rx="22" fill="#0c1820"/>
<rect x="1" y="1" width="538" height="828" rx="21" fill="none" stroke="#476775" stroke-width="2"/>
<text x="24" y="42" fill="#eef7f7" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Amplitude : possédée ≠ utilisée</text>
<text x="24" y="78" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">Choisis l’échelle réellement produite.</text>
<rect x="22" y="101" width="496" height="82" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="42" y="133" fill="#f0f7f6" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Mineure</text>
<text x="42" y="166" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">Difficulté 15  ·  1 PA  ·  Tension +1</text>
<rect x="22" y="199" width="496" height="82" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="42" y="231" fill="#f0f7f6" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Significative</text>
<text x="42" y="264" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">Difficulté 18  ·  2 PA  ·  Tension +2</text>
<rect x="22" y="297" width="496" height="82" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="42" y="329" fill="#f0f7f6" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Majeure</text>
<text x="42" y="362" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">Difficulté 21  ·  3 PA  ·  Tension +3</text>
<rect x="22" y="395" width="496" height="82" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="42" y="427" fill="#f0f7f6" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Cataclysmique</text>
<text x="42" y="460" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">Difficulté 25  ·  4 PA  ·  Tension +4</text>
<rect x="22" y="518" width="496" height="223" rx="15" fill="#182735" stroke="#8ab9ff"/>
<text x="42" y="555" fill="#8ab9ff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Exemple : possède Majeure</text>
<text x="42" y="590" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">mais lance un effet Significatif.</text>
<text x="42" y="630" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">Difficulté 18 → 15 (un palier d’avance).</text>
<text x="42" y="666" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">PA = 2 ; Tension = +2, inchangés.</text>
<text x="26" y="785" fill="#f1cfa1" font-size="16" font-weight="400" font-family="system-ui, sans-serif">2 paliers : auto seulement hors opposition,</text>
<text x="26" y="811" fill="#f1cfa1" font-size="16" font-weight="400" font-family="system-ui, sans-serif">urgence ou difficulté réelle.</text>
</svg>
