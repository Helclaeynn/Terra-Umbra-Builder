<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 780" role="img" aria-labelledby="title desc">
<title id="title">Que devient un 9 naturel ?</title>
<desc id="desc">Normal : 9 : pas d’explosion ; Tendu : 9 : le dé explose ; Paniqué : 9 : pas d’explosion. Un 9 change donc de comportement selon l’état.</desc>
<rect width="540" height="780" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="538" height="778" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="25" y="42" fill="#eef7f7" font-size="26" font-weight="700" font-family="system-ui, sans-serif">Que devient un 9 naturel ?</text>
<rect x="22" y="95" width="496" height="182" rx="15" fill="#162a34" stroke="#49606b"/>
<rect x="22" y="95" width="496" height="5" rx="2" fill="#5de0d0"/>
<text x="42" y="137" fill="#5de0d0" font-size="22" font-weight="700" font-family="system-ui, sans-serif">01 · Normal</text>
<text x="42" y="177" fill="#d1e1e3" font-size="21" font-family="system-ui, sans-serif">9 : pas d’explosion</text>
<rect x="22" y="299" width="496" height="182" rx="15" fill="#162a34" stroke="#49606b"/>
<rect x="22" y="299" width="496" height="5" rx="2" fill="#8ab9ff"/>
<text x="42" y="341" fill="#8ab9ff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">02 · Tendu</text>
<text x="42" y="381" fill="#d1e1e3" font-size="21" font-family="system-ui, sans-serif">9 : le dé explose</text>
<rect x="22" y="503" width="496" height="182" rx="15" fill="#162a34" stroke="#49606b"/>
<rect x="22" y="503" width="496" height="5" rx="2" fill="#f2bd78"/>
<text x="42" y="545" fill="#f2bd78" font-size="22" font-weight="700" font-family="system-ui, sans-serif">03 · Paniqué</text>
<text x="42" y="585" fill="#d1e1e3" font-size="21" font-family="system-ui, sans-serif">9 : pas d’explosion</text>
<text x="25" y="717" fill="#f1cfa1" font-size="19" font-family="system-ui, sans-serif">Un 9 change donc de comportement selon</text>
<text x="25" y="744" fill="#f1cfa1" font-size="19" font-family="system-ui, sans-serif">l’état.</text>
</svg>
