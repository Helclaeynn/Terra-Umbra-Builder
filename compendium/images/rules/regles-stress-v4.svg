<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 710" role="img" aria-labelledby="title desc">
<title id="title">Quel état régit réellement le dé ?</title>
<desc id="desc">1 · Identifier les sources : Stress subi ou imposé ; blessures ≤ 50 % PV : Tendu minimum ; ≤ 25 % : Paniqué. ; 2 · Retenir l’état : Normal : échec 1 / explosion 10 ; Tendu : échec 1–2 / explosion 9–10. ; 3 · Si Paniqué : Échec narratif 1–3 ; explosion seulement sur 10 naturel. ; 4 · Soigner les blessures : Au-dessus d’un seuil de PV, retirer aussitôt le minimum imposé par ce seuil. ; 5 · Autre cause ? : Si oui, conserver son Stress ; sinon redescendre au minimum encore applicable.. Le repos ne descend jamais sous le minimum de Stress encore imposé par les blessures.</desc>
<rect width="1060" height="710" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="1058" height="708" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="32" y="42" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#eef7f7">Quel état régit réellement le dé ?</text>
<rect x="31" y="98" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="98" width="5" height="86" rx="2" fill="#5de0d0"/>
<text x="50" y="132" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#5de0d0">1 · Identifier les sources</text>
<text x="50" y="167" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Stress subi ou imposé ; blessures ≤ 50 % PV : Tendu minimum ; ≤ 25 % : Paniqué.</text>
<text x="523" y="200" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="202" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="202" width="5" height="86" rx="2" fill="#8ab9ff"/>
<text x="50" y="236" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8ab9ff">2 · Retenir l’état</text>
<text x="50" y="271" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Normal : échec 1 / explosion 10 ; Tendu : échec 1–2 / explosion 9–10.</text>
<text x="523" y="304" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="306" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="306" width="5" height="86" rx="2" fill="#f2bd78"/>
<text x="50" y="340" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#f2bd78">3 · Si Paniqué</text>
<text x="50" y="375" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Échec narratif 1–3 ; explosion seulement sur 10 naturel.</text>
<text x="523" y="408" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="410" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="410" width="5" height="86" rx="2" fill="#8fdea7"/>
<text x="50" y="444" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8fdea7">4 · Soigner les blessures</text>
<text x="50" y="479" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Au-dessus d’un seuil de PV, retirer aussitôt le minimum imposé par ce seuil.</text>
<text x="523" y="512" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="514" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="514" width="5" height="86" rx="2" fill="#ca9bdf"/>
<text x="50" y="548" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#ca9bdf">5 · Autre cause ?</text>
<text x="50" y="583" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Si oui, conserver son Stress ; sinon redescendre au minimum encore applicable.</text>
<text x="33" y="636" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#f1cfa1">Le repos ne descend jamais sous le minimum de Stress encore imposé par les blessures.</text>
</svg>
