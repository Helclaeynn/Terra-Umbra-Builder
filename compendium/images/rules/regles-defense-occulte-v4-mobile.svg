<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 977" role="img" aria-labelledby="title desc">
<title id="title">Choisir la Défense contre un effet</title>
<desc id="desc">1 · Quel effet atteint la cible ? : Imposition directe sur esprit, âme ou intérieur du corps : occultement imposé. ; 2 · Ou phénomène évitable ? : Projectile ou manifestation physiquement évitable : Défense physique. ; 3 · Défense passive : Occulte = Volonté + Force Mentale ; physique = Agilité + Esquive. ; 4 · Réaction permise ? : Dépenser 1 PA : ajouter 1d10e à la Défense du type retenu. ; 5 · Résolution : Comparer l’attaque à cette seule Défense ; égalité = statu quo.. Une même attaque ne sollicite jamais Défense physique et occulte ensemble.</desc>
<rect width="540" height="977" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="538" height="975" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="25" y="42" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#eef7f7">Choisir la Défense contre un</text>
<text x="25" y="72" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#eef7f7">effet</text>
<rect x="20" y="104" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="104" width="5" height="133" rx="2" fill="#5de0d0"/>
<text x="39" y="138" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#5de0d0">1 · Quel effet atteint la cible ?</text>
<text x="39" y="172" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Imposition directe sur esprit, âme ou</text>
<text x="39" y="198" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">intérieur du corps : occultement imposé.</text>
<text x="263" y="253" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="255" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="255" width="5" height="133" rx="2" fill="#8ab9ff"/>
<text x="39" y="289" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#8ab9ff">2 · Ou phénomène évitable ?</text>
<text x="39" y="323" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Projectile ou manifestation physiquement</text>
<text x="39" y="349" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">évitable : Défense physique.</text>
<text x="263" y="404" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="406" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="406" width="5" height="133" rx="2" fill="#f2bd78"/>
<text x="39" y="440" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#f2bd78">3 · Défense passive</text>
<text x="39" y="474" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Occulte = Volonté + Force Mentale ;</text>
<text x="39" y="500" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">physique = Agilité + Esquive.</text>
<text x="263" y="555" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="557" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="557" width="5" height="133" rx="2" fill="#8fdea7"/>
<text x="39" y="591" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#8fdea7">4 · Réaction permise ?</text>
<text x="39" y="625" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Dépenser 1 PA : ajouter 1d10e à la Défense</text>
<text x="39" y="651" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">du type retenu.</text>
<text x="263" y="706" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="708" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="708" width="5" height="133" rx="2" fill="#ca9bdf"/>
<text x="39" y="742" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#ca9bdf">5 · Résolution</text>
<text x="39" y="776" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Comparer l’attaque à cette seule Défense ;</text>
<text x="39" y="802" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">égalité = statu quo.</text>
<text x="24" y="877" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#f1cfa1">Une même attaque ne sollicite jamais Défense</text>
<text x="24" y="904" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#f1cfa1">physique et occulte ensemble.</text>
</svg>
