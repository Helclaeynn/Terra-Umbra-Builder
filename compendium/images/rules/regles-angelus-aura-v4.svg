<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 710" role="img" aria-labelledby="title desc">
<title id="title">Angelus : Aura, Éveil et rang</title>
<desc id="desc">1 · Éveil : Comprendre ou retrouver sa nature est distinct de passer en SR ou R. ; 2 · Déterminer le rang : Angelus : 1 Nature ; Chérubin : 2 ; Séraphin exceptionnel : 3. ; 3 · Calculer l’Aura max : 3 + Force Mentale ; Chérubin +2 ; Séraphin +4, plafonds 8 / 10 / 12. ; 4 · Payer les pouvoirs : Chaque Talent ou Don dépense l’Aura indiquée ; le rang ne rend pas les dons gratuits. ; 5 · Activer les ailes : Un Chérubin paie 1 Aura pour toutes ses ailes ; +1 Agilité au total.. Séraphin est un rang exceptionnel de campagne, sans achat standard de Talent.</desc>
<rect width="1060" height="710" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="1058" height="708" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="32" y="42" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#eef7f7">Angelus : Aura, Éveil et rang</text>
<rect x="31" y="98" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="98" width="5" height="86" rx="2" fill="#5de0d0"/>
<text x="50" y="132" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#5de0d0">1 · Éveil</text>
<text x="50" y="167" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Comprendre ou retrouver sa nature est distinct de passer en SR ou R.</text>
<text x="523" y="200" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="202" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="202" width="5" height="86" rx="2" fill="#8ab9ff"/>
<text x="50" y="236" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8ab9ff">2 · Déterminer le rang</text>
<text x="50" y="271" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Angelus : 1 Nature ; Chérubin : 2 ; Séraphin exceptionnel : 3.</text>
<text x="523" y="304" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="306" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="306" width="5" height="86" rx="2" fill="#f2bd78"/>
<text x="50" y="340" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#f2bd78">3 · Calculer l’Aura max</text>
<text x="50" y="375" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">3 + Force Mentale ; Chérubin +2 ; Séraphin +4, plafonds 8 / 10 / 12.</text>
<text x="523" y="408" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="410" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="410" width="5" height="86" rx="2" fill="#8fdea7"/>
<text x="50" y="444" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8fdea7">4 · Payer les pouvoirs</text>
<text x="50" y="479" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Chaque Talent ou Don dépense l’Aura indiquée ; le rang ne rend pas les dons</text>
<text x="50" y="502" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">gratuits.</text>
<text x="523" y="512" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="31" y="514" width="998" height="86" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="31" y="514" width="5" height="86" rx="2" fill="#ca9bdf"/>
<text x="50" y="548" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#ca9bdf">5 · Activer les ailes</text>
<text x="50" y="583" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#d1e1e3">Un Chérubin paie 1 Aura pour toutes ses ailes ; +1 Agilité au total.</text>
<text x="33" y="636" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#f1cfa1">Séraphin est un rang exceptionnel de campagne, sans achat standard de Talent.</text>
</svg>
