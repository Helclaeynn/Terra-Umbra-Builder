<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 977" role="img" aria-labelledby="title desc">
<title id="title">Augmentations : support, slot et bonus</title>
<desc id="desc">1 · Repérer le support : Une augmentation support ouvre ses slots ; un module doit être compatible. ; 2 · Vérifier l’emplacement : Chaque module occupe ses slots ; un œil est un support séparé de l’autre. ; 3 · Appliquer l’exclusivité : Une peau globale principale ; armure et camouflage dermiques exigent un modèle compatible. ; 4 · Vérifier les bonus : Visée, Viser, Verrouillage : garder le meilleur bonus de ciblage. ; 5 · Reporter le coût : Charge et Stress de chaque élément installé suivent leurs règles propres.. Un support ne confère pas automatiquement les propriétés de ses modules.</desc>
<rect width="540" height="977" rx="20" fill="#0c1820"/>
<rect x="1" y="1" width="538" height="975" rx="19" fill="none" stroke="#476775" stroke-width="2"/>
<text x="25" y="42" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#eef7f7">Augmentations : support, slot</text>
<text x="25" y="72" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#eef7f7">et bonus</text>
<rect x="20" y="104" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="104" width="5" height="133" rx="2" fill="#5de0d0"/>
<text x="39" y="138" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#5de0d0">1 · Repérer le support</text>
<text x="39" y="172" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Une augmentation support ouvre ses slots ;</text>
<text x="39" y="198" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">un module doit être compatible.</text>
<text x="263" y="253" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="255" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="255" width="5" height="133" rx="2" fill="#8ab9ff"/>
<text x="39" y="289" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#8ab9ff">2 · Vérifier l’emplacement</text>
<text x="39" y="323" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Chaque module occupe ses slots ; un œil</text>
<text x="39" y="349" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">est un support séparé de l’autre.</text>
<text x="263" y="404" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="406" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="406" width="5" height="133" rx="2" fill="#f2bd78"/>
<text x="39" y="440" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#f2bd78">3 · Appliquer l’exclusivité</text>
<text x="39" y="474" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Une peau globale principale ; armure et</text>
<text x="39" y="500" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">camouflage dermiques exigent un modèle</text>
<text x="39" y="526" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">compatible.</text>
<text x="263" y="555" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="557" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="557" width="5" height="133" rx="2" fill="#8fdea7"/>
<text x="39" y="591" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#8fdea7">4 · Vérifier les bonus</text>
<text x="39" y="625" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Visée, Viser, Verrouillage : garder le</text>
<text x="39" y="651" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">meilleur bonus de ciblage.</text>
<text x="263" y="706" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a6d6d6">↓</text>
<rect x="20" y="708" width="500" height="133" rx="13" fill="#162a34" stroke="#49606b"/>
<rect x="20" y="708" width="5" height="133" rx="2" fill="#ca9bdf"/>
<text x="39" y="742" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#ca9bdf">5 · Reporter le coût</text>
<text x="39" y="776" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">Charge et Stress de chaque élément</text>
<text x="39" y="802" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#d1e1e3">installé suivent leurs règles propres.</text>
<text x="24" y="877" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#f1cfa1">Un support ne confère pas automatiquement les</text>
<text x="24" y="904" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#f1cfa1">propriétés de ses modules.</text>
</svg>
