<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" role="img" aria-labelledby="title desc">
<title id="title">Portée : modifier la difficulté</title>
<desc id="desc">Endo ou contact réduit la difficulté d’un niveau ; Volonté fois cinq mètres la laisse normale ; à vue ajoute un niveau. Hors vue exige une permission spéciale. Chaque niveau au-dessus de 25 impose au moins un PA de Canalisation.</desc>
<rect width="1060" height="540" rx="22" fill="#0c1820"/>
<rect x="1" y="1" width="1058" height="538" rx="21" fill="none" stroke="#476775" stroke-width="2"/>
<text x="32" y="48" fill="#eef7f7" font-size="27" font-weight="700" font-family="system-ui, sans-serif">Portée : ajuster la difficulté après l’Amplitude</text>
<text x="32" y="84" fill="#d1e1e3" font-size="18" font-weight="400" font-family="system-ui, sans-serif">Choisir comment le Mage atteint sa cible.</text>
<rect x="30" y="111" width="1000" height="60" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="52" y="151" fill="#f0f7f6" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Sur soi / contact</text>
<text x="565" y="151" fill="#f2bd78" font-size="19" font-weight="400" font-family="system-ui, sans-serif">−1 niveau</text>
<rect x="30" y="182" width="1000" height="60" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="52" y="222" fill="#f0f7f6" font-size="20" font-weight="700" font-family="system-ui, sans-serif">À Volonté × 5 mètres</text>
<text x="565" y="222" fill="#f2bd78" font-size="19" font-weight="400" font-family="system-ui, sans-serif">aucun changement</text>
<rect x="30" y="253" width="1000" height="60" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="52" y="293" fill="#f0f7f6" font-size="20" font-weight="700" font-family="system-ui, sans-serif">À vue</text>
<text x="565" y="293" fill="#f2bd78" font-size="19" font-weight="400" font-family="system-ui, sans-serif">+1 niveau</text>
<rect x="30" y="324" width="1000" height="60" rx="15" fill="#162a34" stroke="#49606b"/>
<text x="52" y="364" fill="#f0f7f6" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Hors vue</text>
<text x="565" y="364" fill="#f2bd78" font-size="19" font-weight="400" font-family="system-ui, sans-serif">permission spéciale exigée</text>
<rect x="30" y="419" width="1000" height="75" rx="15" fill="#30281f" stroke="#f2bd78"/>
<text x="52" y="450" fill="#f2bd78" font-size="18" font-weight="700" font-family="system-ui, sans-serif">Au-delà de 25 → au moins 1 PA de Canalisation par niveau excédentaire.</text>
<text x="52" y="478" fill="#d1e1e3" font-size="17" font-weight="400" font-family="system-ui, sans-serif">Exemple : difficulté 25 + portée « à vue » → 1 PA supplémentaire avant le jet.</text>
<text x="32" y="526" fill="#f1cfa1" font-size="17" font-weight="400" font-family="system-ui, sans-serif">Hors vue : lien, ancrage, rituel, Technique, Écho ou Magie personnelle requis.</text>
</svg>
