name: V2 production Daemon release retry
on:
  push:
    branches: [feature/tuc-web-v2]
    paths: [.github/workflows/v2-production-daemon-release-retry.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: tuc-v2-production
  cancel-in-progress: false
env:
  SOURCE_SHA: 3a578145ceb20c892bc433886b1e8b051a1ababe
  SOURCE_RUN: '36578678249'
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tuc-dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact previously tested application and green build job
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" HEAD -- apps infrastructure
          test "$(git ls-remote origin refs/heads/feature/tuc-web-v2 | cut -f1)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" > /tmp/daemon-tested-jobs.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const job=JSON.parse(readFileSync('/tmp/daemon-tested-jobs.json','utf8')).jobs.find(j=>j.name==='verify-and-build');
          assert.equal(job?.conclusion,'success');
          for(const name of ['Compile API and verify canonical talents and reward guard','PostgreSQL private media, sharing, saved sheets and campaign isolation','Full web regression and approved Daemon costs, Functions and Spectres','Real browser Daemon choices, mobile and complete application','Publish exact tested application source without overwriting concurrent changes','Build exact tested application images without database migration'])assert.equal(job.steps.find(s=>s.name===name)?.conclusion,'success',name);
          console.log('EXACT TESTED SOURCE OK — database, browser and Docker validation retained; no application changes in this retry');
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: daemon-talents-production-images
          path: /tmp/tuc-daemon-release
          run-id: 36578678249
          github-token: ${{ github.token }}
      - name: Verify archive integrity and measure temporary and expanded sizes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/tuc-daemon-release
          sha256sum --check SHA256SUMS
          test "$(cat source-sha.txt)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import json, os, pathlib, tarfile, zlib
          p=pathlib.Path('.')
          transfer=sum(f.stat().st_size for f in p.iterdir() if f.is_file())
          documents={}; stored={}; expanded={}; image_temporary=10240
          with tarfile.open('images.tar.gz','r|gz') as archive:
              for member in archive:
                  image_temporary += 512 + ((member.size+511)//512)*512
                  if not member.isfile():
                      continue
                  stored[member.name]=member.size
                  expanded[member.name]=member.size
                  f=archive.extractfile(member)
                  if member.size <= 4*1024*1024:
                      raw=f.read()
                      try:
                          documents[member.name]=json.loads(raw)
                      except (ValueError, UnicodeDecodeError):
                          pass
                  else:
                      prefix=f.read(2)
                      if prefix==b'\x1f\x8b':
                          decoder=zlib.decompressobj(16+zlib.MAX_WBITS)
                          count=len(decoder.decompress(prefix))
                          while True:
                              block=f.read(1024*1024)
                              if not block:
                                  break
                              count += len(decoder.decompress(block))
                          count += len(decoder.flush())
                          assert decoder.eof, 'Truncated compressed image layer'
                          expanded[member.name]=count
          manifest=documents['manifest.json']
          assert len(manifest)==2, 'Exactly API and web images required'
          layers={}
          for image in manifest:
              config=documents[image['Config']]
              assert config['config']['Labels']['org.opencontainers.image.revision']==os.environ['SOURCE_SHA']
              digests=config['rootfs']['diff_ids']
              assert len(digests)==len(image['Layers'])
              for digest,name in zip(digests,image['Layers']):
                  layers[digest]=max(layers.get(digest,0),expanded[name])
          source_allocated=0
          with tarfile.open('apps-source.tar.gz','r|gz') as archive:
              for member in archive:
                  source_allocated += ((member.size+4095)//4096)*4096+4096
          meta={'source':os.environ['SOURCE_SHA'],'transfer':transfer,'image_temporary':image_temporary+1024*1024,'source_allocated':source_allocated,'layers':layers}
          pathlib.Path('space-budget.json').write_text(json.dumps(meta))
          print(json.dumps({k:v for k,v in meta.items() if k!='layers'},indent=2))
          print('Layer count:',len(layers))
          PY
      - name: Measured preflight, verified backup and exact production deployment
        env:
          TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
          TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
          TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/tuc-web-v2 | cut -f1)" = "$GITHUB_SHA"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_prod
          chmod 600 ~/.ssh/tuc_prod
          ssh-keyscan -H "$TUC_DEV_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes"
          stage="/opt/terra-umbra/releases/daemon-$SOURCE_SHA"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "test -f /opt/terra-umbra/production-active && mkdir -p '$stage'"
          rsync -az -e "$SSH" /tmp/tuc-daemon-release/space-budget.json tools/daemon-release/space-budget.py "$TUC_DEV_USER@$TUC_DEV_HOST:$stage/"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "flock -n /opt/terra-umbra/.production-release.lock python3 '$stage/space-budget.py' '$stage/space-budget.json'"
          rsync -az -e "$SSH" /tmp/tuc-daemon-release/ "$TUC_DEV_USER@$TUC_DEV_HOST:$stage/"
          { printf '{\n'; cat infrastructure/production/release-daemon-talents.sh; printf '\n}\n'; } | $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$SOURCE_SHA"
      - name: Live browser without writes to real accounts
        id: live
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export TUC_V2_SMOKE_BASE_URL=https://terra-umbra.fr
          node tests/builder-v2-smoke.mjs
          node tests/campaigns-smoke.mjs
      - name: Roll back only this application if live checks fail
        if: steps.live.outcome == 'failure'
        env:
          TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
          TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
        run: |
          { printf '{\n'; cat infrastructure/production/release-daemon-talents.sh; printf '\n}\n'; } | ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$SOURCE_SHA" rollback
          exit 1
      - name: Remove only this successful release's transfer archives
        if: steps.live.outcome == 'success'
        env:
          TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
          TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
        run: |
          ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" "test \"\$(cat /opt/terra-umbra/.production-release-sha)\" = '$SOURCE_SHA' && rm -f /opt/terra-umbra/releases/daemon-$SOURCE_SHA/images.tar.gz /opt/terra-umbra/releases/daemon-$SOURCE_SHA/apps-source.tar.gz"
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/tuc_prod
