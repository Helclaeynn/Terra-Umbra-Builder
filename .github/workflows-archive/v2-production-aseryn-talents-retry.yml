name: V2 production Aseryn talents retry
on:
  push:
    branches: [feature/tuc-web-v2]
    paths: [.github/workflows/v2-production-aseryn-talents-retry.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: tuc-v2-production
  cancel-in-progress: false
env:
  SOURCE_SHA: 4347764293d6264a237b0fd48afb61062cbbf2d9
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4347764293d6264a237b0fd48afb61062cbbf2d9
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unchanged tested application and successful database/browser checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh api repos/Helclaeynn/Terra-Umbra-Builder/actions/jobs/109353581908 > /tmp/aseryn-previous-job.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const job=JSON.parse(readFileSync('/tmp/aseryn-previous-job.json','utf8'));
          for(const n of [5,6,7,8,9,10,11])assert.equal(job.steps.find(s=>s.number===n)?.conclusion,'success');
          NODE
          git fetch --depth=1 origin d158381aca8ad034c02a881d12cf3a91aaefba76 "$GITHUB_SHA"
          test "$(git diff --name-only d158381aca8ad034c02a881d12cf3a91aaefba76 "$SOURCE_SHA" -- apps)" = apps/api/Dockerfile
          git diff --exit-code d158381aca8ad034c02a881d12cf3a91aaefba76 "$SOURCE_SHA" -- infrastructure compendium character-builder
          git diff --exit-code "$SOURCE_SHA" "$GITHUB_SHA" -- apps infrastructure compendium character-builder
      - name: Prepare canonical rule fixtures
        run: |
          mkdir -p .v2-rules-data/lore
          cp compendium/source/current-equipment-catalog-v1.json .v2-rules-data/
          cp compendium/source/reality-lore-v3-*.json .v2-rules-data/lore/
          cp character-builder/rulesets/terra-umbra/reality/augmentations.json.gz.b64 .v2-rules-data/
          cp character-builder/rulesets/terra-umbra/reality/safe/neuroprograms.part01.b64 character-builder/rulesets/terra-umbra/reality/safe/vehicles.part01.b64 .v2-rules-data/
      - name: Reconfirm API, actual Aseryn rules and reward protection
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          node scripts/check-campaign-reward-guard.mjs
          node scripts/check-api-container-assets.mjs
          node scripts/check-truth-v7-builder-integration.mjs
      - name: Reconfirm complete web and PDF regression
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          npm run test:ui
          npm run test:pdf
      - name: Build immutable images with complete canonical build assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/tuc-aseryn-release
          node --input-type=module -e "import {writeFileSync} from 'node:fs';writeFileSync('apps/web/public/build-info.json',JSON.stringify({commit:process.env.SOURCE_SHA,release:'aseryn-talents-20260929'}));"
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "tuc-v2-api:aseryn-$SOURCE_SHA" -f apps/api/Dockerfile .
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "tuc-v2-web:aseryn-$SOURCE_SHA" -f apps/web/Dockerfile .
          docker run --rm --entrypoint node "tuc-v2-api:aseryn-$SOURCE_SHA" --input-type=module -e "import assert from 'node:assert/strict';import {terraUmbraTruthRules as r} from './dist/rules/truth/rules.js';assert.equal(r.catalogs.aseryn.filter(t=>t.effectDetails).length,40);console.log('ASERYN RUNTIME IMAGE OK');"
          docker save "tuc-v2-api:aseryn-$SOURCE_SHA" "tuc-v2-web:aseryn-$SOURCE_SHA" | gzip -1 > /tmp/tuc-aseryn-release/images.tar.gz
          git archive --format=tar HEAD apps > /tmp/tuc-aseryn-release/apps-source.tar
          tar -rf /tmp/tuc-aseryn-release/apps-source.tar apps/web/public/build-info.json
          gzip -1 /tmp/tuc-aseryn-release/apps-source.tar
          printf '%s\n' "$SOURCE_SHA" > /tmp/tuc-aseryn-release/source-sha.txt
          cd /tmp/tuc-aseryn-release
          sha256sum images.tar.gz apps-source.tar.gz source-sha.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aseryn-talents-retry-production-images
          path: /tmp/tuc-aseryn-release/
          compression-level: 0
          retention-days: 3
  release:
    needs: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tuc-dev
    env:
      TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
      TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
      TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4347764293d6264a237b0fd48afb61062cbbf2d9
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aseryn-talents-retry-production-images
          path: /tmp/tuc-aseryn-release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Disk preflight, verified backup and release to terra-umbra.fr
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_prod
          chmod 600 ~/.ssh/tuc_prod
          ssh-keyscan -H "$TUC_DEV_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" 'bash -s' <<'REMOTE'
          {
            set -euo pipefail
            root=/opt/terra-umbra
            test -f "$root/production-active"
            exec 9>"$root/.production-release.lock"
            flock -n 9 || exit 1
            if [ "$(df -B1 --output=avail "$root" | tail -1 | tr -d ' ')" -lt 6442450944 ]; then
              docker builder prune --all --force --keep-storage 2GB
            fi
            df -h "$root"
            test "$(df -B1 --output=avail "$root" | tail -1 | tr -d ' ')" -ge 6442450944
          }
          REMOTE
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "mkdir -p /opt/terra-umbra/releases/aseryn-$SOURCE_SHA"
          rsync -az -e "$SSH" /tmp/tuc-aseryn-release/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/releases/aseryn-$SOURCE_SHA/"
          { printf '{\n'; cat infrastructure/production/release-aseryn-talents.sh; printf '\n}\n'; } | $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$SOURCE_SHA"
      - name: Live browser without writes to real accounts
        id: live
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export TUC_V2_SMOKE_BASE_URL=https://terra-umbra.fr
          node tests/builder-v2-smoke.mjs
          node tests/campaigns-smoke.mjs
      - name: Roll back this application only if live checks fail
        if: steps.live.outcome == 'failure'
        run: |
          { printf '{\n'; cat infrastructure/production/release-aseryn-talents.sh; printf '\n}\n'; } | ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$SOURCE_SHA" rollback
          exit 1
      - name: Remove this release's transfer archives after success; keep rollback images and sources
        if: steps.live.outcome == 'success'
        run: |
          ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" "test \"\$(cat /opt/terra-umbra/.production-release-sha)\" = '$SOURCE_SHA' && rm -f /opt/terra-umbra/releases/aseryn-$SOURCE_SHA/images.tar.gz /opt/terra-umbra/releases/aseryn-$SOURCE_SHA/apps-source.tar.gz"
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/tuc_prod
