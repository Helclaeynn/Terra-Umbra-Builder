name: V2 production incident diagnostics

on:
  push:
    branches: [feature/tuc-web-v2]
    paths: [.github/workflows/v2-production-incident-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: tuc-v2-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: tuc-dev
    env:
      TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
      TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
      TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}
    steps:
      - name: Verify public DNS and modern TLS compatibility without bypassing certificate checks
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, os, socket, ssl, subprocess, urllib.request
          print('UTC', datetime.datetime.now(datetime.timezone.utc).isoformat(), flush=True)
          failures = []
          hosts = ['terra-umbra.fr', 'www.terra-umbra.fr', 'dev.terra-umbra.fr']
          records = {}
          origin = set(entry[4][0] for entry in socket.getaddrinfo(os.environ['TUC_DEV_HOST'], 443, type=socket.SOCK_STREAM))
          for host in hosts:
              try:
                  records[host] = sorted(set(entry[4][0] for entry in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)))
                  print('SYSTEM_DNS', host, json.dumps(records[host]), 'matches_origin=', bool(origin.intersection(records[host])), flush=True)
              except Exception as error:
                  print('DNS_ERROR', host, str(error), flush=True)
                  failures.append(host + ': DNS failed')
          def dns_query(task):
              endpoint, host, kind = task
              url = endpoint + '?name=' + host + '&type=' + kind
              try:
                  request = urllib.request.Request(url, headers={'accept': 'application/dns-json'})
                  with urllib.request.urlopen(request, timeout=8) as response:
                      data = json.load(response)
                  return {'resolver': endpoint, 'host': host, 'type': kind, 'status': data.get('Status'), 'answers': data.get('Answer', [])}
              except Exception as error:
                  return {'resolver': endpoint, 'host': host, 'type': kind, 'error': str(error)}
          tasks = [(endpoint, host, kind) for endpoint in ['https://dns.google/resolve', 'https://cloudflare-dns.com/dns-query'] for host in hosts for kind in ['A', 'AAAA']]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              for result in executor.map(dns_query, tasks):
                  print('PUBLIC_DNS', json.dumps(result), flush=True)
          for host, addresses in records.items():
              for address in addresses:
                  for label, version, cipher in [
                      ('TLS12_DEFAULT', ssl.TLSVersion.TLSv1_2, None),
                      ('TLS13_DEFAULT', ssl.TLSVersion.TLSv1_3, None),
                      ('TLS12_ECDSA_P256', ssl.TLSVersion.TLSv1_2, 'ECDHE-ECDSA-AES128-GCM-SHA256'),
                      ('TLS12_RSA_ONLY_DIAGNOSTIC', ssl.TLSVersion.TLSv1_2, 'ECDHE-RSA-AES128-GCM-SHA256')
                  ]:
                      try:
                          context = ssl.create_default_context()
                          context.minimum_version = context.maximum_version = version
                          context.set_alpn_protocols(['http/1.1'])
                          if cipher:
                              context.set_ciphers(cipher)
                              context.set_ecdh_curve('prime256v1')
                          with socket.create_connection((address, 443), timeout=6) as tcp:
                              with context.wrap_socket(tcp, server_hostname=host) as tls:
                                  certificate = tls.getpeercert()
                                  der = tls.getpeercert(binary_form=True)
                                  tls.sendall(('HEAD /api/health HTTP/1.1\r\nHost: ' + host + '\r\nConnection: close\r\n\r\n').encode('ascii'))
                                  status = tls.recv(4096).split(b'\r\n', 1)[0].decode('ascii', errors='replace')
                                  print('TLS_VERIFIED', host, address, label, tls.version(), tls.cipher(), 'HTTP=', status, 'certificate_sha256=', hashlib.sha256(der).hexdigest(), flush=True)
                                  if label == 'TLS12_DEFAULT':
                                      print('CERTIFICATE', host, json.dumps({key: certificate.get(key) for key in ['subject', 'issuer', 'notBefore', 'notAfter', 'subjectAltName']}), flush=True)
                                      details = subprocess.run(['openssl','x509','-inform','DER','-noout','-text'],input=der,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout.decode()
                                      print('CERTIFICATE_ALGORITHMS', host, ' | '.join(line.strip() for line in details.splitlines() if any(key in line for key in ['Signature Algorithm:', 'Public Key Algorithm:', 'Public-Key:', 'ASN1 OID:'])), flush=True)
                          if host == 'terra-umbra.fr' and not status.startswith('HTTP/1.1 200'):
                              failures.append(host + ': unexpected ' + status)
                      except Exception as error:
                          print('TLS_RESULT', host, address, label, type(error).__name__, str(error), flush=True)
                          # An RSA-only peer is a diagnostic, not a supported-client assertion.
                          # This runner has no IPv6 route; that cannot establish a site IPv6 fault.
                          ipv6_unavailable = isinstance(error, OSError) and getattr(error, 'errno', None) == 101 and ':' in address
                          if label != 'TLS12_RSA_ONLY_DIAGNOSTIC' and not ipv6_unavailable:
                              failures.append(host + ': ' + label + ': ' + str(error))
          for path in ['/', '/account', '/api/health', '/api/auth/setup-status', '/build-info.json']:
              try:
                  request = urllib.request.Request('https://terra-umbra.fr' + path, headers={'User-Agent': 'TUC-Incident-ReadOnly/1.1', 'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      print('HTTP', path, response.status, response.headers.get('content-type'), flush=True)
                      if path in ['/api/health', '/build-info.json']:
                          print('PUBLIC_BODY', response.read(1000).decode('utf-8', errors='replace'), flush=True)
              except Exception as error:
                  print('HTTP_ERROR', path, type(error).__name__, str(error), flush=True)
                  failures.append(path + ': ' + str(error))
          print('REQUIRED_CHECK_FAILURES', json.dumps(failures), flush=True)
          if failures:
              raise SystemExit(1)
          print('PUBLIC TLS 1.2 / TLS 1.3 AND CERTIFICATE VALIDATION VERIFIED', flush=True)
          PY
      - name: Read current origin state without changing applications, data or TLS configuration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/tuc_incident ~/.ssh/tuc_incident_hosts' EXIT
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_incident
          chmod 600 ~/.ssh/tuc_incident
          ssh-keyscan -T 10 -H "$TUC_DEV_HOST" > ~/.ssh/tuc_incident_hosts
          ssh -i ~/.ssh/tuc_incident -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/tuc_incident_hosts -o ConnectTimeout=15 "$TUC_DEV_USER@$TUC_DEV_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/terra-umbra/infrastructure
          test -f /opt/terra-umbra/production-active
          echo 'ORIGIN UTC'; date -u
          echo 'PRODUCTION RELEASE'; cat /opt/terra-umbra/.production-release-sha
          echo 'SERVICE STATES'; docker compose ps -a
          for service in api web caddy db; do
            id=$(docker compose ps -aq "$service")
            if [ -n "$id" ]; then
              docker inspect --format 'STATE {{.Name}} running={{.State.Running}} restarting={{.State.Restarting}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} restarts={{.RestartCount}} started={{.State.StartedAt}}' "$id"
            fi
          done
          echo 'DISK'; df -h /opt/terra-umbra
          echo 'CADDY SITE CONFIGURATION'; sed -n '1,180p' Caddyfile
          echo 'ORIGIN TLS 1.2'
          curl --fail --silent --show-error --tlsv1.2 --tls-max 1.2 --resolve terra-umbra.fr:443:127.0.0.1 --max-time 15 --output /dev/null --write-out 'HTTP=%{http_code} TLS_VERIFY=%{ssl_verify_result}\n' https://terra-umbra.fr/api/health </dev/null
          echo 'ORIGIN TLS 1.3'
          curl --fail --silent --show-error --tlsv1.3 --tls-max 1.3 --resolve terra-umbra.fr:443:127.0.0.1 --max-time 15 --output /dev/null --write-out 'HTTP=%{http_code} TLS_VERIFY=%{ssl_verify_result}\n' https://terra-umbra.fr/api/health </dev/null
          echo 'ERROR SIGNATURE COUNTS ONLY - NO REQUESTS, COOKIES OR USER RECORDS'
          for service in api web caddy; do
            echo "ERROR SIGNATURES $service"
            docker compose logs --no-color --since 30m --tail 2000 "$service" 2>&1 | grep -Eo 'EACCES|ENOENT|ECONNREFUSED|EADDRINUSE|ERR_[A-Z_]+|permission denied|no space left on device|out of memory|certificate expired|certificate has expired|TLS handshake error|tls: internal error|no certificate available|no cipher suite supported|no supported versions|no supported signature algorithms' | sort | uniq -c || true
          done
          echo 'READ-ONLY DIAGNOSTICS COMPLETE - NO DEPLOYMENT OR CONFIGURATION CHANGE'
          REMOTE
