name: V2 production Compendium incident diagnostics
on:
  push:
    branches: [feature/tuc-web-v2]
    paths: [.github/workflows/v2-production-compendium-incident.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: tuc-dev
    timeout-minutes: 8
    env:
      TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
      TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
      TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}
    steps:
      - name: Inspect API status and recent errors
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/tuc_prod' EXIT
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_prod
          chmod 600 ~/.ssh/tuc_prod
          ssh-keyscan -H "$TUC_DEV_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" <<'REMOTE'
          set -eu
          cd /opt/terra-umbra/infrastructure
          docker compose ps api db
          docker compose logs --tail=100 api | grep -E 'ERROR|Error:|error|Compendium|preloaded|out of memory|FATAL|failed' | tail -65 || true
          REMOTE
