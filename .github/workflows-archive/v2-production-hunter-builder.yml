# Verify the complete current branch, including the concurrent onboarding guides.
# Browser coverage verifies absent equipment without access and restored references with a doctrine.
# Expanded Truth rules remain keyboard-foldable across every Nature.
# Keep the reward-lock assertion independent of Vue attribute ordering.
# Browser fixture retains campaign ownership after saving and uses a matching Morrighan patron.
# Truth usability: open traits, purchases on page two, explicit blockers and correct nature warnings.
# Include the campaign Human hunter profile and readable PDF doctrine records.
# Include bounded permanent profiles and the complete Qi track.
# Hunters, optional progression doctrines, and two-page Truth creation.
name: V2 production Hunters and split Truth builder
# Guided Truth and approved Vampires; retain 320px overflow assertions after fixing structural choice grids.
on:
  push:
    branches: [feature/tuc-web-v2]
    paths:
      - .github/workflows/v2-production-hunter-builder.yml
permissions:
  contents: read
concurrency:
  group: tuc-v2-production
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      source: ${{ steps.publish.outputs.source }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tuc
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: tuc_sheet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tuc -d tuc_sheet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tuc:ci-only-placeholder@127.0.0.1:5432/tuc_sheet_test
      TUC_SHEET_SMOKE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare complete rule data without modifying source catalogues
        run: |
          mkdir -p .v2-rules-data/lore
          cp compendium/source/current-equipment-catalog-v1.json .v2-rules-data/
          cp compendium/source/reality-lore-v3-*.json .v2-rules-data/lore/
          cp character-builder/rulesets/terra-umbra/reality/augmentations.json.gz.b64 .v2-rules-data/
          cp character-builder/rulesets/terra-umbra/reality/safe/neuroprograms.part01.b64 character-builder/rulesets/terra-umbra/reality/safe/vehicles.part01.b64 .v2-rules-data/
      - name: Compile API and verify canonical talents and reward guard
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          node scripts/check-campaign-reward-guard.mjs
          node scripts/check-api-container-assets.mjs
          node scripts/check-truth-v7-builder-integration.mjs
          node scripts/check-truth-aseryn-terres-temples.mjs
      - name: PostgreSQL private media, sharing, saved sheets and campaign isolation
        working-directory: apps/api
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          import {pool} from './dist/db.js';
          for(const n of (await readdir('../../infrastructure/migrations')).filter(n=>n.endsWith('.sql')).sort())await pool.query(await readFile('../../infrastructure/migrations/'+n,'utf8'));
          await pool.end();
          NODE
          node scripts/check-character-media.mjs
          node scripts/check-character-sheet-access.mjs
          node scripts/check-campaign-workspace.mjs
          node scripts/check-campaign-source-revision.mjs
          node scripts/check-reality-benefits-persistence.mjs
          node scripts/check-mage-persistence.mjs
          node scripts/check-daemon-persistence.mjs
          node scripts/check-angelus-persistence.mjs
          node scripts/check-extral-persistence.mjs
          node scripts/check-exile-persistence.mjs
          node scripts/check-khinae-persistence.mjs
          node scripts/check-vampire-persistence.mjs
          node scripts/check-hunter-persistence.mjs
      - name: Full web regression and approved Exile choices, stock and scenario counters
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          npm run test:ui
          node tests/player-start-dom.mjs
          npm run test:pdf
      - name: Real browser Exile choices, mobile and complete application
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/tuc-exile-preview.log 2>&1 &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export TUC_V2_SMOKE_BASE_URL=http://127.0.0.1:4173
          node tests/builder-v2-smoke.mjs
          node tests/truth-guided-builder-browser.mjs
          node tests/character-evolution-browser.mjs
          node tests/aseryn-browser.mjs
          node tests/mage-browser.mjs
          node tests/daemon-browser.mjs
          node tests/angelus-browser.mjs
          node tests/extral-browser.mjs
          node tests/exile-browser.mjs
          node tests/campaigns-smoke.mjs
      - name: Bind release to exact tested source and reject concurrent changes
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/tuc-web-v2 | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code
          printf 'source=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build exact tested application images without database migration
        env:
          SOURCE_SHA: ${{ steps.publish.outputs.source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          mkdir -p apps/web/public /tmp/tuc-hunter-release
          node --input-type=module -e "import {writeFileSync} from 'node:fs';writeFileSync('apps/web/public/build-info.json',JSON.stringify({commit:process.env.SOURCE_SHA,release:'hunter-builder-20260930'}));"
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "tuc-v2-api:hunter-$SOURCE_SHA" -f apps/api/Dockerfile .
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "tuc-v2-web:hunter-$SOURCE_SHA" -f apps/web/Dockerfile .
          docker save "tuc-v2-api:hunter-$SOURCE_SHA" "tuc-v2-web:hunter-$SOURCE_SHA" | gzip -1 > /tmp/tuc-hunter-release/images.tar.gz
          git archive --format=tar HEAD apps > /tmp/tuc-hunter-release/apps-source.tar
          tar -rf /tmp/tuc-hunter-release/apps-source.tar apps/web/public/build-info.json
          gzip -1 /tmp/tuc-hunter-release/apps-source.tar
          printf '%s\n' "$SOURCE_SHA" > /tmp/tuc-hunter-release/source-sha.txt
          cd /tmp/tuc-hunter-release
          sha256sum images.tar.gz apps-source.tar.gz source-sha.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-builder-production-images
          path: /tmp/tuc-hunter-release/
          compression-level: 0
          retention-days: 3
  release:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tuc-dev
    env:
      SOURCE_SHA: ${{ needs.verify-and-build.outputs.source }}
      TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
      TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
      TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-and-build.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: hunter-builder-production-images
          path: /tmp/tuc-hunter-release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify archive integrity and measure temporary and expanded sizes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/tuc-hunter-release
          sha256sum --check SHA256SUMS
          test "$(cat source-sha.txt)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import json, os, pathlib, tarfile, zlib
          p=pathlib.Path('.')
          transfer=sum(f.stat().st_size for f in p.iterdir() if f.is_file())
          documents={}; stored={}; expanded={}; image_temporary=10240
          with tarfile.open('images.tar.gz','r|gz') as archive:
              for member in archive:
                  image_temporary += 512 + ((member.size+511)//512)*512
                  if not member.isfile():
                      continue
                  stored[member.name]=member.size
                  expanded[member.name]=member.size
                  f=archive.extractfile(member)
                  if member.size <= 4*1024*1024:
                      raw=f.read()
                      try:
                          documents[member.name]=json.loads(raw)
                      except (ValueError, UnicodeDecodeError):
                          pass
                  else:
                      prefix=f.read(2)
                      if prefix==b'\x1f\x8b':
                          decoder=zlib.decompressobj(16+zlib.MAX_WBITS)
                          count=len(decoder.decompress(prefix))
                          while True:
                              block=f.read(1024*1024)
                              if not block:
                                  break
                              count += len(decoder.decompress(block))
                          count += len(decoder.flush())
                          assert decoder.eof, 'Truncated compressed image layer'
                          expanded[member.name]=count
          manifest=documents['manifest.json']
          assert len(manifest)==2, 'Exactly API and web images required'
          layers={}
          for image in manifest:
              config=documents[image['Config']]
              assert config['config']['Labels']['org.opencontainers.image.revision']==os.environ['SOURCE_SHA']
              digests=config['rootfs']['diff_ids']
              assert len(digests)==len(image['Layers'])
              for digest,name in zip(digests,image['Layers']):
                  layers[digest]=max(layers.get(digest,0),expanded[name])
          source_allocated=0
          with tarfile.open('apps-source.tar.gz','r|gz') as archive:
              for member in archive:
                  source_allocated += ((member.size+4095)//4096)*4096+4096
          meta={'source':os.environ['SOURCE_SHA'],'transfer':transfer,'image_temporary':image_temporary+1024*1024,'source_allocated':source_allocated,'layers':layers}
          pathlib.Path('space-budget.json').write_text(json.dumps(meta))
          print(json.dumps({k:v for k,v in meta.items() if k!='layers'},indent=2))
          print('Layer count:',len(layers))
          PY
      - name: Measured preflight, verified backup and production deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/feature/tuc-web-v2 | cut -f1)" = "$SOURCE_SHA"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_prod
          chmod 600 ~/.ssh/tuc_prod
          ssh-keyscan -H "$TUC_DEV_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes"
          stage="/opt/terra-umbra/releases/hunter-$SOURCE_SHA"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "test -f /opt/terra-umbra/production-active && mkdir -p '$stage'"
          rsync -az -e "$SSH" /tmp/tuc-hunter-release/space-budget.json tools/daemon-release/space-budget.py "$TUC_DEV_USER@$TUC_DEV_HOST:$stage/"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "flock -n /opt/terra-umbra/.production-release.lock python3 '$stage/space-budget.py' '$stage/space-budget.json'"
          rsync -az -e "$SSH" /tmp/tuc-hunter-release/ "$TUC_DEV_USER@$TUC_DEV_HOST:$stage/"
          { printf '{\n'; cat infrastructure/production/release-hunter-builder.sh; printf '\n}\n'; } | $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$SOURCE_SHA"
      - name: Live browser without writes to real accounts
        id: live
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export TUC_V2_SMOKE_BASE_URL=https://terra-umbra.fr
          node tests/campaigns-smoke.mjs
      - name: Roll back this application only if live checks fail
        if: steps.live.outcome == 'failure'
        run: |
          { printf '{\n'; cat infrastructure/production/release-hunter-builder.sh; printf '\n}\n'; } | ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$SOURCE_SHA" rollback
          exit 1
      - name: Verify final public version
        if: steps.live.outcome == 'success'
        run: |
          curl --fail --silent --show-error --max-time 20 "https://terra-umbra.fr/build-info.json?verified=$GITHUB_RUN_ID" > /tmp/hunter-live.json
          node -e "const b=require('/tmp/hunter-live.json');if(b.commit!==process.env.SOURCE_SHA)process.exit(1);console.log('HUNTER LIVE VERIFIED',b)"
      - name: Remove this release's transfer archives after success; keep rollback images and sources
        if: steps.live.outcome == 'success'
        run: |
          ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" "test \"\$(cat /opt/terra-umbra/.production-release-sha)\" = '$SOURCE_SHA' && rm -f /opt/terra-umbra/releases/hunter-$SOURCE_SHA/images.tar.gz /opt/terra-umbra/releases/hunter-$SOURCE_SHA/apps-source.tar.gz"
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/tuc_prod
