name: V2 Chrome TLS compatibility diagnostic
on:
  push:
    branches: [feature/tuc-web-v2]
    paths: [.github/workflows/v2-chrome-tls-compatibility.yml]
permissions:
  contents: read
jobs:
  public-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe public Chrome ClientHello compatibility without changing production
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, socket, struct, ssl, urllib.request
          # Public TLS handshake template only. Client random and session ID regenerated.
          # No cookies, credentials, requests, private keys or NetLog file are included.
          hello = base64.b64decode('')
          def receive(sock, length):
              result = b''
              while len(result) < length:
                  part = sock.recv(length-len(result))
                  if not part:
                      raise RuntimeError('Unexpected connection close')
                  result += part
              return result
          def probe(label, packet):
              with socket.create_connection(('terra-umbra.fr',443),timeout=10) as sock:
                  sock.sendall(b'\x16\x03\x01'+struct.pack('!H',len(packet))+packet)
                  header=receive(sock,5)
                  payload=receive(sock,int.from_bytes(header[3:5],'big'))
                  print(label, 'record_type',header[0],'first_payload_bytes',payload[:2].hex(),flush=True)
                  if header[0]==21:
                      raise RuntimeError('Server TLS alert '+payload.hex())
                  assert header[0]==22 and payload[0]==2, 'Expected ServerHello'
                  print(label,'SERVER_ACCEPTED_CLIENT_HELLO',flush=True)
          probe('Chrome154-compatible',hello)
          for version in [ssl.TLSVersion.TLSv1_2,ssl.TLSVersion.TLSv1_3]:
              context=ssl.create_default_context()
              context.minimum_version=context.maximum_version=version
              with urllib.request.urlopen('https://terra-umbra.fr/api/health',context=context,timeout=15) as response:
                  assert response.status==200
                  print('CERTIFICATE_VALIDATED',version.name,'HTTP',response.status,flush=True)
          print('READ_ONLY_DIAGNOSTIC_COMPLETE')
          PY
