name: V2 production portrait release
on:
  push:
    branches: [feature/tuc-web-v2]
    paths: [.github/workflows/v2-production-portrait-release.yml]
permissions:
  contents: read
concurrency:
  group: tuc-v2-dev
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify portrait access and build both apps
        shell: bash
        run: |
          set -euo pipefail
          cd apps/api
          npm ci
          npm run build
          node scripts/check-portrait-admin-all.mjs
          node scripts/check-portrait-visibility.mjs
          cd ../web
          npm ci
          npm run build
  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: tuc-dev
    timeout-minutes: 20
    env:
      TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
      TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
      TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Release verified portraits with private backup and rollback
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TUC_DEV_HOST" && test -n "$TUC_DEV_USER" && test -n "$TUC_DEV_SSH_KEY"
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/tuc_prod' EXIT
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_prod
          chmod 600 ~/.ssh/tuc_prod
          ssh-keyscan -H "$TUC_DEV_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" 'test -f /opt/terra-umbra/production-active && test -f /opt/terra-umbra/infrastructure/.env'
          rsync -az -e "$SSH" apps/api/src/compendium.ts apps/api/src/quality.ts "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/apps/api/src/"
          rsync -az -e "$SSH" apps/api/Dockerfile "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/apps/api/"
          rsync -az -e "$SSH" apps/web/src/components/PortraitAdmin.vue "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/apps/web/src/components/"
          rsync -az -e "$SSH" compendium/source/portrait-legacy-mirrors-v1.json "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/compendium/source/"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" 'mkdir -p /opt/terra-umbra/compendium/images/portraits/legacy'
          rsync -az -e "$SSH" compendium/images/portraits/legacy/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/compendium/images/portraits/legacy/"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" <<'REMOTE'
          {
            set -euo pipefail
            cd /opt/terra-umbra/infrastructure
            bash production/backup.sh
            docker tag tuc-v2-api tuc-v2-api:before-portrait-release
            docker tag tuc-v2-web tuc-v2-web:before-portrait-release
            rollback() {
              status=$?
              if [ "$status" -ne 0 ]; then
                docker tag tuc-v2-api:before-portrait-release tuc-v2-api
                docker tag tuc-v2-web:before-portrait-release tuc-v2-web
                docker compose up -d --no-build --no-deps --force-recreate api web
                echo 'PORTRAIT RELEASE FAILED — previous containers restored; persistent data retained' >&2
                exit "$status"
              fi
            }
            trap rollback EXIT
            docker compose build api web
            docker compose up -d --no-deps api web
            ready=false
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --max-time 10 https://terra-umbra.fr/api/health >/dev/null; then
                ready=true
                break
              fi
              sleep 5
            done
            [ "$ready" = true ]
            curl --fail --silent --show-error https://terra-umbra.fr/api/compendium/media/images/portraits/legacy/ee357dc61aeb38e6.png -o /dev/null
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' https://terra-umbra.fr/api/admin/compendium-quality/pnj-portraits-chasseurs-autres-la-reine/portraits)
            [ "$code" = 401 ]
            trap - EXIT
            echo 'PRODUCTION PORTRAITS LIVE — HTTPS, legacy image and private admin endpoint verified'
          }
          REMOTE
