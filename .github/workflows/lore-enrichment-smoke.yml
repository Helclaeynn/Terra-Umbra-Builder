name: Lore enrichment browser smoke

on:
  push:
    branches:
      - preview/lore
    paths:
      - '.github/workflows/lore-enrichment-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Run enrichment smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tuc-lore-enrichment-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f .lore-enrichment-smoke.mjs' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/compendium/lore-unified-preview.html >/dev/null && break
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo 'Chrome/Chromium introuvable.' >&2; exit 1; }
          cat > .lore-enrichment-smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
          const page=await browser.newPage();
          const errors=[];
          page.on('pageerror',error=>errors.push(error.message));
          page.on('console',msg=>{if(msg.type()==='error'&&!msg.text().includes('Failed to load resource'))errors.push(msg.text());});
          await page.goto('http://127.0.0.1:8765/compendium/lore-unified-preview.html',{waitUntil:'domcontentloaded'});
          async function openDoc(docId,pageId,expectedHeading,expectedText){
            await page.evaluate(id=>{location.hash=`#/${id}`;},docId);
            await page.waitForFunction(id=>document.querySelector('#previewFrame')?.getAttribute('src')?.includes(`${id}-preview.html`),docId,{timeout:15000});
            const frame=page.frameLocator('#previewFrame');
            await frame.locator('#nav a[data-id="'+pageId+'"]').click();
            await frame.locator('h1').waitFor({state:'visible',timeout:15000});
            await frame.locator('h2',{hasText:expectedHeading}).waitFor({state:'visible',timeout:15000});
            if(expectedText)await frame.locator('.body-p',{hasText:expectedText}).first().waitFor({state:'visible',timeout:15000});
            return frame;
          }
          let frame=await openDoc('anti-systemes','hell-angels','Implantation et identité','Hell Angels restent');
          const antiBody=await frame.locator('#content').innerText();
          if(antiBody.includes('Le document source ne contient sous ce titre'))throw new Error('Le placeholder éditorial Anti-systèmes est encore visible.');
          await page.click('#tucEditPage');
          await page.waitForSelector('.editor-dialog[open]');
          if(await page.locator('.editor-section').count()<2)throw new Error('Les sections enrichies ne sont pas reprises par l’éditeur.');
          if(!(await page.locator('.editor-section textarea').first().inputValue()).includes('Hell Angels restent'))throw new Error('Le lore enrichi n’est pas la base éditable.');
          await page.locator('.editor-dialog [data-action="cancel"]').click();
          await openDoc('mage-lodges','loge-new-york','L’ancienne Haute Loge américaine','ancien ordre magique');
          await openDoc('daemon-temples','temple-belial','Le cœur du pouvoir de Belial','Cabinet Faith');
          await openDoc('angelus','sephira-kether','Sens du Sephira','Kether exprime');
          await openDoc('agences','services-etrangers','Le renseignement hors de Grande Californie','grands services de renseignement');
          await openDoc('corporations','nymphrover-corporation','Positionnement','construction de navires');
          await page.evaluate(()=>{location.hash='#/police';});
          await page.waitForFunction(()=>document.querySelector('#previewFrame')?.getAttribute('src')?.includes('police-preview.html'),null,{timeout:15000});
          frame=page.frameLocator('#previewFrame');
          await frame.locator('#nav a[data-id="laus-contexte"]').click();
          await frame.locator('h1').waitFor({state:'visible',timeout:15000});
          const policeBody=await frame.locator('#content').innerText();
          if(policeBody.includes('les deux formes coexistent dans le fichier'))throw new Error('Une formulation méta Police est encore visible.');
          if(errors.length)throw new Error(`Erreurs navigateur: ${errors.join(' | ')}`);
          await browser.close();
          console.log('Lore enrichment browser smoke: OK');
          NODE
          CHROME_BIN="$CHROME_BIN" node .lore-enrichment-smoke.mjs
