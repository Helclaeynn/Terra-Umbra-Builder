# Mise à l'essai sur dev.terra-umbra.fr, uniquement à la main (onglet Actions →
# « Mise à l'essai » → choisir la branche → Run workflow). Ne touche jamais au
# site de production.
name: Mise à l'essai

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Recopier les données du vrai site (dernière sauvegarde)"
        type: boolean
        default: false

concurrency:
  group: recette
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recette:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HOST: ${{ secrets.TUC_DEV_HOST }}
      USER_NAME: ${{ secrets.TUC_DEV_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Archive du commit
        run: |
          printf '%s\n' "${{ github.sha }}" > .release-sha
          git archive --format=tar.gz --add-file=.release-sha -o release.tar.gz HEAD \
            apps character-builder compendium infrastructure

      - name: Accès au serveur
        env:
          SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "$HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ592nh2kHfUzyLk7b2ql9Xe1AO2jJWbWIWhw7Yu36KG" > ~/.ssh/known_hosts

      # La clé de GitHub passe par le portier du serveur
      # (infrastructure/production/ssh-gate.sh) : déposer l'archive, puis lancer.
      - name: Mise à l'essai
        run: |
          remote="$USER_NAME@$HOST"
          ssh_opts="-i $HOME/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          refresh=${{ inputs.refresh_data && '1' || '0' }}
          ssh $ssh_opts "$remote" "upload recette-${{ github.sha }}.tar.gz" < release.tar.gz
          ssh $ssh_opts "$remote" "recette ${{ github.sha }} $refresh"
