name: Fix and validate Lore Compendium projection

on:
  push:
    branches:
      - preview/lore
    paths:
      - '.github/workflows/lore-projection-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix projection source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('compendium/lore-compendium-preview.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'\\\"':'&quot'", "'\\\"':'&quot;'")
          s=s.replace('Le `main` actuel contient encore', 'Le main actuel contient encore')
          p.write_text(s,encoding='utf-8')
          PY
          node --input-type=module --check < compendium/lore-compendium-preview.js
      - name: Install browser driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Run projection browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tuc-lore-projection-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f .lore-projection-smoke.mjs' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/compendium/lore-compendium-preview.html >/dev/null && break
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo 'Chrome/Chromium introuvable.' >&2; exit 1; }
          cat > .lore-projection-smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('pageerror',error=>errors.push(error.message));
          page.on('console',msg=>{if(msg.type()==='error'&&!msg.text().includes('Failed to load resource'))errors.push(msg.text());});
          await page.goto('http://127.0.0.1:8765/compendium/lore-compendium-preview.html',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('.integration-metrics',{timeout:15000});
          const home=await page.locator('#main').innerText();
          for(const expected of ['196','364','397','687'])if(!home.includes(expected))throw new Error(`Métrique absente: ${expected}`);
          const orgCount=await page.locator('#mainNav a',{hasText:'Organisations'}).locator('.count').textContent();
          if(orgCount?.trim()!=='305')throw new Error(`Compte Organisations incorrect: ${orgCount}`);
          await page.goto('http://127.0.0.1:8765/compendium/lore-compendium-preview.html#/category/R%C3%A9alit%C3%A9',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelectorAll('.integration-article').length===18,null,{timeout:25000});
          await page.goto('http://127.0.0.1:8765/compendium/lore-compendium-preview.html#/article/anti-systemes/hell-angels',{waitUntil:'domcontentloaded'});
          await page.locator('.compendium-projected-page h1').waitFor({state:'visible',timeout:20000});
          await page.locator('.compendium-projected-page h2',{hasText:'Implantation et identité'}).waitFor({state:'visible',timeout:15000});
          await page.locator('.compendium-projected-page .body-p',{hasText:'Hell Angels restent'}).first().waitFor({state:'visible',timeout:15000});
          if(await page.locator('#tocBox .toc-link').count()<2)throw new Error('Sommaire latéral non alimenté.');
          await page.goto('http://127.0.0.1:8765/compendium/pegre-preview.html',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('.preview-layout .sidebar',{timeout:15000});
          const scroll=await page.locator('.preview-layout .sidebar').evaluate(el=>({overflowY:getComputedStyle(el).overflowY,maxHeight:getComputedStyle(el).maxHeight}));
          if(!['auto','scroll'].includes(scroll.overflowY))throw new Error(`Pègre sans défilement vertical: ${JSON.stringify(scroll)}`);
          if(errors.length)throw new Error(`Erreurs navigateur: ${errors.join(' | ')}`);
          await browser.close();
          console.log('Lore enriched Compendium projection smoke: OK');
          NODE
          CHROME_BIN="$CHROME_BIN" node .lore-projection-smoke.mjs
      - name: Commit projection fix
        shell: bash
        run: |
          if git diff --quiet -- compendium/lore-compendium-preview.js; then
            echo 'No projection source change to commit.'
            exit 0
          fi
          git config user.name 'Helclaeynn'
          git config user.email 'malekith51@hotmail.com'
          git add compendium/lore-compendium-preview.js
          git commit -m 'fix(lore): validate enriched Compendium projection'
          git push origin HEAD:preview/lore
