name: Validate direct RawGitHack CDN preview

on:
  push:
    branches:
      - preview/lore
    paths:
      - '.github/workflows/fix-githack-v3-loader.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extend preview loader to rawcdn.githack.com
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('compendium/app-v3.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(location.hostname==='raw.githack.com'){","if(location.hostname==='raw.githack.com'||location.hostname==='rawcdn.githack.com'){")
          p.write_text(s,encoding='utf-8')
          PY
          node --input-type=module --check < compendium/app-v3.js
          git config user.name Helclaeynn
          git config user.email malekith51@hotmail.com
          git add compendium/app-v3.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(compendium): support direct RawGitHack CDN previews'
            git push origin HEAD:preview/lore
          fi
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Smoke direct public preview
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          URL="https://rawcdn.githack.com/Helclaeynn/Terra-Umbra-Builder/${SHA}/compendium/index.html"
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          cat > .smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
          const page=await browser.newPage();
          const errors=[]; const raw=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('requestfailed',r=>errors.push(`REQUEST ${r.url()} ${r.failure()?.errorText||''}`));
          page.on('request',r=>{if(r.url().includes('raw.githubusercontent.com'))raw.push(r.url())});
          await page.goto(process.env.PUBLIC_URL,{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForFunction(()=>document.querySelector('#main')?.textContent?.includes('687 entrées'),null,{timeout:30000});
          await page.evaluate(()=>{location.hash='#/article/lore-anti-systemes-hell-angels'});
          await page.waitForFunction(()=>document.querySelector('#main h1')?.textContent?.includes('Hell Angels'),null,{timeout:15000});
          const text=await page.locator('#main').innerText();
          if(text.length<500)throw new Error('Hell Angels incomplet');
          if(raw.length)throw new Error('raw.githubusercontent encore utilisé: '+raw.join(', '));
          const meaningful=errors.filter(x=>!x.includes('favicon')&&!x.includes('ethicalads'));
          if(meaningful.length)throw new Error(meaningful.join('\n'));
          console.log('DIRECT RAWCDN SMOKE OK',process.env.PUBLIC_URL);
          await browser.close();
          NODE
          PUBLIC_URL="$URL" CHROME_BIN="$CHROME_BIN" node .smoke.mjs
