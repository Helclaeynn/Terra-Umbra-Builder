name: Diagnose RawGitHack V3 loader

on:
  push:
    branches:
      - preview/lore
    paths:
      - '.github/workflows/fix-githack-v3-loader.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Inspect public preview
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          URL="https://raw.githack.com/Helclaeynn/Terra-Umbra-Builder/${SHA}/compendium/index.html"
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          cat > .diag.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
          const page=await browser.newPage();
          page.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
          page.on('pageerror',e=>console.log('PAGEERROR',String(e)));
          page.on('requestfailed',r=>console.log('FAILED',r.url(),r.failure()?.errorText));
          page.on('response',r=>{const u=r.url();if(u.includes('githack')||u.includes('jsdelivr')||u.includes('raw.githubusercontent'))console.log('RESP',r.status(),u)});
          console.log('OPEN',process.env.PUBLIC_URL);
          await page.goto(process.env.PUBLIC_URL,{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(15000);
          console.log('MAIN',JSON.stringify((await page.locator('#main').innerText()).slice(0,1500)));
          console.log('URL',page.url());
          await browser.close();
          NODE
          PUBLIC_URL="$URL" CHROME_BIN="$CHROME_BIN" node .diag.mjs
