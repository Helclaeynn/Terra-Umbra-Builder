name: V2 production Extral release retry
on:
  push:
    branches: [feature/tuc-web-v2]
    paths: [.github/workflows/v2-production-extral-retry.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: tuc-v2-production
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact tested application and only missing Docker test copy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source=b3b5b58d6ecb673a5a0156f2fb700cf9b62a641f
          git fetch --no-tags --depth=1 origin "$source"
          git diff --exit-code "$source" HEAD -- . ':!apps/api/Dockerfile' ':!.github/workflows/v2-production-extral-retry.yml'
          test "$(git ls-remote origin refs/heads/feature/tuc-web-v2 | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import pathlib, subprocess
          previous=subprocess.check_output(['git','show','b3b5b58d6ecb673a5a0156f2fb700cf9b62a641f:apps/api/Dockerfile'],text=True)
          anchor='# The build-time Aseryn registry check loads the canonical Truth equipment and corruption data.\n'
          assert previous.count(anchor)==1
          expected=previous.replace(anchor,'COPY apps/api/scripts/check-extral-revision.mjs ./scripts/\n'+anchor)
          assert pathlib.Path('apps/api/Dockerfile').read_text()==expected, 'Only the missing test-script COPY is authorized in this retry'
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/36621420583/jobs" > /tmp/extral-tested-jobs.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const job=JSON.parse(readFileSync('/tmp/extral-tested-jobs.json','utf8')).jobs.find(j=>j.name==='verify-and-build');
          assert.equal(job.head_sha,'6c17f6941d4e815b8f9ec208aee53988d8a0ca34');
          for(const name of ['Apply exact approved Extral revisions and preserve other Natures','Compile API and verify canonical talents and reward guard','PostgreSQL private media, sharing, saved sheets and campaign isolation','Full web regression and approved Extral choices, stock and scenario counters','Real browser Extral choices, mobile and complete application','Publish exact tested application source without overwriting concurrent changes'])assert.equal(job.steps.find(s=>s.name===name)?.conclusion,'success',name);
          assert.equal(job.steps.find(s=>s.name==='Build exact tested application images without database migration')?.conclusion,'failure');
          console.log('EXTRAL TESTED SOURCE RETAINED — all API, PostgreSQL, UI, PDF and real browser checks passed; only the missing Docker COPY is changed; complete Docker builds are rerun');
          NODE
      - name: Build exact tested application images without database migration
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          mkdir -p apps/web/public /tmp/tuc-extral-release
          node --input-type=module -e "import {writeFileSync} from 'node:fs';writeFileSync('apps/web/public/build-info.json',JSON.stringify({commit:process.env.SOURCE_SHA,release:'extral-talents-20260929'}));"
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "tuc-v2-api:extral-$SOURCE_SHA" -f apps/api/Dockerfile .
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "tuc-v2-web:extral-$SOURCE_SHA" -f apps/web/Dockerfile .
          docker save "tuc-v2-api:extral-$SOURCE_SHA" "tuc-v2-web:extral-$SOURCE_SHA" | gzip -1 > /tmp/tuc-extral-release/images.tar.gz
          git archive --format=tar HEAD apps > /tmp/tuc-extral-release/apps-source.tar
          tar -rf /tmp/tuc-extral-release/apps-source.tar apps/web/public/build-info.json
          gzip -1 /tmp/tuc-extral-release/apps-source.tar
          printf '%s\n' "$SOURCE_SHA" > /tmp/tuc-extral-release/source-sha.txt
          cd /tmp/tuc-extral-release
          sha256sum images.tar.gz apps-source.tar.gz source-sha.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: extral-talents-production-images
          path: /tmp/tuc-extral-release/
          compression-level: 0
          retention-days: 3
  release:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tuc-dev
    env:
      SOURCE_SHA: ${{ needs.verify-and-build.outputs.source }}
      TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
      TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
      TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-and-build.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: extral-talents-production-images
          path: /tmp/tuc-extral-release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify archive integrity and measure temporary and expanded sizes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/tuc-extral-release
          sha256sum --check SHA256SUMS
          test "$(cat source-sha.txt)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import json, os, pathlib, tarfile, zlib
          p=pathlib.Path('.')
          transfer=sum(f.stat().st_size for f in p.iterdir() if f.is_file())
          documents={}; stored={}; expanded={}; image_temporary=10240
          with tarfile.open('images.tar.gz','r|gz') as archive:
              for member in archive:
                  image_temporary += 512 + ((member.size+511)//512)*512
                  if not member.isfile():
                      continue
                  stored[member.name]=member.size
                  expanded[member.name]=member.size
                  f=archive.extractfile(member)
                  if member.size <= 4*1024*1024:
                      raw=f.read()
                      try:
                          documents[member.name]=json.loads(raw)
                      except (ValueError, UnicodeDecodeError):
                          pass
                  else:
                      prefix=f.read(2)
                      if prefix==b'\x1f\x8b':
                          decoder=zlib.decompressobj(16+zlib.MAX_WBITS)
                          count=len(decoder.decompress(prefix))
                          while True:
                              block=f.read(1024*1024)
                              if not block:
                                  break
                              count += len(decoder.decompress(block))
                          count += len(decoder.flush())
                          assert decoder.eof, 'Truncated compressed image layer'
                          expanded[member.name]=count
          manifest=documents['manifest.json']
          assert len(manifest)==2, 'Exactly API and web images required'
          layers={}
          for image in manifest:
              config=documents[image['Config']]
              assert config['config']['Labels']['org.opencontainers.image.revision']==os.environ['SOURCE_SHA']
              digests=config['rootfs']['diff_ids']
              assert len(digests)==len(image['Layers'])
              for digest,name in zip(digests,image['Layers']):
                  layers[digest]=max(layers.get(digest,0),expanded[name])
          source_allocated=0
          with tarfile.open('apps-source.tar.gz','r|gz') as archive:
              for member in archive:
                  source_allocated += ((member.size+4095)//4096)*4096+4096
          meta={'source':os.environ['SOURCE_SHA'],'transfer':transfer,'image_temporary':image_temporary+1024*1024,'source_allocated':source_allocated,'layers':layers}
          pathlib.Path('space-budget.json').write_text(json.dumps(meta))
          print(json.dumps({k:v for k,v in meta.items() if k!='layers'},indent=2))
          print('Layer count:',len(layers))
          PY
      - name: Measured preflight, verified backup and production deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/feature/tuc-web-v2 | cut -f1)" = "$SOURCE_SHA"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_prod
          chmod 600 ~/.ssh/tuc_prod
          ssh-keyscan -H "$TUC_DEV_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes"
          stage="/opt/terra-umbra/releases/extral-$SOURCE_SHA"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "test -f /opt/terra-umbra/production-active && mkdir -p '$stage'"
          rsync -az -e "$SSH" /tmp/tuc-extral-release/space-budget.json tools/daemon-release/space-budget.py "$TUC_DEV_USER@$TUC_DEV_HOST:$stage/"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "flock -n /opt/terra-umbra/.production-release.lock python3 '$stage/space-budget.py' '$stage/space-budget.json'"
          rsync -az -e "$SSH" /tmp/tuc-extral-release/ "$TUC_DEV_USER@$TUC_DEV_HOST:$stage/"
          { printf '{\n'; cat infrastructure/production/release-extral-talents.sh; printf '\n}\n'; } | $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$SOURCE_SHA"
      - name: Live browser without writes to real accounts
        id: live
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export TUC_V2_SMOKE_BASE_URL=https://terra-umbra.fr
          node tests/builder-v2-smoke.mjs
          node tests/campaigns-smoke.mjs
      - name: Roll back this application only if live checks fail
        if: steps.live.outcome == 'failure'
        run: |
          { printf '{\n'; cat infrastructure/production/release-extral-talents.sh; printf '\n}\n'; } | ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$SOURCE_SHA" rollback
          exit 1
      - name: Verify final public version
        if: steps.live.outcome == 'success'
        run: |
          curl --fail --silent --show-error --max-time 20 "https://terra-umbra.fr/build-info.json?verified=$GITHUB_RUN_ID" > /tmp/extral-live.json
          node -e "const b=require('/tmp/extral-live.json');if(b.commit!==process.env.SOURCE_SHA)process.exit(1);console.log('EXTRAL LIVE VERIFIED',b)"
      - name: Remove this release's transfer archives after success; keep rollback images and sources
        if: steps.live.outcome == 'success'
        run: |
          ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" "test \"\$(cat /opt/terra-umbra/.production-release-sha)\" = '$SOURCE_SHA' && rm -f /opt/terra-umbra/releases/extral-$SOURCE_SHA/images.tar.gz /opt/terra-umbra/releases/extral-$SOURCE_SHA/apps-source.tar.gz"
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/tuc_prod
