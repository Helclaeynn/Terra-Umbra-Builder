name: V2 recipe source snapshot

on:
  push:
    branches: [feature/tuc-web-v2]
    paths: [.github/workflows/v2-recipe-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install test dependencies
        run: |
          (cd apps/api && npm ci)
          (cd apps/web && npm install && npm install --no-save --package-lock=false playwright-core@1.55.0)
      - name: Archive installed dependencies without credentials
        run: |
          tar -czf tuc-v2-recipe-dependencies.tar.gz apps/api/node_modules apps/web/node_modules
          printf '%s\n' "$(git rev-parse HEAD)" > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tuc-v2-recipe-dependencies
          path: |
            tuc-v2-recipe-dependencies.tar.gz
            source-commit.txt
          retention-days: 1
          compression-level: 0
