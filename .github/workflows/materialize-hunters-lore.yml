name: Materialize hunters lore

on:
  push:
    branches:
      - main
    paths:
      - 'compendium/source/truth-lore-hunters-2026-09-v1-*.b64part'
      - 'scripts/integrate-truth-lore-hunters-2026-09-v1.mjs'
      - '.github/workflows/materialize-hunters-lore.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize hunters corpus
        run: |
          node scripts/integrate-truth-lore-hunters-2026-09-v1.mjs
          node scripts/build-compendium-navigation.mjs
      - name: Validate hunters corpus
        run: |
          node compendium/tests/truth-lore-hunters-2026-09-check.mjs
          node compendium/tests/manifest-check.mjs
          node compendium/tests/navigation-check.mjs
          node compendium/tests/truth-lore-khinae-hunters-check.mjs
          node compendium/tests/truth-lore-exiles-check.mjs
          node compendium/tests/truth-lore-predators-check.mjs
          node compendium/tests/truth-lore-mages-angelus-check.mjs
          node compendium/tests/truth-lore-peoples-check.mjs
          node compendium/tests/truth-lore-corruption-fleaux-check.mjs
          node compendium/tests/wiki-context-audit.mjs
      - name: Commit materialized corpus
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- compendium/data; then
            echo "No generated corpus changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A compendium/data
          git commit -m "feat(compendium): integrate hunters lore corpus"
          git push origin HEAD:main
