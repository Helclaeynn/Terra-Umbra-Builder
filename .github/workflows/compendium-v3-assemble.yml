name: Assemble Compendium V3 datasets

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tuc-compendium-v3-transfer-final
    paths:
      - compendium/data/_v3transport/READY

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble and validate exact datasets
        run: node compendium/tests/assemble-v3-transport.mjs
      - name: Commit assembled V3 datasets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compendium/data/manifest-v3.json compendium/data/v3-*-00.b64part
          git diff --cached --quiet && exit 0
          git commit -m 'Assemble validated Compendium V3 datasets'
          git push
