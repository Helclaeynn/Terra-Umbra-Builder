name: Run enriched Bestiary V16 build

on:
  push:
    branches:
      - preview/lore
    paths:
      - '.github/workflows/bestiary-v16-run.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and audit enriched Bestiary
        run: node scripts/build-bestiary-v16.mjs
      - name: Commit generated Bestiary
        shell: bash
        run: |
          git config user.name Helclaeynn
          git config user.email malekith51@hotmail.com
          git add compendium/data/manifest-v3.json compendium/data/v3-bestiaire-*.b64part compendium/data/.working/bestiary-v16-decoded.json
          git add -u compendium/data/
          git commit -m 'feat(lore): enrich Bestiary and add Dives'
          git push origin HEAD:preview/lore
