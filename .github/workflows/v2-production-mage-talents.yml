name: V2 production approved Mage talents
on:
  push:
    branches: [feature/tuc-web-v2]
    paths:
      - .github/workflows/v2-production-mage-talents.yml
permissions:
  contents: read
concurrency:
  group: tuc-v2-production
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      source: ${{ steps.publish.outputs.source }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tuc
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: tuc_sheet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tuc -d tuc_sheet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tuc:ci-only-placeholder@127.0.0.1:5432/tuc_sheet_test
      TUC_SHEET_SMOKE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact approved Mage diff and preserve all other Natures
        run: node tools/mage-release/apply.mjs
      - name: Prepare complete rule data without modifying source catalogues
        run: |
          mkdir -p .v2-rules-data/lore
          cp compendium/source/current-equipment-catalog-v1.json .v2-rules-data/
          cp compendium/source/reality-lore-v3-*.json .v2-rules-data/lore/
          cp character-builder/rulesets/terra-umbra/reality/augmentations.json.gz.b64 .v2-rules-data/
          cp character-builder/rulesets/terra-umbra/reality/safe/neuroprograms.part01.b64 character-builder/rulesets/terra-umbra/reality/safe/vehicles.part01.b64 .v2-rules-data/
      - name: Compile API and verify canonical talents and reward guard
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          node scripts/check-campaign-reward-guard.mjs
          node scripts/check-api-container-assets.mjs
          node scripts/check-truth-v7-builder-integration.mjs
          node scripts/check-truth-aseryn-terres-temples.mjs
      - name: PostgreSQL private media, sharing, saved sheets and campaign isolation
        working-directory: apps/api
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          import {pool} from './dist/db.js';
          for(const n of (await readdir('../../infrastructure/migrations')).filter(n=>n.endsWith('.sql')).sort())await pool.query(await readFile('../../infrastructure/migrations/'+n,'utf8'));
          await pool.end();
          NODE
          node scripts/check-character-media.mjs
          node scripts/check-character-sheet-access.mjs
          node scripts/check-campaign-workspace.mjs
          node scripts/check-campaign-source-revision.mjs
          node scripts/check-reality-benefits-persistence.mjs
          node scripts/check-mage-persistence.mjs
      - name: Full web regression, approved Mage costs and inherited paths
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          npm run test:ui
          npm run test:pdf
      - name: Real browser Mage paths, short cards, mobile and complete application
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/character-evolution-browser.mjs
          node tests/aseryn-browser.mjs
          node tests/mage-browser.mjs
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/tuc-mage-preview.log 2>&1 &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export TUC_V2_SMOKE_BASE_URL=http://127.0.0.1:4173
          node tests/builder-v2-smoke.mjs
          node tests/campaigns-smoke.mjs
      - name: Publish tested source without overwriting concurrent changes
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/mage-release/apply.mjs verify
          test "$(git ls-remote origin refs/heads/feature/tuc-web-v2 | cut -f1)" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(mage): apply approved talents, clear progression and persisted technique sheets'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feature/tuc-web-v2
          printf 'source=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build exact tested application images without database migration
        env:
          SOURCE_SHA: ${{ steps.publish.outputs.source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p apps/web/public /tmp/tuc-mage-release
          node --input-type=module -e "import {writeFileSync} from 'node:fs';writeFileSync('apps/web/public/build-info.json',JSON.stringify({commit:process.env.SOURCE_SHA,release:'mage-talents-20260929'}));"
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "tuc-v2-api:mage-$SOURCE_SHA" -f apps/api/Dockerfile .
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "tuc-v2-web:mage-$SOURCE_SHA" -f apps/web/Dockerfile .
          docker save "tuc-v2-api:mage-$SOURCE_SHA" "tuc-v2-web:mage-$SOURCE_SHA" | gzip -1 > /tmp/tuc-mage-release/images.tar.gz
          git archive --format=tar HEAD apps > /tmp/tuc-mage-release/apps-source.tar
          tar -rf /tmp/tuc-mage-release/apps-source.tar apps/web/public/build-info.json
          gzip -1 /tmp/tuc-mage-release/apps-source.tar
          printf '%s\n' "$SOURCE_SHA" > /tmp/tuc-mage-release/source-sha.txt
          cd /tmp/tuc-mage-release
          sha256sum images.tar.gz apps-source.tar.gz source-sha.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mage-talents-production-images
          path: /tmp/tuc-mage-release/
          compression-level: 0
          retention-days: 3
  release:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tuc-dev
    env:
      SOURCE_SHA: ${{ needs.verify-and-build.outputs.source }}
      TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
      TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
      TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-and-build.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mage-talents-production-images
          path: /tmp/tuc-mage-release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Disk preflight, verified backup and release to terra-umbra.fr
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_prod
          chmod 600 ~/.ssh/tuc_prod
          ssh-keyscan -H "$TUC_DEV_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" 'bash -s' <<'REMOTE'
          {
            set -euo pipefail
            root=/opt/terra-umbra
            test -f "$root/production-active"
            exec 9>"$root/.production-release.lock"
            flock -n 9 || exit 1
            if [ "$(df -B1 --output=avail "$root" | tail -1 | tr -d ' ')" -lt 6442450944 ]; then
              docker builder prune --all --force --keep-storage 2GB
            fi
            df -h "$root"
            test "$(df -B1 --output=avail "$root" | tail -1 | tr -d ' ')" -ge 6442450944
          }
          REMOTE
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "mkdir -p /opt/terra-umbra/releases/mage-$SOURCE_SHA"
          rsync -az -e "$SSH" /tmp/tuc-mage-release/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/releases/mage-$SOURCE_SHA/"
          { printf '{\n'; cat infrastructure/production/release-mage-talents.sh; printf '\n}\n'; } | $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$SOURCE_SHA"
      - name: Live browser without writes to real accounts
        id: live
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export TUC_V2_SMOKE_BASE_URL=https://terra-umbra.fr
          node tests/builder-v2-smoke.mjs
          node tests/campaigns-smoke.mjs
      - name: Roll back this application only if live checks fail
        if: steps.live.outcome == 'failure'
        run: |
          { printf '{\n'; cat infrastructure/production/release-mage-talents.sh; printf '\n}\n'; } | ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$SOURCE_SHA" rollback
          exit 1
      - name: Remove this release's transfer archives after success; keep rollback images and sources
        if: steps.live.outcome == 'success'
        run: |
          ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" "test \"\$(cat /opt/terra-umbra/.production-release-sha)\" = '$SOURCE_SHA' && rm -f /opt/terra-umbra/releases/mage-$SOURCE_SHA/images.tar.gz /opt/terra-umbra/releases/mage-$SOURCE_SHA/apps-source.tar.gz"
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/tuc_prod
