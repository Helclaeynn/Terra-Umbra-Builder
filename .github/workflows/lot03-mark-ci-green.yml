name: Mark lot03 PNJ ci_green
on:
  push:
    branches:
      - feature/tuc-compendium-characters-antisysteme-03
permissions:
  contents: write
jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mark lot03 registry entries ci_green
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='compendium/data/character-registry.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const ids=new Set([
            'pnj-247-stephany-lorn','pnj-248-lana-jackson','pnj-249-xander-lucas','pnj-250-luther-pierce','pnj-125-daldea-fann','pnj-251-addison-fockell','pnj-252-solomon-blackburn','pnj-253-miguel-gonzalez','pnj-254-adalyn-owens','pnj-255-encarnacion-miralles','pnj-256-kyle-simmons','pnj-257-raghnaid-peutan','pnj-258-eamonn-mac-cearain','pnj-259-rike-kuechler','pnj-260-cannon-mullins','pnj-261-zaketa-harris','pnj-262-annushka-lyninka-maxinovna','pnj-263-lemaun-cross','pnj-264-toxicity-norton','pnj-265-honda-daisuke','pnj-266-miyashiro-kamiko','pnj-267-shitomada-kiyoemon','pnj-268-yokoyama-shinobu','pnj-269-wenona','pnj-062-ciara-mcfarlane','pnj-270-meilir-yarwood','pnj-271-zack-littlebear'
          ]);
          let n=0;
          for(const c of r.characters||[]){
            if(ids.has(c.compendiumId)){
              c.status='ci_green';
              c.userValidated=false;
              n++;
            }
          }
          if(n!==27) throw new Error(`Expected 27 lot03 registry entries, found ${n}`);
          r.updated='2026-09-13';
          fs.writeFileSync(p,JSON.stringify(r));
          console.log(`CI_GREEN_UPDATED=${n}`);
          NODE
          rm -f .github/workflows/lot03-mark-ci-green.yml
          git config user.name "Helclaeynn"
          git config user.email "malekith51@hotmail.com"
          git add -A
          git commit -m "chore(compendium): mark anti-system lot 03 ci green"
          git push
