name: Lore editor Image Portrait smoke

on:
  push:
    branches:
      - preview/lore
    paths:
      - 'compendium/lore-preview-editor.js'
      - 'compendium/lore-preview-editor-view.js'
      - 'compendium/lore-preview-editor-dialog.js'
      - 'compendium/lore-preview-media.js'
      - 'compendium/lore-unified-preview.html'
      - '.github/workflows/lore-editor-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Run Lore media browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tuc-lore-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f .lore-editor-smoke.mjs /tmp/pixel.png' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/compendium/lore-unified-preview.html >/dev/null && break
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo 'Chrome/Chromium introuvable.' >&2; exit 1; }
          cat > .lore-editor-smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
          const page=await browser.newPage();
          const browserErrors=[];
          page.on('console',msg=>{if(msg.type()==='error'&&!msg.text().includes('Failed to load resource'))browserErrors.push(msg.text());});
          page.on('pageerror',error=>browserErrors.push(error.message));
          const assertMedia=async(frame,selector)=>{
            const img=frame.locator(selector);
            await img.waitFor({state:'attached',timeout:15000});
            await img.evaluate(el=>el.scrollIntoView({block:'center'}));
            const metrics=await img.evaluate(async el=>{
              for(let i=0;i<100&&el.naturalWidth===0;i+=1)await new Promise(resolve=>setTimeout(resolve,100));
              const figure=el.closest('figure'),rect=figure?.getBoundingClientRect(),style=figure?getComputedStyle(figure):null;
              return {naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,width:rect?.width||0,height:rect?.height||0,display:style?.display||'',visibility:style?.visibility||''};
            });
            if(!metrics.naturalWidth||!metrics.naturalHeight||!metrics.width||!metrics.height||metrics.display==='none'||metrics.visibility==='hidden')throw new Error(`Média non rendu: ${JSON.stringify(metrics)}`);
          };
          await fs.writeFile('/tmp/pixel.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAK0lEQVR42u3OIQEAAAwEoetfeovxBoGnq1tKQEBAQEBAQEBAQEBAQEBgHXhUDfhqeP5ugAAAAABJRU5ErkJggg==','base64'));
          await page.goto('http://127.0.0.1:8765/compendium/lore-unified-preview.html',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('#tucEditPage:not([hidden])',{timeout:15000});
          await page.click('#tucEditPage');
          await page.waitForSelector('.editor-dialog[open]');
          for(const [kind,alt,caption] of [['image','Logo de test','Légende image'],['portrait','Portrait de test','Légende portrait']]){
            const chooserPromise=page.waitForEvent('filechooser');
            await page.locator(`.editor-section [data-action="add-media"][data-kind="${kind}"]`).first().click();
            await (await chooserPromise).setFiles('/tmp/pixel.png');
            const block=page.locator(`.editor-block[data-inline-media-kind="${kind}"]`).last();
            await block.locator('[data-inline-media-alt]').fill(alt);
            await block.locator('[data-inline-media-caption]').fill(caption);
            await block.locator('[data-inline-media-status]').filter({hasText:'WebP local prêt'}).waitFor({timeout:15000});
          }
          await page.locator('.editor-dialog button[type="submit"]').click();
          let frame=page.frameLocator('#previewFrame');
          await assertMedia(frame,'.content-inline-media.image img[alt="Logo de test"]');
          await assertMedia(frame,'.content-inline-media.portrait img[alt="Portrait de test"]');
          await page.reload({waitUntil:'domcontentloaded'});
          await page.waitForSelector('#tucEditPage:not([hidden])',{timeout:15000});
          frame=page.frameLocator('#previewFrame');
          await assertMedia(frame,'.content-inline-media.image img[alt="Logo de test"]');
          await assertMedia(frame,'.content-inline-media.portrait img[alt="Portrait de test"]');
          await page.click('#tucEditPage');
          await page.waitForSelector('.editor-dialog[open]');
          if(await page.locator('.editor-block[data-type="media"]').count()<2)throw new Error('Les médias ne sont pas revenus dans le brouillon.');
          if(browserErrors.length)throw new Error(`Erreurs navigateur: ${browserErrors.join(' | ')}`);
          await browser.close();
          console.log('Lore Image/Portrait browser smoke: OK');
          NODE
          CHROME_BIN="$CHROME_BIN" node .lore-editor-smoke.mjs
