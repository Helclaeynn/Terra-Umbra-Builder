name: Anti-systeme PNJ lot 04 schema probe
on:
  push:
    branches:
      - feature/tuc-compendium-characters-antisysteme-04
    paths:
      - '.github/workflows/antisysteme-lot04-audit.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe current PNJ schema and lot04 media archive
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const manifest=JSON.parse(fs.readFileSync('compendium/data/manifest-v3.json','utf8'));
          const byId=new Map();
          for(const spec of manifest.datasets){
            let b64='';
            for(let i=0;i<spec.parts;i++) b64+=fs.readFileSync(`compendium/data/${spec.prefix}-${String(i).padStart(2,'0')}.b64part`,'utf8');
            const rows=JSON.parse(zlib.gunzipSync(Buffer.from(b64.replace(/\s+/g,''),'base64')).toString('utf8'));
            for(const row of rows) if(row?.id) byId.set(row.id,row);
          }
          console.log('FINAL_COUNT='+byId.size);
          for(const id of ['pnj-270-meilir-yarwood','pnj-226-alayna-daewynn','pnj-198-arthur-bartram']){
            console.log('=== '+id+' ===');
            console.log(JSON.stringify(byId.get(id),null,2));
          }
          NODE
          cat compendium/data/.lot04-images.part.00 compendium/data/.lot04-images.part.01 compendium/data/.lot04-images.part.02 compendium/data/.lot04-images.part.03 | base64 -d > /tmp/lot04-images.zip
          echo '=== LOT04 ZIP ==='
          unzip -l /tmp/lot04-images.zip
