name: Lore V3 cut-over

on:
  push:
    branches:
      - preview/lore
    paths:
      - '.github/workflows/lore-v3-cutover.yml'

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Extract enriched Lore pages from validated previews
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tuc-cutover-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f .lore-cutover.mjs' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/compendium/lore-unified-preview.html >/dev/null && break
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo 'Chrome/Chromium introuvable.' >&2; exit 1; }
          cat > .lore-cutover.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs/promises';

          const DOCS=[
            {id:'pegre',title:'Pègre de Los Angeles',href:'pegre-preview.html',category:'Organisations',sources:['TUC_organisations_Pegre LA_V2.docx']},
            {id:'agences',title:'Agences gouvernementales',href:'agences-preview.html',category:'Organisations',sources:['TUC_organisations_agences.docx']},
            {id:'gouvernement',title:'Gouvernement',href:'gouvernement-preview.html',category:'Organisations',sources:['TUC_organisations_gouvernement.docx']},
            {id:'vie-quotidienne',title:'Vie quotidienne',href:'vie-quotidienne-preview.html',category:'Réalité',sources:['TUC_organisations_vie quotidienne.docx','TUC_vie quotidienne.docx']},
            {id:'police',title:'Police de Los Angeles',href:'police-preview.html',category:'Organisations',sources:['TUC_organisations_Police LA_v2.docx','TUC_organisations_Police LA_Bonus Prisons.docx']},
            {id:'religions',title:'Religions et néoreligions',href:'religions-preview.html',category:'Organisations',sources:['TUC_organisations_religions.docx','Eglise chrétiennne TUC.pdf']},
            {id:'corporations',title:'Corporations',href:'corporations-preview.html',category:'Organisations',sources:['TUC_organisations_corporations (inachevé).docx']},
            {id:'crawlers',title:'Crawlers',href:'crawlers-preview.html',category:'Organisations',sources:['TUC_organisations_crawlers_V2.docx']},
            {id:'anti-systemes',title:'Crawlers — Anti-systèmes',href:'anti-systemes-preview.html',category:'Organisations',sources:['factions crawlers _ les anti système.pdf']},
            {id:'angelus',title:'Arbre de Vie & Angelus',href:'angelus-preview.html',category:'Organisations',sources:['factions_Arbre de vie et angelus.pdf']},
            {id:'vampire-courts',title:'Cours vampiriques',href:'vampire-courts-preview.html',category:'Organisations',sources:['Factions_Les cours vampiriques.pdf']},
            {id:'pelages',title:'Pelages / Loups-garous',href:'pelages-preview.html',category:'Organisations',sources:['factions_Les Pelages (loups-garous).pdf']},
            {id:'therianthropes',title:'Autres Thérianthropes',href:'therianthropes-preview.html',category:'Vérité',sources:['Les thérianthropes_complément garous.pdf']},
            {id:'mage-lodges',title:'Loges des Mages',href:'mage-lodges-preview.html',category:'Organisations',sources:['factons_Loges des mages.pdf']},
            {id:'daemon-temples',title:'Temples Daemoniaques',href:'daemon-temples-preview.html',category:'Organisations',sources:['factions_Temples Daemoniaques.pdf']},
            {id:'aseryn-temples',title:'Temples Aseryns',href:'aseryn-temples-preview.html',category:'Organisations',sources:['Les temples Aseryns.pdf']},
            {id:'aseryn-continents',title:'Continents Aseryns',href:'aseryn-continents-preview.html',category:'Vérité',sources:['faction_les continents Aseryns.pdf']},
            {id:'supernatural-species',title:'Espèces surnaturelles',href:'supernatural-species-preview.html',category:'Vérité',sources:['TUC_Vérité_ les espèces  surnaturelles.docx']},
            {id:'plagues',title:'Fléaux',href:'plagues-preview.html',category:'Vérité',sources:['TUC_Vérité_ les créatures_focus  sur les Fléaux.docx']},
            {id:'grands-exiles',title:'Grands Exilés',href:'grands-exiles-preview.html',category:'Organisations',sources:['factions_les grands exilés.pdf']},
            {id:'extrals-groups',title:"Groupes d’Extrals",href:'extrals-groups-preview.html',category:'Organisations',sources:["factions_Les groupes d'extrals.pdf"]},
            {id:'humans-galaxy',title:'Humains galactiques',href:'humans-galaxy-preview.html',category:'Vérité',sources:['factions_Les humains galactiques.pdf']},
            {id:'extraterrestrial-species',title:'Espèces extraterrestres',href:'extraterrestrial-species-preview.html',category:'Vérité',sources:['TUC_Vérité_ les espèces  extraterrestres.docx']}
          ];
          const slug=s=>String(s||'section').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'section';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
          const page=await browser.newPage();
          const articles=[];
          for(const doc of DOCS){
            await page.goto(`http://127.0.0.1:8765/compendium/${doc.href}`,{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#nav [data-id],.nav [data-id]',{timeout:15000});
            const items=await page.locator('#nav [data-id],.nav [data-id]').evaluateAll(nodes=>{
              const seen=new Set();return nodes.map(n=>({id:n.dataset.id||'',label:(n.textContent||'').trim()})).filter(x=>x.id&&!seen.has(x.id)&&seen.add(x.id));
            });
            for(const item of items){
              await page.locator(`[data-id="${item.id}"]`).first().click();
              await page.waitForSelector('#content h1,.content h1',{timeout:10000});
              await page.evaluate(async({docId,pageId})=>{
                const mod=await import('./lore-preview-enrichment.js');
                mod.applyLoreEnrichment(document,`${docId}::${pageId}`);
              },{docId:doc.id,pageId:item.id});
              const extracted=await page.locator('#content,.content').first().evaluate((root,meta)=>{
                const text=n=>(n?.textContent||'').replace(/\s+/g,' ').trim();
                const title=text(root.querySelector('h1'))||meta.label||meta.pageId;
                const sections=[];
                const sectionNodes=[...root.querySelectorAll(':scope > .preview-section,:scope > .section')];
                for(const [index,section] of sectionNodes.entries()){
                  const heading=section.querySelector('h2,h3,h4,h5');
                  const sectionTitle=text(heading)||`Section ${index+1}`;
                  const blocks=[];
                  const candidates=[...section.querySelectorAll('.body-p,table,.flag-box,.notice,.canon-box')];
                  for(const node of candidates){
                    if(node.matches('table')){
                      if(node.closest('table')!==node)continue;
                      const rows=[...node.querySelectorAll('tr')].map(tr=>[...tr.querySelectorAll('th,td')].map(text)).filter(r=>r.some(Boolean));
                      if(rows.length)blocks.push({type:'table',rows});
                    }else{
                      if(node.closest('.flag-box,.notice,.canon-box')&&node!==node.closest('.flag-box,.notice,.canon-box'))continue;
                      const value=text(node);if(!value)continue;
                      let style='';
                      if(node.classList.contains('list'))style='list';
                      else if(node.matches('.flag-box,.notice,.canon-box'))style='callout';
                      else if(node.classList.contains('lore'))style='lore';
                      blocks.push({type:'p',text:value,...(style?{style}:{})});
                    }
                  }
                  if(blocks.length)sections.push({id:`section-${index+1}-${sectionTitle}`,title:sectionTitle,level:2,blocks});
                }
                if(!sections.length){
                  const blocks=[...root.querySelectorAll('.body-p')].map(n=>({type:'p',text:text(n)})).filter(b=>b.text);
                  if(blocks.length)sections.push({id:'section-1-contenu',title:'Contenu',level:2,blocks});
                }
                for(const [index,scheme] of [...root.querySelectorAll(':scope > .scheme')].entries()){
                  const schemeTitle=text(scheme.querySelector('h2,h3'))||'Schéma';
                  const blocks=[...scheme.querySelectorAll('.scheme-node')].map(n=>({type:'p',text:text(n),style:'list'})).filter(b=>b.text);
                  if(blocks.length)sections.push({id:`scheme-${index+1}-${schemeTitle}`,title:schemeTitle,level:2,blocks});
                }
                const img=root.querySelector('.preview-visuals img,.article-media img,figure img');
                const figure=img?.closest('figure');
                const image=img?{src:img.getAttribute('src')||'',alt:img.getAttribute('alt')||title,caption:text(figure?.querySelector('figcaption'))}:null;
                return {title,sections,image};
              },{label:item.label,pageId:item.id});
              for(const [index,section] of extracted.sections.entries())section.id=`${slug(section.title)}-${index+1}`;
              articles.push({
                id:`lore-${doc.id}-${item.id}`,
                title:extracted.title,
                category:doc.category,
                status:'source_detaillee',
                audience:'all',
                source:doc.sources.join(' + '),
                tags:[doc.title],
                sections:extracted.sections,
                ...(extracted.image?.src?{image:extracted.image}:{})
              });
            }
            console.log(doc.id,items.length);
          }
          await fs.writeFile('/tmp/new-lore-pages.json',JSON.stringify(articles,null,2));
          console.log('new structured Lore pages:',articles.length);
          await browser.close();
          NODE
          CHROME_BIN="$CHROME_BIN" node .lore-cutover.mjs
      - name: Build integrated Lore V3 dataset and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from collections import Counter
          replacement_sources={
            'TUC_organisations_Pegre LA_V2.docx','TUC_organisations_agences.docx','TUC_organisations_gouvernement.docx',
            'TUC_organisations_vie quotidienne.docx','TUC_vie quotidienne.docx','TUC_organisations_Police LA_v2.docx',
            'TUC_organisations_Police LA_Bonus Prisons.docx','TUC_organisations_religions.docx','Eglise chrétiennne TUC.pdf',
            'TUC_organisations_corporations (inachevé).docx','TUC_organisations_crawlers_V2.docx','factions crawlers _ les anti système.pdf',
            'factions_Arbre de vie et angelus.pdf','Factions_Les cours vampiriques.pdf','factions_Les Pelages (loups-garous).pdf',
            'Les thérianthropes_complément garous.pdf','factons_Loges des mages.pdf','factions_Temples Daemoniaques.pdf',
            'Les temples Aseryns.pdf','faction_les continents Aseryns.pdf','TUC_Vérité_ les espèces  surnaturelles.docx',
            'TUC_Vérité_ les créatures_focus  sur les Fléaux.docx','factions_les grands exilés.pdf',"factions_Les groupes d'extrals.pdf",
            'factions_Les humains galactiques.pdf','TUC_Vérité_ les espèces  extraterrestres.docx'
          }
          path='compendium/data/v3-lore-00.b64part'
          old=json.loads(gzip.decompress(base64.b64decode(''.join(open(path,encoding='utf-8').read().split()))))
          retained=[row for row in old if row.get('source') not in replacement_sources]
          new=json.load(open('/tmp/new-lore-pages.json',encoding='utf-8'))
          assert len(old)==229, len(old)
          assert len(retained)==33, len(retained)
          assert len(new)==364, len(new)
          ids=[x['id'] for x in retained+new]
          assert len(ids)==len(set(ids)), 'duplicate ids'
          combined=retained+new
          combined.sort(key=lambda x:(['Règles','Réalité','Vérité','Organisations','Personnages','Bestiaire'].index(x.get('category')) if x.get('category') in ['Règles','Réalité','Vérité','Organisations','Personnages','Bestiaire'] else 99,x.get('title','').casefold()))
          raw=json.dumps(combined,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          encoded=base64.b64encode(gzip.compress(raw,compresslevel=9,mtime=0)).decode('ascii')
          open(path,'w',encoding='utf-8').write(encoded+'\n')
          manifest_path='compendium/data/manifest-v3.json'
          manifest=json.load(open(manifest_path,encoding='utf-8'))
          lore=next(x for x in manifest['datasets'] if x['id']=='lore')
          lore['count']=len(combined)
          lore['sha256']=hashlib.sha256(raw).hexdigest()
          manifest['expectedTotal']=sum(x['count'] for x in manifest['datasets'])
          manifest['generated']='2026-09-14'
          open(manifest_path,'w',encoding='utf-8').write(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          dist=Counter(x.get('category') for x in combined)
          print('retained:',len(retained),'new:',len(new),'Lore:',len(combined),'expectedTotal:',manifest['expectedTotal'])
          print('Lore categories:',dict(dist))
          assert manifest['expectedTotal']==687
          assert dist==Counter({'Organisations':305,'Vérité':74,'Réalité':18})
          PY
      - name: Validate integrated V3 in the real Compendium
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < compendium/app-v3.js
          python3 - <<'PY'
          import base64,gzip,json,hashlib
          m=json.load(open('compendium/data/manifest-v3.json',encoding='utf-8'))
          spec=next(x for x in m['datasets'] if x['id']=='lore')
          raw=gzip.decompress(base64.b64decode(''.join(open('compendium/data/v3-lore-00.b64part',encoding='utf-8').read().split())))
          rows=json.loads(raw)
          assert len(rows)==397
          assert hashlib.sha256(raw).hexdigest()==spec['sha256']
          assert any(x['id']=='lore-anti-systemes-hell-angels' for x in rows)
          print('dataset OK:',len(rows),'pages')
          PY
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/tuc-v3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f .v3-smoke.mjs' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8766/compendium/ >/dev/null && break
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          cat > .v3-smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
          const page=await browser.newPage();
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:8766/compendium/',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('#main')?.textContent?.includes('687 entrées'),null,{timeout:20000});
          await page.evaluate(()=>{location.hash='#/article/lore-anti-systemes-hell-angels';});
          await page.waitForFunction(()=>document.querySelector('#main h1')?.textContent?.includes('Hell Angels'),null,{timeout:15000});
          const body=(await page.locator('#main').innerText()).toLowerCase();
          if(!body.includes('hell angels')||body.length<500)throw new Error('Article Hell Angels incomplet');
          const nav=await page.locator('#mainNav').innerText();
          if(!nav.includes('305')||!nav.includes('137')||!nav.includes('57'))throw new Error(`Comptes de catégories inattendus: ${nav}`);
          if(errors.length)throw new Error(errors.join('\n'));
          console.log('real V3 Compendium smoke OK');
          await browser.close();
          NODE
          CHROME_BIN="$CHROME_BIN" node .v3-smoke.mjs
      - name: Commit integrated V3 dataset
        shell: bash
        run: |
          git config user.name Helclaeynn
          git config user.email malekith51@hotmail.com
          git add compendium/data/v3-lore-00.b64part compendium/data/manifest-v3.json
          git diff --cached --quiet && { echo 'No cut-over changes'; exit 1; }
          git commit -m 'feat(lore): integrate enriched corpus into Compendium V3'
          git push origin HEAD:preview/lore
