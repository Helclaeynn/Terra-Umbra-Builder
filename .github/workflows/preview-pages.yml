name: Serve preview/lore on Pages

on:
  push:
    branches:
      - preview/lore
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/lore
          path: preview-src

      - name: Assemble stable root and preview subsite
        shell: bash
        run: |
          rm -rf site/preview
          mkdir -p site/preview
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            preview-src/ site/preview/
          touch site/.nojekyll
          touch site/preview/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: preview-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
