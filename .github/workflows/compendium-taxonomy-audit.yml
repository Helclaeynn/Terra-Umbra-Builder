name: Compendium taxonomy audit

on:
  push:
    branches:
      - preview/compendium-restructure
    paths:
      - 'scripts/audit-rules-legacy-scoria-v1.mjs'
      - 'scripts/audit-large-dataset-taxonomy-v1.mjs'
      - 'scripts/audit-organisations-personnages-taxonomy-v1.mjs'
      - '.github/workflows/compendium-taxonomy-audit.yml'
      - 'compendium/data/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/compendium-restructure
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Organisations and Personnages taxonomy
        run: node scripts/audit-organisations-personnages-taxonomy-v1.mjs
      - name: Audit Rules scoria
        run: node scripts/audit-rules-legacy-scoria-v1.mjs
      - name: Audit large dataset taxonomy
        run: node scripts/audit-large-dataset-taxonomy-v1.mjs
