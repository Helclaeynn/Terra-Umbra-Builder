name: Builder catalog audit temp
on:
  push:
    branches: [feature/builder-fixes-sept2026]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Decode and report catalogs
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib'),base='character-builder/rulesets/terra-umbra/reality';
          function payload(name){
            const mp=`${base}/safe/${name}.manifest.json`;
            if(fs.existsSync(mp)){
              const m=JSON.parse(fs.readFileSync(mp,'utf8'));
              return m.chunks.map(f=>fs.readFileSync(`${base}/safe/${f}`,'utf8').replace(/\s+/g,'')).join('');
            }
            return fs.readFileSync(`${base}/${name}.json.gz.b64`,'utf8').replace(/\s+/g,'');
          }
          function load(name){return JSON.parse(zlib.gunzipSync(Buffer.from(payload(name),'base64')).toString('utf8'))}
          for(const name of ['equipment','augmentations']){
            const rows=load(name); console.log(`=== ${name.toUpperCase()} COUNT ${rows.length} ===`);
            for(const x of rows){
              const deep=(o,k)=>{if(!o||typeof o!=='object')return '';for(const [a,v] of Object.entries(o)){if(a.toLowerCase()===k.toLowerCase())return v;if(v&&typeof v==='object'){const r=deep(v,k);if(r!==''&&r!=null)return r}}return ''};
              const price=deep(x,'Prix')||deep(x,'Prix indicatif')||deep(x,'Fourchette indicative')||x.price||'';
              console.log(JSON.stringify({id:x.id,name:x.name,category:x.category||'',price,gen:x.generation??'',charge:x.charge??'',stress:x.stress??'',keys:Object.keys(x)}));
            }
          }
          const talentFiles=['corporatiste','gouvernementale','mafieuse','crawler','religieuse'];
          console.log('=== TALENTS WITH CHOICE ===');
          for(const family of ['origin','sphere'])for(const origin of talentFiles){const p=`character-builder/rulesets/terra-umbra/talents/${family}/${origin}.json`;for(const t of JSON.parse(fs.readFileSync(p,'utf8'))){if(/choisir|choix|au choix/i.test(`${t.effect||''} ${t.description||''}`))console.log(JSON.stringify({family,origin,id:t.id,name:t.name,effect:t.effect||t.description||''}))}}
          NODE
