name: Lore vs main page comparison

on:
  push:
    branches:
      - preview/lore
    paths:
      - '.github/workflows/lore-main-compare.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main
      - name: Decode main Lore V3
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,json,subprocess
          b64=subprocess.check_output(['git','show','origin/main:compendium/data/v3-lore-00.b64part'],text=True)
          rows=json.loads(gzip.decompress(base64.b64decode(''.join(b64.split()))))
          out=[{'id':x.get('id',''),'title':x.get('title',''),'category':x.get('category',''),'source':x.get('source',''),'tags':x.get('tags',[])} for x in rows]
          open('/tmp/main-lore.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print('main lore pages:',len(out))
          PY
      - name: Install browser driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Extract rendered preview page index
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tuc-compare-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f .lore-compare.mjs' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/compendium/lore-unified-preview.html >/dev/null && break
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo 'Chrome/Chromium introuvable.' >&2; exit 1; }
          cat > .lore-compare.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
          const page=await browser.newPage();
          await page.goto('http://127.0.0.1:8765/compendium/lore-unified-preview.html',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('.doc-link[data-id]',{timeout:15000});
          const docs=await page.locator('.doc-link[data-id]').evaluateAll(nodes=>nodes.map(n=>({id:n.dataset.id,title:n.querySelector('.doc-name')?.textContent?.trim()||n.textContent.trim()})));
          const rows=[];
          for(const doc of docs){
            await page.evaluate(id=>{location.hash=`#/${encodeURIComponent(id)}`;},doc.id);
            await page.waitForFunction(id=>document.querySelector('#previewFrame')?.getAttribute('src')?.includes(`${id}-preview.html`),doc.id,{timeout:15000});
            const frame=page.frameLocator('#previewFrame');
            await frame.locator('#nav,.nav').first().waitFor({state:'attached',timeout:15000});
            const items=await frame.locator('#nav [data-id],.nav [data-id]').evaluateAll(nodes=>nodes.map(n=>({id:n.dataset.id||'',href:n.getAttribute('href')||'',label:n.textContent.trim()})).filter(x=>x.id));
            for(const item of items){
              await frame.locator(`[data-id="${CSS.escape(item.id)}"]`).first().click();
              await frame.locator('h1').first().waitFor({state:'attached',timeout:10000});
              await frame.locator(`[data-id="${CSS.escape(item.id)}"]`).first().waitFor({state:'attached',timeout:10000});
              const data=await frame.locator('#content,.content').first().evaluate((root,pageId)=>{
                const h1=root.querySelector('h1');
                const title=h1?.textContent?.trim()||'';
                const summary=root.querySelector('.page-head p,.preview-hero p')?.textContent?.trim()||'';
                const headings=[...root.querySelectorAll('.preview-section h2,.section h2,.section h3')].map(n=>n.textContent.trim()).filter(Boolean);
                const body=[...root.querySelectorAll('.body-p')].map(n=>n.textContent.trim()).filter(Boolean).join(' ');
                return {pageId,title,summary,headings,bodyChars:body.length};
              },item.id);
              rows.push({docId:doc.id,docTitle:doc.title,...data});
            }
          }
          await fs.writeFile('/tmp/preview-pages.json',JSON.stringify(rows,null,2));
          console.log('preview pages:',rows.length);
          await browser.close();
          NODE
          CHROME_BIN="$CHROME_BIN" node .lore-compare.mjs
      - name: Compare page identities
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,unicodedata,difflib,collections
          main=json.load(open('/tmp/main-lore.json',encoding='utf-8'))
          preview=json.load(open('/tmp/preview-pages.json',encoding='utf-8'))
          def norm(s):
              s=unicodedata.normalize('NFD',str(s or ''))
              s=''.join(c for c in s if unicodedata.category(c)!='Mn').lower()
              s=re.sub(r"\b(preview|tuc|terra umbra|california|californie)\b",' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return ' '.join(s.split())
          def score(a,b):
              na,nb=norm(a),norm(b)
              if not na or not nb:return 0.0
              if na==nb:return 1.0
              ta,tb=set(na.split()),set(nb.split())
              jac=len(ta&tb)/max(1,len(ta|tb))
              seq=difflib.SequenceMatcher(None,na,nb).ratio()
              contain=0.92 if min(len(na),len(nb))>=6 and (na in nb or nb in na) else 0
              return max(seq, jac*0.95, contain)
          results=[]
          for p in preview:
              ranked=sorted(((score(p['title'],m['title']),m) for m in main),key=lambda x:x[0],reverse=True)
              bests,bm=ranked[0]
              if bests>=.995:kind='exact'
              elif bests>=.82:kind='probable_overlap'
              elif bests>=.68:kind='review'
              else:kind='new'
              results.append({**p,'matchKind':kind,'matchScore':round(bests,3),'mainId':bm['id'],'mainTitle':bm['title'],'mainCategory':bm['category']})
          counts=collections.Counter(r['matchKind'] for r in results)
          bydoc={}
          for r in results:
              d=bydoc.setdefault(r['docId'],collections.Counter());d[r['matchKind']]+=1
          report={'mainCount':len(main),'previewCount':len(preview),'counts':dict(counts),'byDocument':{k:dict(v) for k,v in bydoc.items()},'rows':results}
          open('/tmp/lore-main-comparison.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          with open('/tmp/lore-main-comparison.md','w',encoding='utf-8') as f:
              f.write('# Preview Lore vs main Compendium V3\n\n')
              f.write(f"Main Lore: {len(main)} pages · Preview: {len(preview)} pages\n\n")
              f.write('## Classification\n\n')
              for k in ['exact','probable_overlap','review','new']:f.write(f'- {k}: {counts.get(k,0)}\n')
              f.write('\n## Par document\n\n| Document | Exact | Overlap | Review | New |\n|---|---:|---:|---:|---:|\n')
              for doc in sorted(bydoc):
                  c=bydoc[doc];f.write(f"| {doc} | {c.get('exact',0)} | {c.get('probable_overlap',0)} | {c.get('review',0)} | {c.get('new',0)} |\n")
              f.write('\n## Correspondances à revoir\n\n')
              for r in results:
                  if r['matchKind'] in ('probable_overlap','review'):
                      f.write(f"- **{r['docTitle']} / {r['title']}** → {r['mainTitle']} (`{r['mainId']}`), score {r['matchScore']}\n")
          print('classification:',dict(counts))
          print('by document:')
          for k,v in sorted(bydoc.items()):print(k,dict(v))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lore-main-comparison
          path: |
            /tmp/lore-main-comparison.json
            /tmp/lore-main-comparison.md
            /tmp/main-lore.json
            /tmp/preview-pages.json
          retention-days: 3
