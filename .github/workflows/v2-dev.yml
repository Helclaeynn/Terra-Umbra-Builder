          PY

          SECRET_TERM="CI-MJ-SECRET-$COMPENDIUM_NEW_ID"
          curl --fail --silent --show-error             --get             --data-urlencode "q=$SECRET_TERM"             --data-urlencode "limit=10"             https://dev.terra-umbra.fr/api/compendium/search > "$COMPENDIUM_NEW"
          python3 - "$COMPENDIUM_NEW" <<'PY'
