name: TUC Web V2 dev

on:
  push:
    branches:
      - feature/tuc-web-v2
    paths:
      - "apps/**"
      - "infrastructure/**"
      - "compendium/source/current-equipment-catalog-v1.json"
      - "compendium/source/reality-lore-v3-*.json"
      - "compendium/source/verite-catalog-v6.json.gz.b64"
      - "compendium/source/truth-mechanics-v6-fixed.manifest.json"
      - "compendium/source/truth-mechanics-v6-fixed.part*.b64"
      - "compendium/data/**"
      - "compendium/images/**"
      - "compendium/assets/**"
      - "character-builder/rulesets/terra-umbra/reality/**"
      - ".github/workflows/v2-dev.yml"
  workflow_dispatch:

concurrency:
  group: tuc-v2-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build API
        working-directory: apps/api
        run: |
          npm install
          npm run build

      - name: Check Truth V7 editorial readability
        working-directory: apps/api
        run: node scripts/check-truth-v7-readability.mjs

      - name: Check Truth Builder integration
        working-directory: apps/api
        run: node scripts/check-truth-v7-builder-integration.mjs

      - name: Check Truth species integration
        working-directory: apps/api
        run: node scripts/check-truth-species-integration.mjs

      - name: Check Truth hunters PNJ integration
        working-directory: apps/api
        run: node scripts/check-truth-hunters-pnj-integration.mjs

      - name: Check Truth Aseryn territories and temples integration
        working-directory: apps/api
        run: node scripts/check-truth-aseryn-terres-temples.mjs

      - name: Check Truth Temples démoniaques integration
        working-directory: apps/api
        run: node scripts/check-truth-temples-daemoniaques.mjs

      - name: Check Truth Ten integration
        working-directory: apps/api
        run: node scripts/check-truth-ten-integration.mjs

      - name: Check Points de rencontre integration
        working-directory: apps/api
        run: node scripts/check-points-rencontre-integration.mjs

      - name: Check Truth Grands Exilés integration
        working-directory: apps/api
        run: node scripts/check-truth-grands-exiles.mjs

      - name: Check Truth fantastic species integration
        working-directory: apps/api
        run: node scripts/check-truth-fantastiques-integration.mjs

      - name: Check Truth extraterrestrial integration
        working-directory: apps/api
        run: node scripts/check-truth-extraterrestrials-integration.mjs

      - name: Build web
        working-directory: apps/web
        run: |
          npm install
          npm run build

      - name: Install V2 browser smoke driver
        working-directory: apps/web
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Builder V2 browser smoke
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/tuc-v2-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/tuc-v2-preview.log >&2 || true
              exit 1
            fi
            sleep 1
          done

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'Chrome/Chromium introuvable sur le runner.' >&2
            exit 1
          fi

          TUC_V2_SMOKE_BASE_URL='http://127.0.0.1:4173' CHROME_BIN="$CHROME_BIN" node tests/builder-v2-smoke.mjs

      - name: Validate Compose
        working-directory: infrastructure
        env:
          POSTGRES_DB: tuc
          POSTGRES_USER: tuc
          POSTGRES_PASSWORD: ci-only-placeholder
        run: docker compose config --quiet

  deploy-dev:
    needs: check
    runs-on: ubuntu-latest
    environment: tuc-dev
    env:
      TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
      TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
      TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}

    steps:
      - name: Check deployment configuration
        id: deployment
        shell: bash
        run: |
          if [[ -n "$TUC_DEV_HOST" && -n "$TUC_DEV_USER" && -n "$TUC_DEV_SSH_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are not configured yet; skipping VPS deployment."
          fi

      - name: Checkout
        if: steps.deployment.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node for live browser smoke
        if: steps.deployment.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install live browser smoke driver
        if: steps.deployment.outputs.enabled == 'true'
        working-directory: apps/web
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Configure SSH
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_dev
          chmod 600 ~/.ssh/tuc_dev
          ssh-keyscan -H "$TUC_DEV_HOST" >> ~/.ssh/known_hosts

      - name: Upload V2
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          SSH="ssh -i ~/.ssh/tuc_dev -o IdentitiesOnly=yes"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "mkdir -p /opt/terra-umbra/apps /opt/terra-umbra/infrastructure /opt/terra-umbra/compendium/source /opt/terra-umbra/compendium/data /opt/terra-umbra/compendium/images /opt/terra-umbra/compendium/assets /opt/terra-umbra/character-builder/rulesets/terra-umbra/reality /opt/terra-umbra/character-builder/rulesets/terra-umbra/truth"
          rsync -az --delete -e "$SSH" apps/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/apps/"
          rsync -az --delete --exclude='.env' -e "$SSH" infrastructure/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/infrastructure/"
          rsync -az -e "$SSH" compendium/source/current-equipment-catalog-v1.json compendium/source/reality-lore-v3-*.json "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/compendium/source/"
          rsync -az -e "$SSH" compendium/source/verite-catalog-v6.json.gz.b64 compendium/source/truth-mechanics-v6-fixed.manifest.json compendium/source/truth-mechanics-v6-fixed.part*.b64 compendium/source/truth-lore-hunters-2026-09-v1-*.b64part "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/compendium/source/"
          rsync -az --delete -e "$SSH" compendium/data/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/compendium/data/"
          rsync -az --delete -e "$SSH" compendium/images/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/compendium/images/"
          rsync -az --delete -e "$SSH" compendium/assets/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/compendium/assets/"
          rsync -az --delete -e "$SSH" character-builder/rulesets/terra-umbra/reality/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/character-builder/rulesets/terra-umbra/reality/"
          rsync -az --delete -e "$SSH" character-builder/rulesets/terra-umbra/truth/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/character-builder/rulesets/terra-umbra/truth/"

      - name: Migrate and deploy containers
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          ssh -i ~/.ssh/tuc_dev -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" <<'REMOTE'
            set -euo pipefail
            cd /opt/terra-umbra/infrastructure
            test -f .env

            set -a
            . ./.env
            set +a

            docker compose --env-file .env up -d db

            for attempt in $(seq 1 20); do
              if docker compose --env-file .env exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" </dev/null >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "PostgreSQL did not become ready." >&2
                exit 1
              fi
              sleep 2
            done

            for migration in migrations/*.sql; do
              echo "Applying $migration"
              docker compose --env-file .env exec -T db                 psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" < "$migration"
            done

            export COMPOSE_PARALLEL_LIMIT=1
            docker compose --env-file .env build api
            docker compose --env-file .env build web

            # Avoid running a second Node process beside the live API on this small host.
            # Whatever happens to verify-mail, the API MUST be started again before this step exits.
            VERIFY_MAIL_STATUS=0
            docker compose --env-file .env stop api || true
            docker compose --env-file .env run --rm --no-deps api node dist/verify-mail.js </dev/null || VERIFY_MAIL_STATUS=$?

            docker compose --env-file .env up -d --remove-orphans
            docker compose ps

            for attempt in $(seq 1 20); do
              if docker compose --env-file .env exec -T api node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" </dev/null >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "API did not become ready." >&2
                docker compose --env-file .env logs --tail=200 api >&2 || true
                exit 1
              fi
              sleep 2
            done

            if [ "$VERIFY_MAIL_STATUS" -ne 0 ]; then
              echo "Mail verification failed, but the API has been restored." >&2
              exit "$VERIFY_MAIL_STATUS"
            fi
          REMOTE

      - name: Purge stale CI accounts
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          ssh -i ~/.ssh/tuc_dev -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" <<'REMOTE'
            set -euo pipefail
            cd /opt/terra-umbra/infrastructure
            set -a
            . ./.env
            set +a
            AUDIT_DELETED="$(docker compose --env-file .env exec -T db \
              psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "WITH deleted AS (
                    DELETE FROM admin_audit_log
                    WHERE target_user_id IN (SELECT id FROM users WHERE email LIKE 'ci-%@example.invalid')
                       OR COALESCE(before_state->>'email','') LIKE 'ci-%@example.invalid'
                       OR (
                         action = 'account_update'
                         AND target_user_id IS NULL
                         AND COALESCE(before_state->>'email','') = ''
                         AND COALESCE(before_state->>'displayName','') = ''
                       )
                    RETURNING 1
                  ) SELECT count(*) FROM deleted;")"
            DELETED="$(docker compose --env-file .env exec -T db \
              psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "WITH deleted AS (DELETE FROM users WHERE email LIKE 'ci-%@example.invalid' RETURNING 1) SELECT count(*) FROM deleted;")"
            echo "CI CLEANUP — $AUDIT_DELETED trace(s) audit + $DELETED compte(s) de test supprimé(s)"
          REMOTE

      - name: Smoke test
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 https://dev.terra-umbra.fr/api/health; then
              echo
              curl --fail --silent --show-error --max-time 10 https://dev.terra-umbra.fr/api/auth/setup-status
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Character and Compendium V2 smoke test
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TEST_ID="$(date +%s)-$"
          TEST_EMAIL="ci-character-$TEST_ID@example.invalid"
          TEST_PASSWORD="Tuc-CI-$TEST_ID!Aa9"
          COOKIE_JAR="$(mktemp)"
          IMPORT_BODY="$(mktemp)"
          IMPORT_RESPONSE="$(mktemp)"
          CURRENT_RESPONSE="$(mktemp)"
          PATCH_BODY="$(mktemp)"
          PATCH_RESPONSE="$(mktemp)"
          RULES_RESPONSE="$(mktemp)"
          TRUTH_RESPONSE="$(mktemp)"
          REALITY_RESPONSE="$(mktemp)"
          COMPENDIUM_META="$(mktemp)"
          COMPENDIUM_SEARCH="$(mktemp)"
          COMPENDIUM_MANUFACTURER="$(mktemp)"
          COMPENDIUM_ARTICLE="$(mktemp)"
          COMPENDIUM_WIKI="$(mktemp)"
          COMPENDIUM_EDITOR="$(mktemp)"
          COMPENDIUM_ME="$(mktemp)"
          COMPENDIUM_LIBRARY="$(mktemp)"
          COMPENDIUM_COLLECTION="$(mktemp)"
          COMPENDIUM_NEW="$(mktemp)"
          COMPENDIUM_NEW_DRAFT="$(mktemp)"
          COMPENDIUM_NEW_ID=""

          cleanup() {
            rm -f "$COOKIE_JAR" "$IMPORT_BODY" "$IMPORT_RESPONSE" "$CURRENT_RESPONSE" "$PATCH_BODY" "$PATCH_RESPONSE" "$RULES_RESPONSE" "$TRUTH_RESPONSE" "$REALITY_RESPONSE" "$COMPENDIUM_META" "$COMPENDIUM_SEARCH" "$COMPENDIUM_MANUFACTURER" "$COMPENDIUM_ARTICLE" "$COMPENDIUM_WIKI" "$COMPENDIUM_EDITOR" "$COMPENDIUM_ME" "$COMPENDIUM_LIBRARY" "$COMPENDIUM_COLLECTION" "$COMPENDIUM_NEW" "$COMPENDIUM_NEW_DRAFT"
            if [ -n "$COMPENDIUM_NEW_ID" ]; then
              ssh -i ~/.ssh/tuc_dev -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" \
                "cd /opt/terra-umbra/infrastructure && set -a && . ./.env && set +a && docker compose --env-file .env exec -T db psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"DELETE FROM compendium_article_edit_revisions WHERE article_id = '$COMPENDIUM_NEW_ID'; DELETE FROM compendium_article_edits WHERE article_id = '$COMPENDIUM_NEW_ID'; DELETE FROM compendium_custom_articles WHERE article_id = '$COMPENDIUM_NEW_ID';\"" \
                </dev/null >/dev/null 2>&1 || true
            fi
            ssh -i ~/.ssh/tuc_dev -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST"               "cd /opt/terra-umbra/infrastructure && set -a && . ./.env && set +a && docker compose --env-file .env exec -T db psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"DELETE FROM users WHERE email = '$TEST_EMAIL';\""               </dev/null >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          REGISTER_PAYLOAD="$(printf '{"displayName":"CI Character","email":"%s","password":"%s","passwordConfirmation":"%s"}' "$TEST_EMAIL" "$TEST_PASSWORD" "$TEST_PASSWORD")"
          curl --fail --silent --show-error             -c "$COOKIE_JAR"             -H 'Content-Type: application/json'             -d "$REGISTER_PAYLOAD"             https://dev.terra-umbra.fr/api/auth/register >/dev/null

          curl --fail --silent --show-error             -b "$COOKIE_JAR"             https://dev.terra-umbra.fr/api/rulesets/terra-umbra/creation > "$RULES_RESPONSE"

          python3 - "$RULES_RESPONSE" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8"))
          rules=payload["rules"]
          lore=payload["lore"]
          choices=payload["talentChoiceSpecs"]
          assert len(rules["talents"]["origin"]) == 5, rules["talents"]["origin"].keys()
          assert sum(len(v) for v in rules["talents"]["origin"].values()) == 25
          assert sum(len(v) for v in rules["talents"]["sphere"].values()) == 60
          assert len(rules["talents"]["common"]) == 12
          assert len(rules["talents"]["expertise"]) == 25
          assert {item.get("compendiumId") for item in rules["talents"]["common"]} == {"regles-realite-talents-communs"}
          expertise_hubs={
              "vigueur":"regles-realite-talents-expertise-vigueur",
              "agilite":"regles-realite-talents-expertise-agilite",
              "esprit":"regles-realite-talents-expertise-esprit",
              "volonte":"regles-realite-talents-expertise-volonte",
              "charisme":"regles-realite-talents-expertise-charisme",
          }
          for attribute,hub in expertise_hubs.items():
              assert all(
                  item.get("compendiumId") == hub
                  for item in rules["talents"]["expertise"]
                  if item.get("attribute") == attribute
              ), (attribute,hub)
          assert len(lore["origin"]) == 5
          assert len(lore["style"]) == 25
          assert len(lore["skill"]) == 25
          assert len(lore["sphereTalent"]) == 60
          assert lore["origin"]["corporatiste"]
          assert lore["style"]["cybercorpo"]
          assert lore["skill"]["neurodive"]
          assert lore["sphereTalent"]["dotation_standard"]
          calibrated=choices["formation_calibree"]
          assert calibrated["kind"] == "skill"
          assert calibrated["skillAttribute"] == "esprit"
          assert calibrated["bonus"] == 1
          assert calibrated["permanent"] is True
          assert "requin_corporatif" in choices
          assert "sens_accru_x" in choices
          assert payload["skillTalentMap"]["tireur_de_precision"] == "tir"
          assert payload["skillTalentMap"]["discipline_de_foi"] == "maitrise_spirituelle"
          assert payload["disadvantageLore"]["sensible_a_la_chaleur"]
          assert payload["disadvantageLore"]["corporatiste:contrat_leonin"]
          assert len(payload["disadvantages"]["common"]) == 15
          assert len(payload["disadvantages"]["attribute"]) == 15
          assert len(payload["disadvantages"]["sphere"]["crawler"]) == 5
          assert {item.get("compendiumId") for item in payload["disadvantages"]["common"]} == {"regles-realite-desavantages-communs"}
          assert {item.get("compendiumId") for item in payload["disadvantages"]["attribute"]} == {"regles-realite-desavantages-attributs"}
          assert payload["edgeRules"]["base"] == 5
          assert payload["edgeRules"]["options"]["attributePack"]["points"] == 2
          assert payload["edgeRules"]["options"]["skillPacks"]["points"] == 4
          assert payload["edgeRules"]["lore"]["talentPacks"]["lore"]
          PY

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            https://dev.terra-umbra.fr/api/rulesets/terra-umbra/truth > "$TRUTH_RESPONSE"

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            https://dev.terra-umbra.fr/api/rulesets/terra-umbra/reality > "$REALITY_RESPONSE"

          python3 - "$TRUTH_RESPONSE" "$REALITY_RESPONSE" <<'PY'
          import json,sys
          truth=json.load(open(sys.argv[1],encoding="utf-8"))
          reality=json.load(open(sys.argv[2],encoding="utf-8"))

          stages=truth["revelation"]["stages"]
          assert stages["v"]["name"] == "Voilé", stages
          assert stages["sr"]["name"] == "Semi-Révélé", stages
          assert stages["r"]["name"] == "Révélé", stages
          assert truth["revelation"]["rules"]["revealedReplacesSemiRevealed"] is True
          assert truth["revelation"]["rules"]["vigorPvMultiplier"] == 2
          assert truth["revelation"]["angelusStats"], "Profils Angelus absents"
          assert truth["revelation"]["daemonStats"], "Profils Daemon absents"
          assert truth["structure"]["natures"]["vampire"]["compendiumId"] == "verite-v7-vampires-civilisation-cours-sangs"
          truth_talents=[
              talent
              for talents in truth["catalogs"].values()
              for talent in talents
          ]
          # Vérité V7 no longer requires one legacy compendiumId per Talent.
          # Canonical links are resolved at group level against the merged editorial pages;
          # the dedicated talent-hub audit below guarantees complete, unambiguous coverage.
          assert len(truth_talents) > 1000, len(truth_talents)
          vampire_common=[
              talent for talent in truth["catalogs"]["vampire"]
              if talent.get("group") == "Vampire — commun"
          ]
          assert vampire_common
          lavandieres=[
              talent for talent in truth["catalogs"]["humain"]
              if str(talent.get("group","")).startswith("Lavandières — tradition vampirique de Chasse")
          ]
          assert lavandieres
          khinae=truth["catalogs"]["khinae"]
          assert khinae, "Catalogue Khinae vide"
          assert {
              talent.get("compendiumId")
              for talent in khinae
          } == {"regles-verite-v7-khinae-moteur-lignees"}, {
              talent.get("compendiumId")
              for talent in khinae
          }

          counts=reality["counts"]
          assert counts["equipment"] >= 261, counts
          assert counts["augmentations"] > 0, counts
          assert counts["recurring"] > 0, counts
          assert reality["source"]["mergedLoreFiles"] > 0, reality["source"]
          names={item["name"] for item in reality["equipment"]}
          assert "Pass metro/tram" in names, "Pass metro/tram absent"
          assert "Bull Basic" in names, "Bull Basic absent"
          assert any(item["lore"] for item in reality["equipment"]), "Lore équipement absent"
          reality_refs=[item.get("compendiumId") for item in reality["equipment"] if item.get("compendiumId")]
          assert reality_refs, "Aucun équipement relié canoniquement au Compendium"
          PY

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            https://dev.terra-umbra.fr/api/compendium/meta > "$COMPENDIUM_META"

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            'https://dev.terra-umbra.fr/api/compendium/search?q=Afanc&limit=10' > "$COMPENDIUM_SEARCH"

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            'https://dev.terra-umbra.fr/api/compendium/search?category=%C3%89quipement%20%26%20Objets&manufacturer=Raven&limit=100' > "$COMPENDIUM_MANUFACTURER"

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            https://dev.terra-umbra.fr/api/compendium/articles/bestiaire-v15-afanc > "$COMPENDIUM_ARTICLE"

          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            https://dev.terra-umbra.fr/api/compendium/wiki-index > "$COMPENDIUM_WIKI"

          python3 - "$COMPENDIUM_META" "$COMPENDIUM_SEARCH" "$COMPENDIUM_MANUFACTURER" "$COMPENDIUM_ARTICLE" "$COMPENDIUM_WIKI" <<'PY'
          import json,sys
          meta=json.load(open(sys.argv[1],encoding="utf-8"))
          search=json.load(open(sys.argv[2],encoding="utf-8"))
          manufacturer=json.load(open(sys.argv[3],encoding="utf-8"))
          article=json.load(open(sys.argv[4],encoding="utf-8"))["article"]
          wiki=json.load(open(sys.argv[5],encoding="utf-8"))["entries"]

          assert meta["total"] >= 500, meta
          assert meta.get("archivedTotal",0) >= 900, meta
          assert any(item["name"] == "Bestiaire" for item in meta["categories"]), meta["categories"]
          assert all(item["name"] != "OLD" for item in meta["categories"]), meta["categories"]
          assert meta["overrides"]["applied"] > 0, meta["overrides"]
          assert any(item["id"] == "bestiaire-v15-afanc" for item in search["items"]), search
          assert manufacturer["total"] >= 20, manufacturer
          assert all(item["manufacturer"] == "Raven" for item in manufacturer["items"]), manufacturer["items"][:5]
          assert any(item["id"] == "equipement-036-raven-ar-027-rampager" for item in manufacturer["items"]), manufacturer
          assert article["id"] == "bestiaire-v15-afanc", article["id"]
          assert article.get("__editorialOverride") is True, article
          media=article.get("illustration") or article.get("image")
          assert media, article
          media_src=media if isinstance(media,str) else media.get("src","")
          assert media_src.startswith(("images/","assets/")), media_src
          paragraphs=[
              block.get("text","")
              for section in article.get("sections",[])
