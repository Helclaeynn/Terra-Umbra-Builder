name: TUC Web V2 dev

on:
  push:
    branches:
      - main
      - feature/tuc-web-v2
    paths:
      - "apps/**"
      - "infrastructure/**"
      - "compendium/source/current-equipment-catalog-v1.json"
      - "compendium/source/equipment-illustrations-20260923.json"
      - "compendium/source/portrait-only-lot2-v1.json"
      - "compendium/source/portrait-refresh-20260926.json"
      - "compendium/source/portrait-refresh-chasseurs-20260926.json"
      - "compendium/source/portrait-legacy-mirrors-v1.json"
      - "compendium/source/wiki-taxonomy-arbitrage-v1.json.gz"
      - "compendium/source/reality-lore-v3-*.json"
      - "compendium/source/verite-catalog-v6.json.gz.b64"
      - "compendium/source/truth-mechanics-v6-fixed.manifest.json"
      - "compendium/source/truth-mechanics-v6-fixed.part*.b64"
      - "compendium/data/**"
      - "compendium/images/**"
      - "compendium/assets/**"
      - "character-builder/rulesets/terra-umbra/reality/**"
      - ".github/workflows/v2-dev.yml"
  workflow_dispatch:

concurrency:
  group: tuc-v2-dev
  # Finish deployment and live checks before starting the latest pending revision.
  cancel-in-progress: false

permissions:
  contents: read

# Contrôles seulement. Les mises en ligne passent par deploy.yml et deploy-recette.yml
# (boutons manuels) ; l'ancien job deploy-dev a été retiré le 01/11 (voir l'historique Git).
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Miroir Google de l'image officielle : Docker Hub et le miroir Amazon
        # (public.ecr.aws, « Data limit exceeded » le 01/11) limitent les
        # téléchargements anonymes depuis les machines partagées de GitHub.
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: tuc
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: tuc_sheet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tuc -d tuc_sheet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare complete rule data for model regression tests
        run: |
          mkdir -p .v2-rules-data/lore
          cp compendium/source/current-equipment-catalog-v1.json .v2-rules-data/
          cp compendium/source/reality-lore-v3-*.json .v2-rules-data/lore/
          cp character-builder/rulesets/terra-umbra/reality/augmentations.json.gz.b64 .v2-rules-data/
          cp character-builder/rulesets/terra-umbra/reality/safe/neuroprograms.part01.b64 character-builder/rulesets/terra-umbra/reality/safe/vehicles.part01.b64 .v2-rules-data/

      - name: Build API
        working-directory: apps/api
        run: |
          npm ci
          npm run build

      - name: Check API container manifests
        working-directory: apps/api
        run: node scripts/check-api-container-assets.mjs

      - name: Check creation budgets enforced by the server
        working-directory: apps/api
        run: node scripts/check-creation-budget.mjs

      - name: Check live power registry
        working-directory: apps/api
        run: node scripts/check-live-power-registry.mjs

      - name: Check published PNJ biography corpus reload
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://audit:audit@127.0.0.1:1/audit
        run: |
          node scripts/check-published-pnj-biography.mjs
          node scripts/check-approved-pnj-merges.mjs

      - name: Check reviewed Compendium links and privacy
        working-directory: apps/api
        run: node scripts/check-reviewed-rule-taxonomy.mjs

      - name: Check rule diagrams
        working-directory: apps/api
        run: node scripts/check-rule-diagrams.mjs

      - name: Check bestiary illustrations
        working-directory: apps/api
        run: node scripts/check-bestiary-illustrations.mjs

      - name: Check bestiary art direction and media
        working-directory: apps/api
        run: node scripts/check-bestiary-art-direction.mjs

      - name: Check equipment illustrations
        working-directory: apps/api
        run: node scripts/check-equipment-illustrations.mjs

      - name: Check complete weapon catalogue and Builder coverage
        working-directory: apps/api
        run: node scripts/check-weapon-catalog-coverage.mjs

      - name: Check second portrait lot
        working-directory: apps/api
        run: node scripts/check-portrait-lot2.mjs

      - name: Check hunter portrait refresh
        working-directory: apps/api
        run: |
          node scripts/check-portrait-refresh-chasseurs-20260926.mjs
          PORTRAIT_TEST_VISIBILITY=mj node scripts/check-portrait-refresh-chasseurs-20260926.mjs
          PORTRAIT_TEST_VISIBILITY=public node scripts/check-portrait-refresh-chasseurs-20260926.mjs

      - name: Check portrait visibility overrides
        working-directory: apps/api
        run: |
          node scripts/check-portrait-visibility.mjs
          node scripts/check-portrait-admin-all.mjs

      - name: Check corporation logos on equipment pages
        working-directory: apps/api
        run: node scripts/check-corporation-branding.mjs

      - name: Check augmentation illustrations
        working-directory: apps/api
        run: node scripts/check-augmentation-illustrations.mjs

      - name: Check truth catalog illustrations
        working-directory: apps/api
        run: node scripts/check-truth-catalog-illustrations.mjs

      - name: Check standalone character sheet permissions on PostgreSQL
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://tuc:ci-only-placeholder@127.0.0.1:5432/tuc_sheet_test
          TUC_SHEET_SMOKE: ci
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          import {pool} from './dist/db.js';
          for(const name of (await readdir('../../infrastructure/migrations')).filter(n=>n.endsWith('.sql')).sort()) {
            await pool.query(await readFile('../../infrastructure/migrations/'+name,'utf8'));
          }
          await pool.end();
          NODE
          node scripts/check-character-sheet-access.mjs
          node scripts/check-character-play.mjs
          node scripts/check-campaign-calendar-format.mjs
          node scripts/check-campaign-calendar-delivery.mjs
          node scripts/check-campaign-workspace.mjs
          node scripts/check-campaign-source-revision.mjs
          node scripts/check-npc-generator.mjs
          node scripts/check-campaign-bestiary.mjs
          node scripts/check-campaign-npcs.mjs
          node scripts/check-npc-proposals.mjs
          node scripts/check-live-events.mjs
          node scripts/check-campaign-bestiary-db.mjs

      - name: Check password hashing and account migration
        working-directory: apps/api
        run: |
          node scripts/check-password-hashing.mjs
          node scripts/check-auth-password-routes.mjs
          node scripts/check-auth-response-lifecycle.mjs
          node scripts/check-gm-access.mjs

      - name: Check retired Compendium archives
        working-directory: apps/api
        run: node scripts/check-compendium-retirement.mjs

      - name: Check Truth V7 editorial readability
        working-directory: apps/api
        run: node scripts/check-truth-v7-readability.mjs

      - name: Check Truth Builder integration
        working-directory: apps/api
        run: node scripts/check-truth-v7-builder-integration.mjs

      - name: Check Corruption prerequisites
        working-directory: apps/api
        run: node scripts/check-corruption-prerequisites.mjs

      - name: Check Truth species integration
        working-directory: apps/api
        run: node scripts/check-truth-species-integration.mjs

      - name: Check Truth hunters PNJ integration
        working-directory: apps/api
        run: node scripts/check-truth-hunters-pnj-integration.mjs

      - name: Check Truth Aseryn territories and temples integration
        working-directory: apps/api
        run: node scripts/check-truth-aseryn-terres-temples.mjs

      - name: Check Truth Temples démoniaques integration
        working-directory: apps/api
        run: node scripts/check-truth-temples-daemoniaques.mjs

      - name: Check Truth Ten integration
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://tuc:ci-only-placeholder@127.0.0.1:5432/tuc_sheet_test
        run: |
          node scripts/check-truth-ten-integration.mjs
          node scripts/check-pnj-truth-profiles.mjs

      - name: Check Points de rencontre integration
        working-directory: apps/api
        run: node scripts/check-points-rencontre-integration.mjs

      - name: Check Shi and Qi integration
        working-directory: apps/api
        run: node scripts/check-shi-qi-integration.mjs

      - name: Check Truth Grands Exilés integration
        working-directory: apps/api
        run: node scripts/check-truth-grands-exiles.mjs

      - name: Check Truth fantastic species integration
        working-directory: apps/api
        run: node scripts/check-truth-fantastiques-integration.mjs

      - name: Check Truth extraterrestrial integration
        working-directory: apps/api
        run: node scripts/check-truth-extraterrestrials-integration.mjs

      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Check V2 UI behavior
        working-directory: apps/web
        run: npm run test:ui

      - name: Check fillable character dossiers and export actions
        working-directory: apps/web
        run: |
          npm run test:pdf
          node tests/homo-superior-phasing-check.mjs

      - name: Install V2 browser smoke driver
        working-directory: apps/web
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Builder V2 browser smoke
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/tuc-v2-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/tuc-v2-preview.log >&2 || true
              exit 1
            fi
            sleep 1
          done

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'Chrome/Chromium introuvable sur le runner.' >&2
            exit 1
          fi

          TUC_V2_SMOKE_BASE_URL='http://127.0.0.1:4173' CHROME_BIN="$CHROME_BIN" node tests/campaign-npcs-smoke.mjs
          TUC_V2_SMOKE_BASE_URL='http://127.0.0.1:4173' CHROME_BIN="$CHROME_BIN" node tests/builder-v2-smoke.mjs
          TUC_V2_SMOKE_BASE_URL='http://127.0.0.1:4173' CHROME_BIN="$CHROME_BIN" node tests/orbital-ui-smoke.mjs
          TUC_V2_SMOKE_BASE_URL='http://127.0.0.1:4173' CHROME_BIN="$CHROME_BIN" node tests/campaigns-smoke.mjs
          TUC_V2_SMOKE_BASE_URL='http://127.0.0.1:4173' CHROME_BIN="$CHROME_BIN" node tests/campaign-live-browser.mjs
          TUC_V2_SMOKE_BASE_URL='http://127.0.0.1:4173' CHROME_BIN="$CHROME_BIN" node tests/character-play-ux-browser.mjs
          CHROME_BIN="$CHROME_BIN" node tests/live-table-player-views.mjs
          TUC_PDF_BROWSER_BASE_URL='http://127.0.0.1:4173' CHROME_BIN="$CHROME_BIN" node tests/character-pdf-browser.mjs

      - name: Validate Compose
        working-directory: infrastructure
        env:
          POSTGRES_DB: tuc
          POSTGRES_USER: tuc
          POSTGRES_PASSWORD: ci-only-placeholder
        run: docker compose config --quiet
