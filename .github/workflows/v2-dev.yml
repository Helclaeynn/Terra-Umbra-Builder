          assert not any(section.get("audience") == "mj" for section in article.get("sections",[])), article
          assert "CI-MJ-SECRET-" not in json.dumps(article,ensure_ascii=False), article
          PY

          echo "Wiki smoke: verifying GM/editor-only content gating"
