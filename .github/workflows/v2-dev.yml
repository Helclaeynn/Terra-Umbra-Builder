          PY

          curl --fail --silent --show-error             -b "$COOKIE_JAR"             --get             --data-urlencode "q=$SECRET_TERM"             --data-urlencode "limit=10"             https://dev.terra-umbra.fr/api/compendium/search > "$COMPENDIUM_NEW"
          python3 - "$COMPENDIUM_NEW" "$COMPENDIUM_NEW_ID" <<'PY'
          import json,sys
