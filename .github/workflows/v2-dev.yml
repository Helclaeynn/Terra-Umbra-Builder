name: TUC Web V2 dev

on:
  push:
    branches:
      - feature/tuc-web-v2
    paths:
      - "apps/**"
      - "infrastructure/**"
      - ".github/workflows/v2-dev.yml"
  workflow_dispatch:

concurrency:
  group: tuc-v2-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build API
        working-directory: apps/api
        run: |
          npm install
          npm run build

      - name: Build web
        working-directory: apps/web
        run: |
          npm install
          npm run build

      - name: Validate Compose
        working-directory: infrastructure
        env:
          POSTGRES_DB: tuc
          POSTGRES_USER: tuc
          POSTGRES_PASSWORD: ci-only-placeholder
        run: docker compose config --quiet

  deploy-dev:
    needs: check
    runs-on: ubuntu-latest
    environment: tuc-dev
    env:
      TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
      TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
      TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}

    steps:
      - name: Check deployment configuration
        id: deployment
        shell: bash
        run: |
          if [[ -n "$TUC_DEV_HOST" && -n "$TUC_DEV_USER" && -n "$TUC_DEV_SSH_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are not configured yet; skipping VPS deployment."
          fi

      - name: Checkout
        if: steps.deployment.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Configure SSH
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_dev
          chmod 600 ~/.ssh/tuc_dev
          ssh-keyscan -H "$TUC_DEV_HOST" >> ~/.ssh/known_hosts

      - name: Upload V2
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          SSH="ssh -i ~/.ssh/tuc_dev -o IdentitiesOnly=yes"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "mkdir -p /opt/terra-umbra/apps /opt/terra-umbra/infrastructure"
          rsync -az --delete -e "$SSH" apps/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/apps/"
          rsync -az --delete --exclude='.env' -e "$SSH" infrastructure/ "$TUC_DEV_USER@$TUC_DEV_HOST:/opt/terra-umbra/infrastructure/"

      - name: Migrate and deploy containers
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          ssh -i ~/.ssh/tuc_dev -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" <<'REMOTE'
            set -euo pipefail
            cd /opt/terra-umbra/infrastructure
            test -f .env

            set -a
            . ./.env
            set +a

            docker compose --env-file .env up -d db

            for attempt in $(seq 1 20); do
              if docker compose --env-file .env exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" </dev/null >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "PostgreSQL did not become ready." >&2
                exit 1
              fi
              sleep 2
            done

            for migration in migrations/*.sql; do
              echo "Applying $migration"
              docker compose --env-file .env exec -T db                 psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" < "$migration"
            done

            docker compose --env-file .env up -d --build --remove-orphans
            docker compose ps
            docker compose --env-file .env exec -T api npm run verify:mail </dev/null
          REMOTE

      - name: Smoke test
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 https://dev.terra-umbra.fr/api/health; then
              echo
              curl --fail --silent --show-error --max-time 10 https://dev.terra-umbra.fr/api/auth/setup-status
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Character V2 smoke test
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TEST_ID="$(date +%s)-$"
          TEST_EMAIL="ci-character-$TEST_ID@example.invalid"
          TEST_PASSWORD="Tuc-CI-$TEST_ID!Aa9"
          COOKIE_JAR="$(mktemp)"
          IMPORT_BODY="$(mktemp)"
          IMPORT_RESPONSE="$(mktemp)"
          CURRENT_RESPONSE="$(mktemp)"
          PATCH_BODY="$(mktemp)"
          PATCH_RESPONSE="$(mktemp)"
          RULES_RESPONSE="$(mktemp)"

          cleanup() {
            rm -f "$COOKIE_JAR" "$IMPORT_BODY" "$IMPORT_RESPONSE" "$CURRENT_RESPONSE" "$PATCH_BODY" "$PATCH_RESPONSE" "$RULES_RESPONSE"
            ssh -i ~/.ssh/tuc_dev -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST"               "cd /opt/terra-umbra/infrastructure && set -a && . ./.env && set +a && docker compose --env-file .env exec -T db psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"DELETE FROM users WHERE email = '$TEST_EMAIL';\""               </dev/null >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          REGISTER_PAYLOAD="$(printf '{"displayName":"CI Character","email":"%s","password":"%s","passwordConfirmation":"%s"}' "$TEST_EMAIL" "$TEST_PASSWORD" "$TEST_PASSWORD")"
          curl --fail --silent --show-error             -c "$COOKIE_JAR"             -H 'Content-Type: application/json'             -d "$REGISTER_PAYLOAD"             https://dev.terra-umbra.fr/api/auth/register >/dev/null

          curl --fail --silent --show-error             -b "$COOKIE_JAR"             https://dev.terra-umbra.fr/api/rulesets/terra-umbra/creation > "$RULES_RESPONSE"

          python3 - "$RULES_RESPONSE" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8"))
          rules=payload["rules"]
          lore=payload["lore"]
          choices=payload["talentChoiceSpecs"]
          assert len(rules["talents"]["origin"]) == 5, rules["talents"]["origin"].keys()
          assert sum(len(v) for v in rules["talents"]["origin"].values()) == 25
          assert sum(len(v) for v in rules["talents"]["sphere"].values()) == 60
          assert len(rules["talents"]["common"]) == 12
          assert len(rules["talents"]["expertise"]) == 25
          assert len(lore["origin"]) == 5
          assert len(lore["style"]) == 25
          assert len(lore["skill"]) == 25
          assert len(lore["sphereTalent"]) == 60
          assert lore["origin"]["corporatiste"]
          assert lore["style"]["cybercorpo"]
          assert lore["skill"]["neurodive"]
          assert lore["sphereTalent"]["dotation_standard"]
          calibrated=choices["formation_calibree"]
          assert calibrated["kind"] == "skill"
          assert calibrated["skillAttribute"] == "esprit"
          assert calibrated["bonus"] == 1
          assert calibrated["permanent"] is True
          assert "requin_corporatif" in choices
          assert "sens_accru_x" in choices
          assert payload["skillTalentMap"]["tireur_de_precision"] == "tir"
          PY

          cat > "$IMPORT_BODY" <<'JSON'
          {
            "data": {
              "schemaVersion": 1,
              "rulesetId": "terra-umbra",
              "identity": {
                "name": "CI V1 Import",
                "age": "31",
                "activity": "Journaliste",
                "concept": "Smoke import"
              },
              "attributes": {
                "vigueur": 4,
                "agilite": 5,
                "esprit": 3,
                "volonte": 4,
                "charisme": 6
              },
              "skills": {
                "tir": {
                  "style": 1,
                  "free": 2,
                  "edge": 1,
                  "raw": 99,
                  "final": 99
                }
              },
              "derived": {
                "pvMax": 999
              },
              "validation": {
                "finish": true
              }
            }
          }
          JSON

          curl --fail --silent --show-error             -b "$COOKIE_JAR"             -H 'Content-Type: application/json'             -d @"$IMPORT_BODY"             https://dev.terra-umbra.fr/api/characters/import-v1 > "$IMPORT_RESPONSE"

          read -r CHARACTER_ID CHARACTER_VERSION < <(
            python3 - "$IMPORT_RESPONSE" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))["character"]
          print(data["id"],data["version"])
          PY
          )
          test "$CHARACTER_VERSION" = "1"

          curl --fail --silent --show-error             -b "$COOKIE_JAR"             "https://dev.terra-umbra.fr/api/characters/$CHARACTER_ID" > "$CURRENT_RESPONSE"

          python3 - "$CURRENT_RESPONSE" <<'PY'
          import json,sys
          character=json.load(open(sys.argv[1],encoding="utf-8"))["character"]
          data=character["data"]
          assert data["schemaVersion"] == 2, data
          assert data["rulesetId"] == "terra-umbra", data
          assert data["identity"]["name"] == "CI V1 Import", data
          assert data["identity"]["firstName"] == "", data
          assert data["identity"]["occupation"] == "Journaliste", data
          assert "activity" not in data["identity"], data["identity"]
          assert data["meta"]["importedFrom"] == "v1-json", data
          assert data["skills"]["tir"] == {"style":1,"free":2,"edge":1}, data["skills"]["tir"]
          assert "derived" not in data, data.keys()
          assert "validation" not in data, data.keys()
          PY

          python3 - "$CURRENT_RESPONSE" "$PATCH_BODY" <<'PY'
          import json,sys
          character=json.load(open(sys.argv[1],encoding="utf-8"))["character"]
          character["data"]["identity"]["name"]="CI Native Save"
          payload={
            "name":"CI Native Save",
            "version":character["version"],
            "data":character["data"]
          }
          json.dump(payload,open(sys.argv[2],"w",encoding="utf-8"),ensure_ascii=False)
          PY

          curl --fail --silent --show-error             -b "$COOKIE_JAR"             -X PATCH             -H 'Content-Type: application/json'             -d @"$PATCH_BODY"             "https://dev.terra-umbra.fr/api/characters/$CHARACTER_ID" > "$PATCH_RESPONSE"

          python3 - "$PATCH_RESPONSE" <<'PY'
          import json,sys
          character=json.load(open(sys.argv[1],encoding="utf-8"))["character"]
          assert character["version"] == 2, character
          assert character["name"] == "CI Native Save", character
          assert character["data"]["identity"]["name"] == "CI Native Save", character
          PY

          curl --fail --silent --show-error             "https://dev.terra-umbra.fr/characters/$CHARACTER_ID/builder" | grep -q 'id="app"'

          echo "Character V2 smoke OK"

      - name: Auth logout smoke test
        if: steps.deployment.outputs.enabled == 'true'
        shell: bash
        run: |
          ssh -i ~/.ssh/tuc_dev -o IdentitiesOnly=yes "$TUC_DEV_USER@$TUC_DEV_HOST" <<'REMOTE'
            set -euo pipefail
            cd /opt/terra-umbra/infrastructure

            set -a
            . ./.env
            set +a

            TEST_ID="$(date +%s)-$"
            TEST_EMAIL="ci-logout-$TEST_ID@example.invalid"
            TEST_PASSWORD="Tuc-CI-$TEST_ID!Aa9"
            COOKIE_JAR="$(mktemp)"

            cleanup() {
              rm -f "$COOKIE_JAR"
              docker compose --env-file .env exec -T db \
                psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -c "DELETE FROM users WHERE email = '$TEST_EMAIL';" \
                </dev/null >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            PAYLOAD="$(printf '{"displayName":"CI Logout","email":"%s","password":"%s","passwordConfirmation":"%s"}' "$TEST_EMAIL" "$TEST_PASSWORD" "$TEST_PASSWORD")"

            curl --fail --silent --show-error \
              -c "$COOKIE_JAR" \
              -H 'Content-Type: application/json' \
              -d "$PAYLOAD" \
              https://dev.terra-umbra.fr/api/auth/register >/dev/null

            BEFORE="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -b "$COOKIE_JAR" \
              https://dev.terra-umbra.fr/api/auth/me)"
            test "$BEFORE" = "200"

            OLD_TOKEN="$(awk '$6 == "__Host-tuc_session" { print $7 }' "$COOKIE_JAR" | tail -n 1)"
            test -n "$OLD_TOKEN"

            LEGACY_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "Cookie: tuc_session=$OLD_TOKEN" \
              https://dev.terra-umbra.fr/api/auth/me)"
            test "$LEGACY_STATUS" = "401"

            curl --fail --silent --show-error \
              -b "$COOKIE_JAR" \
              -c "$COOKIE_JAR" \
              -X POST \
              https://dev.terra-umbra.fr/api/auth/logout >/dev/null

            AFTER_COOKIE="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -b "$COOKIE_JAR" \
              https://dev.terra-umbra.fr/api/auth/me)"
            test "$AFTER_COOKIE" = "401"

            AFTER_TOKEN="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "Cookie: __Host-tuc_session=$OLD_TOKEN" \
              https://dev.terra-umbra.fr/api/auth/me)"
            test "$AFTER_TOKEN" = "401"

            echo "Logout smoke OK"
          REMOTE
