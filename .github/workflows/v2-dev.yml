          PY

          echo "Library smoke: favorites and collections"
          curl --fail --silent --show-error \
            -b "$COOKIE_JAR" \
            -X PUT \
            https://dev.terra-umbra.fr/api/compendium/favorites/bestiaire-v15-afanc >/dev/null

          curl --fail --silent --show-error \
