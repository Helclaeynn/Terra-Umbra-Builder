name: Compendium V3 gate

on:
  push:
    branches:
      - main
      - preview/lore
      - preview/compendium-restructure
      - feature/tuc-compendium-v3-transfer-final
      - feature/tuc-compendium-editor
      - feature/tuc-compendium-inline-images
      - feature/compendium-page-pr-persistence
    paths:
      - 'compendium/**'
      - 'character-builder/rulesets/terra-umbra/reality/augmentations.json.gz.b64'
      - 'character-builder/rulesets/terra-umbra/reality/safe/equipment.manifest.json'
      - 'character-builder/rulesets/terra-umbra/reality/safe/equipment.part*.b64'
      - 'scripts/build-compendium-catalog-pages.mjs'
      - 'scripts/enrich-compendium-augmentation-generations.mjs'
      - 'scripts/enrich-compendium-reality-lore.mjs'
      - 'scripts/build-compendium-truth-catalog.mjs'
      - 'scripts/enrich-compendium-truth-lore.mjs'
      - 'scripts/prepare-builder-reality-catalogs.mjs'
      - 'scripts/build-compendium-navigation.mjs'
      - 'scripts/sync-page-overrides.mjs'
      - 'tools/github-oauth-proxy-worker.js'
      - '.github/workflows/compendium-v3-check.yml'
  pull_request:
    paths:
      - 'compendium/**'
      - 'character-builder/rulesets/terra-umbra/reality/augmentations.json.gz.b64'
      - 'character-builder/rulesets/terra-umbra/reality/safe/equipment.manifest.json'
      - 'character-builder/rulesets/terra-umbra/reality/safe/equipment.part*.b64'
      - 'scripts/build-compendium-catalog-pages.mjs'
      - 'scripts/enrich-compendium-augmentation-generations.mjs'
      - 'scripts/enrich-compendium-reality-lore.mjs'
      - 'scripts/build-compendium-truth-catalog.mjs'
      - 'scripts/enrich-compendium-truth-lore.mjs'
      - 'scripts/prepare-builder-reality-catalogs.mjs'
      - 'scripts/build-compendium-navigation.mjs'
      - 'scripts/sync-page-overrides.mjs'
      - 'tools/github-oauth-proxy-worker.js'
      - '.github/workflows/compendium-v3-check.yml'

permissions:
  contents: read

jobs:
  validate-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check V3 runtime syntax
        run: |
          node --check compendium/app-v3.js
          node --check compendium/navigation-schema.js
          node --check compendium/category-navigation.js
          node --check compendium/editor-runtime.js
          node --check compendium/editor-ordering.js
          node --check compendium/draft-manager.js
          node --check compendium/media-draft-runtime.js
          node --check compendium/media-draft-cleanup.js
          node --check compendium/inline-media-blocks.js
          node --check compendium/inline-media-dynamic-sections.js
          node --check compendium/github-editor-config.js
          node --check compendium/github-owner-editor.js
          node --check tools/github-oauth-proxy-worker.js
          node --check compendium/editor/override-engine.js
          node --check compendium/editor/native-overrides.js
          node --check compendium/editor/corpus-loader.js
          node --check compendium/editor/media-draft-store.js
          node --check compendium/editor/zip-bundle.js
          node --check scripts/sync-page-overrides.mjs
          node --check scripts/build-compendium-navigation.mjs
          node --check scripts/build-compendium-catalog-pages.mjs
          node --check scripts/enrich-compendium-augmentation-generations.mjs
          node --check scripts/enrich-compendium-reality-lore.mjs
          node --check scripts/build-compendium-truth-catalog.mjs
          node --check scripts/enrich-compendium-truth-lore.mjs
          node --check scripts/prepare-builder-reality-catalogs.mjs
          node --check compendium/tests/navigation-check.mjs
          node --check compendium/tests/catalog-pages-check.mjs
          node --check compendium/tests/catalog-pages-semantic-check.mjs
          node --check compendium/tests/reality-catalog-lore-quality-check.mjs
          node --check compendium/tests/catalog-runtime-browser-smoke.mjs
          node --check compendium/tests/truth-catalog-pages-check.mjs
          node --check compendium/tests/truth-catalog-runtime-browser-smoke.mjs
      - name: Validate editor override engine
        run: |
          node compendium/tests/editor-overrides-check.mjs
          node compendium/tests/native-overrides-check.mjs
          node compendium/tests/native-runtime-index-check.mjs
          node compendium/tests/zip-bundle-check.mjs
      - name: Validate page override aggregation
        run: |
          node scripts/sync-page-overrides.mjs
          node compendium/tests/manual-overrides-check.mjs
      - name: Validate owner auth safety
        run: |
          if grep -RniE 'client_secret|private_key|github_pat_' compendium/github-editor-config.js compendium/github-owner-editor.js; then
            echo 'A GitHub secret must never be shipped in the Compendium.' >&2
            exit 1
          fi
      - name: Validate V3 corpus and active runtime
        run: |
          node compendium/tests/manifest-check.mjs
          node compendium/tests/navigation-check.mjs
          node compendium/tests/bestiary-v16-check.mjs
          node compendium/tests/catalog-pages-check.mjs
          node compendium/tests/reality-catalog-lore-quality-check.mjs
          node compendium/tests/truth-catalog-pages-check.mjs
      - name: Validate RawGitHack external delivery
        shell: bash
        env:
          IMMUTABLE_BASE: https://raw.githack.com/Helclaeynn/Terra-Umbra-Builder/${{ github.sha }}/compendium
          PREVIEW_BASE: https://raw.githack.com/Helclaeynn/Terra-Umbra-Builder/preview/lore/compendium
          RESTRUCTURE_BASE: https://raw.githack.com/Helclaeynn/Terra-Umbra-Builder/preview/compendium-restructure/compendium
        run: |
          set -euo pipefail
          CURL=(curl --fail --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors)

          echo "Checking immutable RawGitHack page: ${IMMUTABLE_BASE}/index.html"
          "${CURL[@]}" "${IMMUTABLE_BASE}/index.html" -o /tmp/rawgithack-index.html
          grep -qi 'Terra Umbra' /tmp/rawgithack-index.html

          echo "Checking preview/lore RawGitHack page with cache-buster"
          "${CURL[@]}" "${PREVIEW_BASE}/index.html?v=${GITHUB_SHA}" -o /tmp/rawgithack-preview-index.html
          grep -qi 'Terra Umbra' /tmp/rawgithack-preview-index.html

          echo "Checking preview/compendium-restructure RawGitHack page with cache-buster"
          "${CURL[@]}" "${RESTRUCTURE_BASE}/index.html?v=${GITHUB_SHA}" -o /tmp/rawgithack-restructure-index.html
          grep -qi 'Terra Umbra' /tmp/rawgithack-restructure-index.html

          "${CURL[@]}" "${IMMUTABLE_BASE}/data/manifest-v3.json" -o /tmp/rawgithack-manifest-v3.json
          "${CURL[@]}" "${IMMUTABLE_BASE}/data/navigation-v1.json" -o /tmp/rawgithack-navigation-v1.json
          "${CURL[@]}" "${RESTRUCTURE_BASE}/data/navigation-v1.json?v=${GITHUB_SHA}" -o /tmp/rawgithack-restructure-navigation-v1.json
          node <<'NODE'
          const fs = require('fs');
          for (const path of ['/tmp/rawgithack-navigation-v1.json','/tmp/rawgithack-restructure-navigation-v1.json']) {
            const nav = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (nav.version !== 1 || !Array.isArray(nav.entries) || nav.entries.length !== 322) {
              throw new Error(`Navigation externe invalide (${path}): ${nav.entries?.length ?? 'aucune'} entrées`);
            }
          }
          NODE

          node <<'NODE' > /tmp/rawgithack-fragments.txt
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/rawgithack-manifest-v3.json', 'utf8'));
          const expected = manifest.datasets.reduce((sum, dataset) => sum + Number(dataset.count || 0), 0);
          if (expected !== Number(manifest.expectedTotal)) {
            throw new Error(`Manifest total mismatch: datasets=${expected}, expectedTotal=${manifest.expectedTotal}`);
          }
          for (const dataset of manifest.datasets) {
            if (!dataset.prefix || !Number.isInteger(dataset.parts) || dataset.parts < 1) {
              throw new Error(`Invalid dataset manifest entry: ${JSON.stringify(dataset)}`);
            }
            for (let i = 0; i < dataset.parts; i += 1) {
              process.stdout.write(`${dataset.prefix}-${String(i).padStart(2, '0')}.b64part\n`);
            }
          }
          NODE

          checked=0
          while IFS= read -r fragment; do
            [ -n "$fragment" ] || continue
            "${CURL[@]}" "${IMMUTABLE_BASE}/data/${fragment}" -o /tmp/rawgithack-fragment
            [ -s /tmp/rawgithack-fragment ]
            checked=$((checked + 1))
          done < /tmp/rawgithack-fragments.txt

          echo "RawGitHack external delivery OK — ${checked} fragments + manifest + navigation + immutable/preview/restructure HTML; no HTTP 404."
