name: Compendium restructure audit

on:
  push:
    branches:
      - preview/compendium-restructure
    paths:
      - 'compendium/**'
      - 'character-builder/rulesets/terra-umbra/truth/full/**'
      - 'scripts/audit-compendium-restructure.mjs'
      - 'scripts/inspect-compendium-restructure.mjs'
      - 'scripts/audit-truth-mixed-pages.mjs'
      - 'scripts/audit-builder-truth-groups.mjs'
      - 'scripts/audit-truth-full-catalogs.mjs'
      - 'scripts/audit-compendium-lore-inventory.mjs'
      - '.github/workflows/compendium-restructure-audit.yml'
  workflow_run:
    workflows:
      - Compendium restructure build
    types:
      - completed

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/compendium-restructure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit rules vs lore placement
        run: node scripts/audit-compendium-restructure.mjs
      - name: Inspect V3 page schema
        run: node scripts/inspect-compendium-restructure.mjs
      - name: Audit mixed Truth chapter blocks
        run: node scripts/audit-truth-mixed-pages.mjs
      - name: Audit canonical Truth groups
        run: node scripts/audit-builder-truth-groups.mjs
      - name: Audit full Truth mechanics catalogs
        run: node scripts/audit-truth-full-catalogs.mjs
      - name: Inventory Reality Truth lore pages
        run: node scripts/audit-compendium-lore-inventory.mjs
      - name: Upload restructure baseline
        uses: actions/upload-artifact@v4
        with:
          name: compendium-restructure-baseline
          path: compendium/audits/restructure-baseline.json
