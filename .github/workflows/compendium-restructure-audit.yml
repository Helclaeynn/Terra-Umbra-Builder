name: Compendium restructure audit

on:
  push:
    branches:
      - preview/compendium-restructure
    paths:
      - 'compendium/**'
      - 'scripts/audit-compendium-restructure.mjs'
      - '.github/workflows/compendium-restructure-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit rules vs lore placement
        run: node scripts/audit-compendium-restructure.mjs
      - name: Upload restructure baseline
        uses: actions/upload-artifact@v4
        with:
          name: compendium-restructure-baseline
          path: compendium/audits/restructure-baseline.json
