name: Compendium page overrides sync

on:
  push:
    branches:
      - main
    paths:
      - 'compendium/data/page-overrides/**'
      - 'compendium/data/manual-overrides-base.json'
      - 'scripts/sync-page-overrides.mjs'
      - '.github/workflows/compendium-page-overrides-sync.yml'

permissions:
  contents: write

concurrency:
  group: compendium-page-overrides-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild and publish committed override aggregate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in {1..8}; do
            echo "Synchronization attempt $attempt/8"
            git fetch origin main
            git reset --hard origin/main

            node scripts/sync-page-overrides.mjs
            node compendium/tests/manual-overrides-check.mjs

            if git diff --quiet -- compendium/data/manual-overrides.json; then
              echo 'manual-overrides.json already synchronized on latest main.'
              exit 0
            fi

            git add compendium/data/manual-overrides.json
            git commit -m 'chore(compendium): sync approved page overrides'

            if git push origin HEAD:main; then
              echo 'Override aggregate synchronized successfully.'
              exit 0
            fi

            echo 'main moved during synchronization; rebuilding from latest main.'
            sleep $((attempt * 2))
          done

          echo 'Unable to synchronize manual-overrides.json after 8 attempts.' >&2
          exit 1
