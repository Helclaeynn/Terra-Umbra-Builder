name: Compendium catalog build

on:
  push:
    branches: ['preview/lore']
    paths:
      - 'scripts/build-compendium-catalog-pages.mjs'
      - 'scripts/debug-facecaster.mjs'
      - 'compendium/tests/catalog-pages-check.mjs'
      - 'character-builder/app.parts/47-reality-missing-augmentations.txt'
      - 'character-builder/rulesets/terra-umbra/reality/augmentations.json.gz.b64'
      - 'character-builder/rulesets/terra-umbra/reality/safe/**'
      - '.github/workflows/compendium-catalog-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/lore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Compendium catalog pages from Builder runtime sources
        shell: bash
        run: |
          set -o pipefail
          { node scripts/debug-facecaster.mjs; node scripts/build-compendium-catalog-pages.mjs; } 2>&1 | tee /tmp/compendium-catalog-build.log
      - name: Upload catalog build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compendium-catalog-build-log
          path: /tmp/compendium-catalog-build.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Validate generated catalogs
        run: node compendium/tests/catalog-pages-check.mjs
      - name: Commit generated catalog artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A compendium/data compendium/assets/equipment-placeholder.svg compendium/assets/augmentation-placeholder.svg
          if git diff --cached --quiet; then
            echo 'No generated catalog changes.'
            exit 0
          fi
          git commit -m 'build(compendium): sync reality catalogs from builder runtime'
          git push origin HEAD:preview/lore
