name: Compendium catalog build

on:
  push:
    branches: ['preview/compendium-restructure']
    paths:
      - 'scripts/build-compendium-catalog-pages.mjs'
      - 'scripts/enrich-compendium-augmentation-generations.mjs'
      - 'scripts/enrich-compendium-reality-lore.mjs'
      - 'scripts/apply-compendium-augmentation-lore.mjs'
      - 'scripts/apply-compendium-firearms-lore.mjs'
      - 'scripts/sanitize-compendium-reality-derived-lore.mjs'
      - 'scripts/apply-compendium-final-reality-lore.mjs'
      - 'scripts/clean-compendium-equipment-derived-prose-v1.mjs'
      - 'scripts/audit-reality-lore-gaps.mjs'
      - 'scripts/audit-catalog-editorial-coverage.mjs'
      - 'scripts/audit-augmentation-editorial-source.mjs'
      - 'scripts/sync-compendium-catalog-navigation-titles.mjs'
      - 'compendium/source/reality-lore-v3-sparse.json'
      - 'compendium/source/reality-lore-v3-neuro.json'
      - 'compendium/source/reality-lore-v3-augmentations.json'
      - 'compendium/source/reality-lore-v3-augmentations-curated-sensory-neural.json'
      - 'compendium/source/reality-lore-v3-augmentations-curated-body-systems.json'
      - 'compendium/source/reality-lore-v3-firearms.json'
      - 'compendium/source/reality-lore-v3-final-eight.json'
      - 'compendium/source/reality-lore-v3-curated-holonet.json'
      - 'compendium/source/reality-lore-v3-curated-civic.json'
      - 'compendium/source/reality-lore-v3-curated-housing.json'
      - 'compendium/source/reality-lore-v3-curated-daily-life.json'
      - 'compendium/source/reality-lore-v3-curated-drugs-services.json'
      - 'compendium/source/reality-lore-v3-curated-vehicles.json'
      - 'compendium/source/reality-lore-v3-curated-armor.json'
      - 'compendium/source/reality-lore-v3-curated-armor-modules.json'
      - 'compendium/source/reality-lore-v3-curated-ammunition.json'
      - 'compendium/source/reality-lore-v3-curated-standard-ammunition.json'
      - 'compendium/tests/catalog-pages-check.mjs'
      - 'compendium/tests/catalog-pages-semantic-check.mjs'
      - 'compendium/tests/reality-catalog-lore-quality-check.mjs'
      - 'compendium/tests/equipment-description-quality-check.mjs'
      - 'compendium/tests/catalog-runtime-browser-smoke.mjs'
      - 'character-builder/app.parts/47-reality-missing-augmentations.txt'
      - 'character-builder/rulesets/terra-umbra/reality/augmentations.json.gz.b64'
      - 'character-builder/rulesets/terra-umbra/reality/safe/**'
      - '.github/workflows/compendium-catalog-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/compendium-restructure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Compendium catalog pages from Builder runtime sources
        shell: bash
        run: |
          set -o pipefail
          { node scripts/build-compendium-catalog-pages.mjs; node scripts/enrich-compendium-augmentation-generations.mjs; node scripts/apply-compendium-augmentation-lore.mjs; node scripts/apply-compendium-firearms-lore.mjs; node scripts/sanitize-compendium-reality-derived-lore.mjs; node scripts/apply-compendium-final-reality-lore.mjs; node scripts/clean-compendium-equipment-derived-prose-v1.mjs; node scripts/audit-reality-lore-gaps.mjs; node scripts/audit-catalog-editorial-coverage.mjs; node scripts/audit-augmentation-editorial-source.mjs; node scripts/sync-compendium-catalog-navigation-titles.mjs; } 2>&1 | tee /tmp/compendium-catalog-build.log
      - name: Upload catalog build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compendium-catalog-build-log
          path: /tmp/compendium-catalog-build.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Validate generated catalogs
        run: |
          node compendium/tests/catalog-pages-check.mjs
          node compendium/tests/catalog-pages-semantic-check.mjs
          node compendium/tests/reality-catalog-lore-quality-check.mjs
      - name: Install browser driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Smoke test generated catalogs in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tuc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/compendium/ >/dev/null; then
              break
            fi
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'Chrome/Chromium introuvable sur le runner.' >&2
            exit 1
          fi
          echo "Using browser: $CHROME_BIN"
          TUC_SMOKE_BASE_URL='http://127.0.0.1:8765/' CHROME_BIN="$CHROME_BIN" node compendium/tests/catalog-runtime-browser-smoke.mjs
      - name: Commit generated catalog artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A compendium/data compendium/assets/equipment-placeholder.svg compendium/assets/augmentation-placeholder.svg
          if git diff --cached --quiet; then
            echo 'No generated catalog changes.'
            exit 0
          fi
          git commit -m 'build(compendium): sync source-first Reality catalog descriptions'
          git push origin HEAD:preview/compendium-restructure
