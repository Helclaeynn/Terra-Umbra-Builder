name: Compendium catalog build

on:
  push:
    branches:
      - preview/lore
    paths:
      - 'scripts/build-compendium-catalog-pages.mjs'
      - 'scripts/prepare-builder-reality-catalogs.mjs'
      - 'scripts/patch-compendium-catalog-runtime.mjs'
      - 'scripts/fix-catalog-lore-uniqueness.mjs'
      - '.github/workflows/compendium-catalog-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/lore
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make generated lore item-specific
        run: node scripts/fix-catalog-lore-uniqueness.mjs
      - name: Prepare active Builder catalogs
        run: node scripts/prepare-builder-reality-catalogs.mjs
      - name: Generate Compendium equipment and augmentation pages
        run: node scripts/build-compendium-catalog-pages.mjs
      - name: Wire catalog categories into Compendium runtime
        run: node scripts/patch-compendium-catalog-runtime.mjs
      - name: Commit generated catalog pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-compendium-catalog-pages.mjs compendium/app-v3.js compendium/data/manifest-v3.json compendium/data/v3-equipement-builder-v1-*.b64part compendium/data/v3-augmentations-builder-v1-*.b64part compendium/assets/equipment-placeholder.svg compendium/assets/augmentation-placeholder.svg
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "fix(compendium): make equipment and augmentation lore item-specific"
          git push origin HEAD:preview/lore
