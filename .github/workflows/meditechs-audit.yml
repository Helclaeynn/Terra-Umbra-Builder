name: Meditechs audit helper

on:
  push:
    branches:
      - feature/tuc-compendium-characters-meditechs
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Decode final corpus and audit Meditech identities
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const path = require('path');
          const root = path.join(process.cwd(), 'compendium', 'data');
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest-v3.json'), 'utf8'));
          const final = new Map();
          const order = [];
          for (const ds of manifest.datasets) {
            let b64 = '';
            for (let i = 0; i < ds.parts; i++) {
              b64 += fs.readFileSync(path.join(root, `${ds.prefix}-${String(i).padStart(2, '0')}.b64part`), 'utf8').replace(/\s+/g, '');
            }
            const rows = JSON.parse(zlib.gunzipSync(Buffer.from(b64, 'base64')).toString('utf8'));
            for (const row of rows) {
              if (!final.has(row.id)) order.push(row.id);
              final.set(row.id, row);
            }
          }
          const rows = order.map(id => final.get(id));
          const names = [
            'Taishara Jibson',
            'Phoebe Edgar',
            'Elizabeth Mircalla Karnstein',
            'Lenny Falk',
            'Dushane Murray',
            'Narako Austin',
            'Aisha White',
            'Arnstein Gill',
            'Mi-Yeon Ryong'
          ];
          const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
          console.log(`FINAL_COUNT=${rows.length}`);
          for (const name of names) {
            const needle = norm(name);
            const exact = rows.filter(r => norm(r.title) === needle);
            const mention = rows.filter(r => norm(JSON.stringify(r)).includes(needle));
            console.log(`\n### ${name}`);
            console.log(`EXACT=${exact.length}`);
            for (const row of exact) console.log(JSON.stringify(row));
            console.log(`MENTIONS=${mention.length}`);
            for (const row of mention) console.log(`MENTION ${row.id} | ${row.title} | ${row.category}`);
          }
          NODE
