name: Legacy equipment media

on:
  push:
    branches:
      - feature/legacy-arsenal-armors-reintegration
    paths:
      - 'compendium/source/.legacy-equipment-media-stage.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/legacy-arsenal-armors-reintegration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore extracted source artwork
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          READY='compendium/source/.legacy-equipment-media-stage.ready'
          STAGE='compendium/source/.legacy-equipment-media-stage'
          if [[ ! -f "$READY" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No staging marker present; nothing to integrate.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          test -d "$STAGE"
          COUNT="$(find "$STAGE" -maxdepth 1 -type f -name 'final.b64.part*' | wc -l)"
          test "$COUNT" -eq 46
          rm -rf compendium/images/manual/equipment-legacy
          mkdir -p compendium/images/manual/equipment-legacy
          cat "$STAGE"/final.b64.part* > /tmp/legacy-equipment-media.b64
          base64 -d /tmp/legacy-equipment-media.b64 > /tmp/legacy-equipment-media.tar.gz
          ACTUAL_SHA="$(sha256sum /tmp/legacy-equipment-media.tar.gz | awk '{print $1}')"
          test "$ACTUAL_SHA" = 'b21f221b64351315ce74a2230453b7b689a26ab4e2a8281ffccb0603f4ac643b'
          tar -xzf /tmp/legacy-equipment-media.tar.gz -C compendium/images/manual/equipment-legacy
          MEDIA_COUNT="$(find compendium/images/manual/equipment-legacy -maxdepth 1 -type f -name '*.webp' | wc -l)"
          test "$MEDIA_COUNT" -eq 124
          node scripts/build-legacy-equipment-media-map.mjs
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const m=JSON.parse(fs.readFileSync('compendium/source/legacy-equipment-media-v1.json','utf8'));
          if(m.count!==124||m.installCount!==123||m.entries?.length!==124)throw new Error(`media map ${m.entries?.length||0}/124, install ${m.installCount||0}/123`);
          for(const e of m.entries){const f=`compendium/${e.image}`;const b=fs.readFileSync(f);if(b.subarray(0,4).toString('ascii')!=='RIFF'||b.subarray(8,12).toString('ascii')!=='WEBP')throw new Error(`invalid webp ${f}`);const sha=crypto.createHash('sha256').update(b).digest('hex');if(sha!==e.sha256)throw new Error(`sha mismatch ${f}`);}
          NODE
      - name: Apply media to Compendium pages
        if: steps.restore.outputs.ready == 'true'
        run: node scripts/apply-compendium-legacy-equipment-media.mjs
      - name: Validate media and Compendium
        if: steps.restore.outputs.ready == 'true'
        run: |
          node compendium/tests/legacy-equipment-media-check.mjs
          node compendium/tests/legacy-equipment-reintegration-check.mjs
          node compendium/tests/manifest-check.mjs
          node compendium/tests/catalog-pages-semantic-check.mjs
          node compendium/tests/navigation-check.mjs
      - name: Commit source artwork and generated pages
        if: steps.restore.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf compendium/source/.legacy-equipment-media-stage
          rm -f compendium/source/.legacy-equipment-media-stage.ready \
            compendium/source/.legacy-equipment-media-bundle-v5.ready \
            compendium/source/.legacy-equipment-media-bundle-v5.b64 \
            compendium/source/.legacy-equipment-media-bundle-v4.ready \
            compendium/source/.legacy-equipment-media-bundle-v4.bin.part* \
            compendium/source/.legacy-equipment-media-bundle-v3.ready \
            compendium/source/.legacy-equipment-media-bundle-v3.b64.part* \
            compendium/source/.legacy-equipment-media-bundle-v2.ready \
            compendium/source/.legacy-equipment-media-bundle-v2.b64.part* \
            compendium/source/.legacy-equipment-media-bundle.b64.part*
          git add -A compendium/source
          git add compendium/images/manual/equipment-legacy compendium/data
          git commit -m 'feat(compendium): integrate legacy weapon and armor artwork'
          git push origin HEAD:feature/legacy-arsenal-armors-reintegration
