name: Compendium restructure build

on:
  push:
    branches:
      - preview/compendium-restructure
    paths:
      - 'compendium/source/reality-rules-v1.json.gz.b64'
      - 'character-builder/rulesets/terra-umbra/talents/**'
      - 'character-builder/rulesets/terra-umbra/disadvantages/**'
      - 'scripts/restructure-compendium-rules.mjs'
      - 'compendium/tests/restructure-rules-check.mjs'
      - 'compendium/tests/manifest-check.mjs'
      - '.github/workflows/compendium-restructure-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/compendium-restructure
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build restructured Rules datasets
        run: node scripts/restructure-compendium-rules.mjs
      - name: Validate V3 manifest
        run: node compendium/tests/manifest-check.mjs
      - name: Validate Rules Reality Truth restructure
        run: node compendium/tests/restructure-rules-check.mjs
      - name: Commit generated restructure datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compendium/data/manifest-v3.json \
            compendium/data/v3-regles-v2-*.b64part \
            compendium/data/v3-realite-v2-*.b64part \
            compendium/data/v3-verite-v2-*.b64part
          if git diff --cached --quiet; then
            echo "No generated restructure changes."
            exit 0
          fi
          git commit -m "chore(compendium): apply rules restructure"
          git push origin HEAD:preview/compendium-restructure
