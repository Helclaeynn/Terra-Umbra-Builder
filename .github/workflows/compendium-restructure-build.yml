name: Compendium restructure build

on:
  push:
    branches:
      - preview/compendium-restructure
    paths:
      - 'compendium/source/reality-rules-v1.json.gz.b64'
      - 'compendium/source/truth-mechanics-v6-fixed.manifest.json'
      - 'compendium/source/truth-mechanics-v6-fixed.part*.b64'
      - 'character-builder/rulesets/terra-umbra/talents/**'
      - 'character-builder/rulesets/terra-umbra/disadvantages/**'
      - 'character-builder/rulesets/terra-umbra/truth/core.json'
      - 'character-builder/rulesets/terra-umbra/truth/talents/**'
      - 'scripts/restructure-compendium-mechanics-v2.mjs'
      - 'scripts/refine-reality-talent-page-granularity.mjs'
      - 'scripts/audit-truth-v6-mechanics-overlap.mjs'
      - 'compendium/tests/restructure-rules-check.mjs'
      - 'compendium/tests/reality-talent-granularity-check.mjs'
      - 'compendium/tests/manifest-check.mjs'
      - '.github/workflows/compendium-restructure-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/compendium-restructure
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Truth V6 mechanics source and Builder overlap
        run: node scripts/audit-truth-v6-mechanics-overlap.mjs
      - name: Build grouped mechanics pages
        run: node scripts/restructure-compendium-mechanics-v2.mjs
      - name: Refine Reality talent page granularity
        run: node scripts/refine-reality-talent-page-granularity.mjs
      - name: Validate V3 manifest
        run: node compendium/tests/manifest-check.mjs
      - name: Validate grouped Rules structure
        run: node compendium/tests/restructure-rules-check.mjs
      - name: Validate Reality talent granularity
        run: node compendium/tests/reality-talent-granularity-check.mjs
      - name: Commit generated mechanics dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compendium/data/manifest-v3.json \
            compendium/data/v3-regles-v4-*.b64part
          if git diff --cached --quiet; then
            echo "No generated mechanics changes."
            exit 0
          fi
          git commit -m "chore(compendium): apply refined mechanics restructure"
          git push origin HEAD:preview/compendium-restructure
