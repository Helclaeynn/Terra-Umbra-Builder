name: V2 production Compendium guides
on:
  push:
    branches: [feature/tuc-web-v2]
    paths: [.github/workflows/v2-production-atlas.yml]
permissions:
  contents: read
concurrency:
  group: tuc-v2-production
  cancel-in-progress: false
env:
  BASE_SHA: 0126937929ac4d8be3e9cbfef71abd3facfc2bbd
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply only beginner guides and glossary to the published application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-source /tmp/atlas-release
          git archive "$BASE_SHA" | tar -x -C /tmp/atlas-source
          # Only reviewed onboarding views and links are included in this web-only release.
          for path in apps/web/src/components/GuideIllustration.vue apps/web/src/components/GuideRulesReminder.vue apps/web/src/pages/RealityStartPage.vue apps/web/src/lib/reality-start.json; do
            mkdir -p "/tmp/atlas-source/$(dirname "$path")"
            cp -a "$path" "/tmp/atlas-source/$(dirname "$path")/"
          done
          for path in apps/web/src/components/builder/NatureStartGuide.vue apps/web/src/components/builder/ProgressionStep.vue apps/web/src/pages/CharacterBuilderPage.vue apps/web/src/main.ts apps/web/src/pages/CompendiumPage.vue apps/web/src/components/CompendiumDiscovery.vue apps/web/src/components/ArticleReadingGuide.vue apps/web/src/components/PlayerStartFrame.vue apps/web/src/pages/PlayerStartPage.vue apps/web/src/pages/GlossaryPage.vue apps/web/src/lib/player-start.ts apps/web/src/lib/player-start.json apps/web/src/lib/player-glossary.json apps/web/src/lib/article-reading-guides.json apps/web/src/player-start.css apps/web/tests/player-start-dom.mjs apps/web/tests/builder-save-navigation.mjs apps/web/tests/compendium-page-dom.mjs; do
            mkdir -p "/tmp/atlas-source/$(dirname "$path")"
            cp -a "$path" "/tmp/atlas-source/$(dirname "$path")/"
          done
          node --input-type=module -e "import {writeFileSync} from 'node:fs';writeFileSync('/tmp/atlas-source/apps/web/public/build-info.json',JSON.stringify({commit:process.env.GITHUB_SHA,base:process.env.BASE_SHA,release:'onboarding-20260930',scope:'web-compendium-only'}));"
      - name: Compile existing API definitions for the Compendium fixture test
        working-directory: /tmp/atlas-source/apps/api
        run: |
          npm ci
          npx tsc -p tsconfig.json
      - name: Verify beginner routes, glossary, atlas and Compendium
        working-directory: /tmp/atlas-source/apps/web
        run: |
          npm ci
          npm run build
          node tests/player-start-dom.mjs
          node tests/builder-save-navigation.mjs
          node tests/hunter-builder-dom.mjs
          node tests/atlas-data-check.mjs
          node tests/compendium-navigation-check.mjs
          node tests/compendium-reading-check.mjs
          node tests/compendium-page-dom.mjs
      - name: Build immutable web image and measure required space
        shell: bash
        run: |
          set -euo pipefail
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "tuc-v2-web:atlas-$GITHUB_SHA" -f /tmp/atlas-source/apps/web/Dockerfile /tmp/atlas-source
          docker save "tuc-v2-web:atlas-$GITHUB_SHA" | gzip -1 > /tmp/atlas-release/web.tar.gz
          tar --exclude=web/node_modules --exclude=web/dist -czf /tmp/atlas-release/web-source.tar.gz -C /tmp/atlas-source/apps web
          image_bytes=$(docker image inspect --format '{{.Size}}' "tuc-v2-web:atlas-$GITHUB_SHA")
          source_bytes=$(du -sb /tmp/atlas-source/apps/web --exclude=node_modules --exclude=dist | cut -f1)
          transfer_bytes=$(du -sb /tmp/atlas-release | cut -f1)
          # Two image copies for load/unpack, source, archives, plus 512 MiB reserve.
          printf '%s\n' "$((image_bytes*2+source_bytes+transfer_bytes+536870912))" > /tmp/atlas-release/required-bytes.txt
          cd /tmp/atlas-release
          sha256sum web.tar.gz web-source.tar.gz required-bytes.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-web-release
          path: /tmp/atlas-release/
          compression-level: 0
          retention-days: 3
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: tuc-dev
    timeout-minutes: 20
    env:
      TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
      TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
      TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atlas-web-release
          path: /tmp/atlas-release
      - name: Guard current version, transfer and publish only web
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/tuc-web-v2 | cut -f1)" = "$GITHUB_SHA"
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/tuc_atlas' EXIT
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_atlas
          chmod 600 ~/.ssh/tuc_atlas
          ssh-keyscan -H "$TUC_DEV_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/tuc_atlas -o IdentitiesOnly=yes"
          stage="/opt/terra-umbra/releases/atlas-$GITHUB_SHA"
          required=$(cat /tmp/atlas-release/required-bytes.txt)
          # This exact failed upload never reached image loading or publication.
          # Remove only its reproducible transfer archives, never a rollback/source tree.
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" 'bash -s' <<'CLEAN_FAILED_UPLOAD'
          set -euo pipefail
          failed=/opt/terra-umbra/releases/atlas-32f51ed349dc56a69f4715777228c1081f62f537
          if test -f "$failed/web.tar.gz"; then
            test ! -e "$failed/deployed.ok"
            test ! -e "$failed/previous-web-image"
            test ! -e "$failed/previous-web"
            test ! -e "$failed/new"
            (cd "$failed" && sha256sum --check SHA256SUMS)
            rm -- "$failed/web.tar.gz" "$failed/web-source.tar.gz"
          fi
          CLEAN_FAILED_UPLOAD
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "test -f /opt/terra-umbra/production-active && test \$(df -B1 --output=avail /opt/terra-umbra | tail -1) -gt $required && mkdir -p '$stage'"
          rsync -az -e "$SSH" /tmp/atlas-release/ "$TUC_DEV_USER@$TUC_DEV_HOST:$stage/"
          { printf '{\n'; cat infrastructure/production/release-atlas.sh; printf '\n}\n'; } | $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$GITHUB_SHA" "$BASE_SHA"
