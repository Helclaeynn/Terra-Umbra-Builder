name: Truth catalog check

on:
  push:
    branches: [ feature/tuc-character-builder-v1 ]
  pull_request:
    paths:
      - 'character-builder/rulesets/terra-umbra/truth/**'
      - '.github/workflows/truth-catalog-check.yml'

jobs:
  validate-truth-catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Truth manifests, chunks and full V5 imports
        shell: python
        run: |
          import base64, gzip, json
          from pathlib import Path

          root = Path('character-builder/rulesets/terra-umbra/truth/talents')
          errors = []
          checked = 0

          for manifest_path in root.rglob('manifest.json'):
              checked += 1
              try:
                  manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append(f'{manifest_path}: invalid manifest JSON: {exc}')
                  continue

              chunks = manifest.get('chunks') or []
              if not chunks:
                  errors.append(f'{manifest_path}: no chunks declared')
                  continue

              entries = []
              for chunk_name in chunks:
                  chunk_path = manifest_path.parent / chunk_name
                  if not chunk_path.is_file():
                      errors.append(f'{manifest_path}: missing chunk {chunk_name}')
                      continue
                  try:
                      data = json.loads(chunk_path.read_text(encoding='utf-8'))
                  except Exception as exc:
                      errors.append(f'{chunk_path}: invalid JSON: {exc}')
                      continue
                  if not isinstance(data, list):
                      errors.append(f'{chunk_path}: expected an array')
                      continue
                  entries.extend(data)

              expected = manifest.get('entries')
              if isinstance(expected, int) and len(entries) != expected:
                  errors.append(f'{manifest_path}: expected {expected} entries, loaded {len(entries)}')

              ids = [x.get('id') for x in entries if isinstance(x, dict)]
              duplicates = sorted({x for x in ids if x and ids.count(x) > 1})
              if duplicates:
                  errors.append(f'{manifest_path}: duplicate ids: {duplicates}')

          if checked == 0:
              errors.append('No Truth manifests found')

          full_root = Path('character-builder/rulesets/terra-umbra/truth/full')
          for nature, minimum in {'daemon': 120, 'angelus': 100}.items():
              path = full_root / f'{nature}.json.gz.b64'
              try:
                  payload = ''.join(path.read_text(encoding='utf-8').split())
                  raw = gzip.decompress(base64.b64decode(payload, validate=True))
                  data = json.loads(raw.decode('utf-8'))
                  rows = data if isinstance(data, list) else data.get('entries', [])
                  paid = [x for x in rows if isinstance(x, dict) and x.get('name') and isinstance(x.get('cost'), (int, float)) and x.get('cost') > 0]
                  ids = [x.get('id') for x in paid if x.get('id')]
                  if len(paid) < minimum:
                      errors.append(f'{path}: only {len(paid)} paid entries, expected at least {minimum}')
                  if len(ids) != len(set(ids)):
                      errors.append(f'{path}: duplicate paid ids')
                  print(f'{nature}: {len(paid)} paid V5 entries')
              except Exception as exc:
                  errors.append(f'{path}: invalid compressed full catalog: {exc}')

          if errors:
              raise SystemExit('\n'.join(errors))

          print(f'Validated {checked} Truth manifests and complete Daemon/Angelus imports successfully.')