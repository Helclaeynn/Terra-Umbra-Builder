name: V2 production campaign live table
on:
  push:
    branches: [feature/tuc-web-v2]
    paths: [.github/workflows/v2-production-campaign-live.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: tuc-v2-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: tuc-dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the approved and fully tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source=1b779b179d295481f9917063bb95df4ae5ccc7f3
          git merge-base --is-ancestor "$source" HEAD
          verified=false
          for attempt in $(seq 1 90); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$source" --jq '[.workflow_runs[] | select(.path == ".github/workflows/v2-dev.yml")][0] | .conclusion // .status // "pending"')
            if [ "$status" = success ]; then verified=true; break; fi
            case "$status" in failure|cancelled|timed_out) echo "Source validation failed: $status"; exit 1;; esac
            sleep 10
          done
          [ "$verified" = true ]
          test -z "$(git diff "$source" HEAD -- apps compendium character-builder infrastructure/migrations)"
      - name: Compile approved application code
        run: |
          set -euo pipefail
          cd apps/api
          npm ci
          npm run build
          cd ../web
          npm ci
          npm run build
      - name: Package application overlay and additive migration
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,tarfile
          files=subprocess.check_output(['git','diff','--name-only','6f36b180fbc00f7785ee3a38609d895d8bafb623','1b779b179d295481f9917063bb95df4ae5ccc7f3'],text=True).splitlines()
          files=[p for p in files if p.startswith(('apps/','infrastructure/migrations/'))]
          pathlib.Path('payload-files.json').write_text(json.dumps(files))
          runtime=[p.replace('/src/','/dist/').removesuffix('.ts')+'.js' for p in files if p.startswith('apps/api/src/')]
          assert len(runtime)==6
          with tarfile.open('/tmp/playtest-release.tar.gz','w:gz') as t:
            for p in files+runtime+['payload-files.json','apps/web/dist/index.html','apps/web/dist/assets']:t.add(p,arcname=p)
          PY
      - name: Back up, deploy and verify production
        env:
          TUC_DEV_HOST: ${{ secrets.TUC_DEV_HOST }}
          TUC_DEV_USER: ${{ secrets.TUC_DEV_USER }}
          TUC_DEV_SSH_KEY: ${{ secrets.TUC_DEV_SSH_KEY }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/tuc-web-v2 | cut -f1)" = "$GITHUB_SHA"
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/tuc_prod' EXIT
          printf '%s\n' "$TUC_DEV_SSH_KEY" > ~/.ssh/tuc_prod
          chmod 600 ~/.ssh/tuc_prod
          ssh-keyscan -H "$TUC_DEV_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/tuc_prod -o IdentitiesOnly=yes"
          { printf '{\n'; cat infrastructure/production/cleanup-playtest-cache.sh; printf '\n}\n'; } | $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" bash | tee /tmp/playtest-cleanup.log
          grep -q '^PLAYTEST CACHE CLEANUP VERIFIED' /tmp/playtest-cleanup.log
          stage="/opt/terra-umbra/releases/campaign-live-$GITHUB_SHA"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "mkdir -p '$stage'"
          rsync -az -e "$SSH" /tmp/playtest-release.tar.gz "$TUC_DEV_USER@$TUC_DEV_HOST:$stage/"
          $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" "tar -xzf '$stage/playtest-release.tar.gz' -C '$stage'"
          { printf '{\n'; cat infrastructure/production/release-campaign-live.sh; printf '\n}\n'; } | $SSH "$TUC_DEV_USER@$TUC_DEV_HOST" bash -s -- "$GITHUB_SHA" | tee /tmp/playtest-release.log
          grep -q '^CAMPAIGN TABLE PRODUCTION LIVE VERIFIED' /tmp/playtest-release.log
