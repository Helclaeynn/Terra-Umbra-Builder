<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terra Umbra — Preview Compendium éditeur</title>
<style>
  html,body{margin:0;min-height:100%;background:#0b0f12;color:#eaf0f4;font-family:Inter,Segoe UI,Arial,sans-serif}
  #boot{max-width:900px;margin:64px auto;padding:26px;border:1px solid #27323e;border-radius:16px;background:#111820;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  #boot strong{color:#48d7b1}.muted{color:#9eabb7}.error{color:#ff8a96;white-space:pre-wrap}
  code{background:#0d141b;border:1px solid #26313c;border-radius:6px;padding:.15rem .35rem}
  a{color:#7be8c9}
</style>
</head>
<body>
<div id="boot">
  <strong>Terra Umbra — Preview Compendium éditeur</strong>
  <p>Ouverture du snapshot de recette <code>205e9e6</code>…</p>
  <p class="muted">Cette preview est physiquement publiée sous <code>/preview/compendium-editor/</code>. La production <code>/compendium/</code> reste indépendante.</p>
</div>
<script>
(async()=>{
  const target=new URL('./preview/compendium-editor/compendium/?preview=205e9e6#/home',location.href);
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.filter(r=>r.scope.includes('/preview/compendium-editor/')).map(r=>r.unregister()));
    }
  }catch(error){console.warn('Nettoyage de l’ancienne preview ignoré',error)}
  location.replace(target.href);
})();
</script>
</body>
</html>
