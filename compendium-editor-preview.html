<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terra Umbra — Preview Compendium éditeur</title>
<style>
  html,body{margin:0;min-height:100%;background:#0b0f12;color:#eaf0f4;font-family:Inter,Segoe UI,Arial,sans-serif}
  #boot{max-width:900px;margin:64px auto;padding:26px;border:1px solid #27323e;border-radius:16px;background:#111820;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  #boot strong{color:#48d7b1}.muted{color:#9eabb7}.error{color:#ff8a96;white-space:pre-wrap}
  code{background:#0d141b;border:1px solid #26313c;border-radius:6px;padding:.15rem .35rem}
  a{color:#7be8c9}
</style>
</head>
<body>
<div id="boot">
  <strong>Terra Umbra — Preview Compendium éditeur</strong>
  <p>Initialisation de la branche <code>preview/compendium-editor</code>…</p>
  <p class="muted">Cette preview est isolée de la prod <code>/compendium/</code> et charge directement les fichiers de la branche de recette.</p>
</div>
<script type="module">
const boot=document.querySelector('#boot');
const target=new URL('./preview/compendium-editor/compendium/#/home',location.href);
try{
  if(!('serviceWorker' in navigator))throw new Error('Ce navigateur ne prend pas en charge les Service Workers.');
  const registration=await navigator.serviceWorker.register('./compendium-editor-preview-sw.js?v=20260912-1',{scope:'./preview/compendium-editor/'});
  await navigator.serviceWorker.ready;
  if(registration.waiting)registration.waiting.postMessage?.({type:'SKIP_WAITING'});
  boot.innerHTML='<strong>Preview prête</strong><p>Ouverture du Compendium de recette…</p>';
  location.replace(target.href);
}catch(error){
  boot.innerHTML=`<strong>Échec du chargement de la preview</strong><p class="error"></p><p><a href="./compendium/">Retour au Compendium de production</a></p>`;
  boot.querySelector('.error').textContent=error?.stack||String(error);
  console.error(error);
}
</script>
</body>
</html>
