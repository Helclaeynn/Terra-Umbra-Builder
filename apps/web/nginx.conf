server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints filenames: previously loaded scripts and styles can be
  # reused when a Compendium article opens in a separate tab.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
