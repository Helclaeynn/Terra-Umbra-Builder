name: tuc-v2

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_POOL_SIZE: "5"
      SESSION_TTL_DAYS: "30"
      APP_BASE_URL: ${APP_BASE_URL:-https://dev.terra-umbra.fr}
      SMTP_HOST: ${SMTP_HOST:-smtp.mail.ovh.net}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-noreply@terra-umbra.fr}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      MAIL_FROM: ${MAIL_FROM:-Terra Umbra <noreply@terra-umbra.fr>}
      COMPENDIUM_UPLOAD_DIR: /app/editor-media
      # « db » : règles et articles lus dans les tables de contenu (réglé dans .env
      # une fois le contenu du site d'essai recopié) ; vide : catalogues du code.
      CONTENT_SOURCE: ${CONTENT_SOURCE:-}
    volumes:
      - /opt/terra-umbra/secrets/smtp_password:/run/secrets/smtp_password:ro
      - compendium-editor-media:/app/editor-media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Dossiers PDF et cartes rangés à part (.dockerignore) : la copie des sources
    # du serveur, mise à jour par deploy.sh avant chaque bascule.
    volumes:
      - ../apps/web/public/pdf/dossiers:/usr/share/nginx/html/pdf/dossiers:ro
      - ../apps/web/public/map-assets:/usr/share/nginx/html/map-assets:ro
    networks:
      - frontend

  # CMS du contenu, en fond (l'auteur écrit dans le site) : https://terra-umbra.fr/cms.
  # Clés et compte administrateur dans .env (créés par production/deploy.sh).
  directus:
    image: directus/directus:11.5.1
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      PUBLIC_URL: https://terra-umbra.fr/cms
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      # Son propre compte, limité au contenu (recette/directus-db-role.sql).
      DB_USER: directus_cms
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      TELEMETRY: "false"
      WEBSOCKETS_ENABLED: "false"
      EMAIL_TRANSPORT: sendmail
      EMAIL_SENDMAIL_PATH: /bin/false
    volumes:
      - directus-uploads:/directus/uploads
      - ./recette/directus-extensions:/directus/extensions:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    networks:
      - frontend

volumes:
  postgres-data:
  compendium-editor-media:
  directus-uploads:
  caddy-data:
  caddy-config:

networks:
  frontend:
  backend:
    internal: true
