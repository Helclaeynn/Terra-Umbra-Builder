# Site d'essai (recette) : seconde pile sur le même VPS, servie par le Caddy
# de production sur dev.terra-umbra.fr (protégée par mot de passe).
# Ses services ne s'appellent pas « api » ni « web » : sur le réseau partagé
# avec Caddy, ces noms désignent la production.
name: tuc-recette

services:
  recette-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - recette-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - recette

  recette-api:
    image: tuc-recette-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@recette-db:5432/${POSTGRES_DB}
      DB_POOL_SIZE: "3"
      SESSION_TTL_DAYS: "30"
      APP_BASE_URL: https://dev.terra-umbra.fr
      # Pas d'envoi d'e-mails : la base est une copie de la production.
      SMTP_HOST: ""
      SMTP_USER: ""
      COMPENDIUM_UPLOAD_DIR: /app/editor-media
      # Étape 7 : règles de Vérité lues dans les tables de contenu (voies à
      # paliers). La production garde les catalogues tant que ce n'est pas validé.
      CONTENT_SOURCE: db
    volumes:
      - recette-editor-media:/app/editor-media
    depends_on:
      recette-db:
        condition: service_healthy
    networks:
      - recette
      - caddy

  recette-web:
    image: tuc-recette-web:latest
    restart: unless-stopped
    networks:
      - caddy

  # CMS du contenu éditorial (audit technique, recommandation A), sur la même
  # base que le site d'essai. Servi par Caddy sur dev.terra-umbra.fr/cms.
  # Clés et compte administrateur dans .env (créés par deploy-recette.sh).
  recette-directus:
    image: directus/directus:11.5.1
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      PUBLIC_URL: https://dev.terra-umbra.fr/cms
      DB_CLIENT: pg
      DB_HOST: recette-db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      TELEMETRY: "false"
      WEBSOCKETS_ENABLED: "false"
      # Pas d'envoi d'e-mails depuis le site d'essai.
      EMAIL_TRANSPORT: sendmail
      EMAIL_SENDMAIL_PATH: /bin/false
    volumes:
      - recette-directus-uploads:/directus/uploads
      # Éditeur du corps des articles (infrastructure/recette/directus-extensions).
      - ./directus-extensions:/directus/extensions:ro
    depends_on:
      recette-db:
        condition: service_healthy
    networks:
      - recette
      - caddy

volumes:
  recette-postgres:
  recette-editor-media:
  recette-directus-uploads:

networks:
  recette:
  caddy:
    external: true
    name: tuc-v2_frontend
